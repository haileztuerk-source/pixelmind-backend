# Weckt den Render-Dienst "chartterminal" morgens auf und haelt ihn bis
# abends wach.
#
# Ein schlafender Free-Dienst wacht nur durch eine Anfrage von aussen auf.
# Der eigene Ping in terminal/keepalive.py kann das nicht: er schlaeft mit
# dem Dienst. Ohne diesen Job begruesst einen deshalb fast jeder Aufruf mit
# Renders "Service waking up" und einer knappen Minute Wartezeit.
#
# Fenster: Mo-Fr 05:00-20:59 UTC = 07:00-22:59 MESZ (06:00-21:59 MEZ).
# Rund 16 h x 22 Tage = 350 der 750 Freistunden im Monat - genug Rest
# fuer pixelmind-backend. Actions-Minuten kosten in oeffentlichen Repos
# nichts.
#
# Zeitplaene laufen nur vom Standardzweig (main). GitHub schaltet sie nach
# 60 Tagen ohne Aktivitaet im Repo ab; dann unter Actions wieder aktivieren.
name: ChartTerminal wachhalten

on:
  schedule:
    # Alle 5 Minuten, versetzt von der vollen Stunde, zu der GitHub
    # geplante Laeufe am ehesten verschiebt oder auslaesst.
    - cron: "2-59/5 5-20 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health aufrufen
        run: |
          curl -sS --fail --retry 3 --retry-delay 20 --retry-all-errors -m 90 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://chartterminal.onrender.com/health
