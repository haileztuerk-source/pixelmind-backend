<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChartTerminal">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>ChartTerminal</title>
<style>
/* Rollenfarben statt Quellfarben — Redesign 03.09.
   Gold = Widerstand, Türkis = Support, Beige = Pivot, Violett = Agent.
   Woher ein Level stammt, steht im Text, nie in der Farbe. */
:root{
  /* ── Grund ─────────────────────────────────────────────────────────
     Nahezu neutrales Schwarz mit minimalem Kaelteanteil. Die Flaeche
     traegt keine Bedeutung, damit die Overlays sie tragen koennen. */
  --ground:#0A0C11; --panel:#11141B; --panel-2:#161A22; --panel-3:#1D222C;
  --line:#28303C; --line-soft:#1C222B;
  --ink:#ECEFF4; --ink-dim:#8B97A8; --ink-faint:#5A6675;

  /* ── Daten: was ein Level bedeutet ─────────────────────────────────
     Gold und Violett wie in der Vorlage. Jede dieser Farben steht fuer
     eine Seite des Marktes und fuer nichts anderes. */
  --resist:#E0A93C;   /* Call-Seite, Widerstand */
  --support:#A97BE8;  /* Put-Seite, Support */
  --pivot:#CFC6B2;    /* Pivot, Zero-Gamma, Max Pain */
  --struct:#5B6A7D;   /* Struktur: POC, Vortagesmarken */
  --va:#9E4756;       /* Value Area: wo 70 % des Volumens liefen */

  /* ── Stimme ────────────────────────────────────────────────────────
     Der Agent bekommt das freigewordene Tuerkis. Kuehl, klar von Gold
     und Violett getrennt, und nie an einem Level. */
  --agent:#46C4BC;

  /* ── Zustand: kein Datum, sondern eine Lage ────────────────────────
     Regime, Kursveraenderung, Frische. Bewusst getrennt von den
     Datenfarben, damit "LONG" nicht wie eine Put-Wand aussieht. */
  --pos:#4FB477; --neg:#E5705A;
  --live:#4FB477; --warn:#E5705A;

  /* ── Kerzen ────────────────────────────────────────────────────────
     Neutral gehalten. Traegt der Kurs selbst Farbe, konkurriert er mit
     den Overlays - dasselbe macht die Vorlage. */
  --up:#C2CBD6; --down:#4A5563;

  --mono:ui-monospace,"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --tabh:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;overflow:hidden;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--resist);outline-offset:2px;border-radius:6px}

/* ============ Kopfzeile ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:32;
  padding:calc(var(--st) + 9px) 14px 9px;display:flex;align-items:center;gap:11px;
  background:color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  transition:transform .24s cubic-bezier(.32,.72,0,1), opacity .2s ease;
}
/* Verlauf unter der Chrome: der Chart laeuft darunter weiter und bleibt
   trotzdem lesbar - dieselbe Loesung wie in Vollbild-Feeds. */
.topbar::after{
  content:"";position:absolute;left:0;right:0;top:100%;height:22px;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--ground) 70%,transparent), transparent);
}
body.immersive .topbar,body.immersive .strip,body.immersive .tabbar{
  transform:translateY(var(--hide,-110%));opacity:0;pointer-events:none;
}
body.immersive .tabbar{--hide:110%}
.strip.tucked{transform:translateY(calc(-100% - var(--topbar-h,62px)));opacity:0}
.idbtn{display:flex;align-items:center;gap:5px;min-height:44px;padding-right:6px}
.idbtn .nm{font-size:19px;font-weight:800;letter-spacing:-.02em}
.idbtn .car{color:var(--ink-faint);font-size:11px;margin-top:2px}
.price-wrap{margin-left:auto;text-align:right;line-height:1.2}
.price{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chg{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.chg.up{color:var(--pos)} .chg.dn{color:var(--neg)}
.rg{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-dim);
  letter-spacing:.02em;white-space:nowrap;
}
.rg.long{color:var(--pos);border-color:rgba(79,180,119,.42);background:rgba(79,180,119,.11)}
.rg.short{color:var(--neg);border-color:rgba(229,112,90,.42);background:rgba(229,112,90,.11)}
.rg i{width:5px;height:5px;border-radius:50%;background:currentColor}

/* ============ Marktleiste ============ */
.strip{
  position:fixed;top:var(--topbar-h,62px);left:0;right:0;z-index:31;
  display:flex;gap:8px;padding:9px 14px;overflow-x:auto;scrollbar-width:none;
  background:color-mix(in srgb, var(--ground) 76%, transparent);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  transition:transform .28s cubic-bezier(.32,.72,0,1), opacity .2s ease;
}
.strip::-webkit-scrollbar{display:none}
.mchip{
  flex:none;min-width:86px;padding:8px 11px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--line-soft);text-align:left;
}
.mchip.on{border-color:var(--resist);background:rgba(224,169,60,.11)}
.mchip .k{font-size:11.5px;font-weight:700;color:var(--ink-dim)}
.mchip.on .k{color:var(--resist)}
.mchip .p{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.mchip .c{font-family:var(--mono);font-size:10px;margin-top:1px;color:var(--ink-faint)}
.mchip .c.up{color:var(--pos)} .mchip .c.dn{color:var(--neg)}

/* ============ Ansichten ============ */
.track{
  flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;
}
.track::-webkit-scrollbar{display:none}
.view{
  flex:none;width:100%;scroll-snap-align:start;overflow-y:auto;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;position:relative;
}
.view.chart{overflow:hidden}
.pad{padding:calc(var(--chrome-h,124px) + 12px) 14px calc(20px + var(--sb))}

/* Chart */
.cvwrap{position:absolute;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
.meta{
  position:absolute;left:8px;top:calc(var(--chrome-h,124px) + 6px);font-family:var(--mono);font-size:9.5px;
  color:var(--ink-faint);line-height:1.4;pointer-events:none;white-space:nowrap;
  background:color-mix(in srgb, var(--ground) 62%, transparent);
  border:1px solid var(--line-soft);border-radius:7px;padding:3px 8px;font-size:9px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.tfbar{
  position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;align-items:center;
  padding:0 10px;
}
/* Zeitebenen duerfen scrollen, die Werkzeuge nicht: sonst rutschen sie auf
   schmalen Geraeten aus dem Bild und sind nur per Wischen erreichbar. */
.tfscroll{
  flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
}
.tfscroll::-webkit-scrollbar{display:none}
.tficons{flex:none;display:flex;gap:6px}
.tfc{
  flex:none;min-width:44px;height:44px;padding:0 10px;border-radius:12px;
  background:rgba(20,27,37,.92);border:1px solid var(--line);
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
}
.tfc.on{background:var(--resist);border-color:var(--resist);color:#17130A}
.tfc.icon{min-width:44px}

.cross{
  position:absolute;left:10px;top:10px;background:rgba(20,27,37,.95);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:11px;line-height:1.6;
  pointer-events:none;display:none;backdrop-filter:blur(8px);
}
.cross.on{display:block}

/* ============ Karten ============ */
.sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:20px 2px 9px}
.sec:first-child{margin-top:2px}
.card{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;
}
.card.role{border-left:3px solid var(--c,var(--line))}
.ch{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ch b{font-family:var(--mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ch .tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;
  background:var(--panel-3);color:var(--ink-dim)}
.ch .tag.held{background:rgba(79,180,119,.16);color:var(--pos)}
.ch .tag.broken{background:rgba(229,112,90,.16);color:var(--neg)}
.ch .tag.tested{background:rgba(217,164,65,.16);color:var(--resist)}
.ch .far{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums}
.cs{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.5}
.cm{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:6px;
  display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:38px 20px;line-height:1.6}

/* Kennzahlen-Raster */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.tile{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:13px;padding:12px 13px}
.tile .l{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .n{font-size:11px;color:var(--ink-dim);margin-top:4px;line-height:1.4}

/* Balkenzeilen */
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.brow:last-child{border-bottom:none}
.brow .k{font-family:var(--mono);font-size:13px;font-weight:700;min-width:66px;font-variant-numeric:tabular-nums}
.brow .bar{flex:1;height:9px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--c,var(--line));border-radius:3px}
.brow .v{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);min-width:54px;text-align:right}

/* Agent */
.msg{padding:12px 13px;border-radius:13px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.msg .mh{font-family:var(--mono);font-size:9.5px;margin-bottom:6px;display:flex;gap:8px;align-items:center;
  letter-spacing:.05em}
.msg .mh .ts{margin-left:auto;color:var(--ink-faint)}
.msg.proactive{background:var(--panel-2);border-left:3px solid var(--agent)}
.msg.proactive .mh{color:var(--agent)}
.msg.user{background:rgba(224,169,60,.10);border:1px solid rgba(224,169,60,.28);margin-left:30px}
.msg.user .mh{color:var(--resist)}
.msg.agent{background:var(--panel-2);border-left:3px solid var(--line)}
.msg.agent .mh{color:var(--ink-faint)}
.msg .why{font-size:11px;color:var(--ink-faint);margin-top:7px;font-style:italic}
.composer{
  position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(4px + var(--sb));
  background:linear-gradient(transparent,var(--ground) 22%);
}
.composer input{
  flex:1;min-width:0;height:44px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:22px;padding:0 16px;color:var(--ink);font-size:15px;user-select:text;
}
.composer button{
  height:44px;padding:0 18px;border-radius:22px;background:var(--resist);color:#17130A;
  font-size:14px;font-weight:700;
}
.composer button:disabled{opacity:.4}

/* Plan */
.plan h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--resist);margin:20px 0 8px}
.plan h4:first-child{margin-top:0}
.plan p{font-size:13.5px;line-height:1.62;margin:0 0 8px}
.plan ul{margin:0;padding-left:18px}
.plan li{font-size:13.5px;line-height:1.6;margin-bottom:7px}
.bias{display:inline-block;font-size:12px;font-weight:700;background:rgba(224,169,60,.13);
  border:1px solid rgba(224,169,60,.35);color:var(--resist);padding:6px 12px;border-radius:9px;margin-bottom:9px}
.upd{border-left:3px solid var(--agent);background:var(--panel-2);border-radius:0 10px 10px 0;
  padding:11px 13px;margin-top:9px;font-size:13px;line-height:1.55}
.upd .t{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-bottom:5px}
.foot{font-size:11px;color:var(--ink-faint);line-height:1.55;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--line-soft)}

/* ============ Bottom-Navigation ============ */
.tabbar{
  flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line-soft);
  padding-bottom:var(--sb);
}
.tb{
  flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-faint);position:relative;
}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tb span{font-size:9.5px;font-weight:600;letter-spacing:.02em}
.tb.on{color:var(--resist)}
.tb .badge{position:absolute;top:7px;right:calc(50% - 17px);width:7px;height:7px;
  border-radius:50%;background:var(--agent);border:1.5px solid var(--panel)}

/* ============ Sheets ============ */
.scrim{position:fixed;inset:0;background:rgba(4,7,11,.62);z-index:80;opacity:0;
  pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--panel-2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:82vh;overflow-y:auto;padding-bottom:calc(12px + var(--sb));
}
.sheet.on{transform:translateY(0)}
.grabzone{padding:10px 0 6px;cursor:grab;touch-action:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;padding:0 18px 4px}
.sh-close{
  margin-left:auto;width:44px;height:44px;border-radius:22px;background:var(--panel-3);
  border:1px solid var(--line);color:var(--ink-dim);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.sh-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);padding:8px 18px 4px}
.si{display:flex;align-items:center;gap:13px;padding:15px 18px;min-height:56px;
  border-top:1px solid var(--line-soft);font-size:15px}
.si .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-faint);flex:none;
  display:flex;align-items:center;justify-content:center}
.si.on .box{background:var(--resist);border-color:var(--resist)}
.si.on .box::after{content:"";width:9px;height:5px;border-left:2px solid #17130A;
  border-bottom:2px solid #17130A;transform:rotate(-45deg) translate(1px,-1px)}
.si .sub{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.si.sel{color:var(--resist);font-weight:600}
.sh-n{padding:13px 18px;font-size:11.5px;color:var(--ink-faint);line-height:1.55;
  border-top:1px solid var(--line-soft)}

/* Aktualisieren */
.refresh{
  position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:5;
  font-size:11px;color:var(--ink-faint);font-family:var(--mono);opacity:0;transition:opacity .2s
}
.refresh.on{opacity:1}

/* ---------- Tiefe und Rueckmeldung ---------- */
.card{
  background:linear-gradient(180deg,var(--panel-2),color-mix(in srgb,var(--panel-2) 88%, #000));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px -12px rgba(0,0,0,.8);
}
.tile{
  background:linear-gradient(180deg,var(--panel-2),color-mix(in srgb,var(--panel-2) 90%, #000));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.topbar{box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.tabbar{box-shadow:0 -8px 22px -18px rgba(0,0,0,.9)}

/* Druck sichtbar machen - ein Ziel, das nachgibt, fuehlt sich verlaesslich an */
.tb:active,.mchip:active,.tfc:active,.pill:active,.si:active{transform:scale(.965)}
.tb,.mchip,.tfc,.si{transition:transform .09s ease, color .15s ease, background .15s ease}
.card{transition:transform .09s ease}
.card:active{transform:scale(.99)}

/* Aktiver Reiter bekommt einen Lichtpunkt statt nur Farbe */
.tb.on::before{
  content:"";position:absolute;top:5px;width:16px;height:2px;border-radius:2px;
  background:var(--resist);box-shadow:0 0 8px var(--resist);
}

/* Ladezustand: Platzhalter in der Form des Inhalts statt "lädt…" */
.skel{padding:14px 0}
.skel i{
  display:block;height:58px;border-radius:13px;margin-bottom:9px;
  background:linear-gradient(90deg,var(--panel-2) 0%,var(--panel-3) 50%,var(--panel-2) 100%);
  background-size:200% 100%;animation:shim 1.4s ease-in-out infinite;
}
.skel i:nth-child(2){animation-delay:.12s} .skel i:nth-child(3){animation-delay:.24s}
@keyframes shim{0%{background-position:120% 0}100%{background-position:-120% 0}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <button class="idbtn" id="idbtn">
    <span class="nm" id="sym">NDX</span><span class="car">▾</span>
  </button>
  <span class="rg" id="regime"><i></i><span>…</span></span>
  <div class="price-wrap">
    <div class="price tnum" id="spot">—</div>
    <div class="chg tnum" id="chg">—</div>
  </div>
</header>

<nav class="strip" id="strip"></nav>

<main class="track" id="track">
  <section class="view chart" id="v-chart">
    <div class="cvwrap" id="cvwrap">
      <canvas id="cv"></canvas>
      <div class="meta" id="meta"></div>
      <div class="cross" id="cross"></div>
      <div class="tfbar" id="tfbar"></div>
    </div>
  </section>
  <section class="view" id="v-level"><div class="pad" id="p-level"><div class="skel"><i></i><i></i><i></i></div></div></section>
  <section class="view" id="v-gamma"><div class="pad" id="p-gamma"><div class="skel"><i></i><i></i><i></i></div></div></section>
  <section class="view" id="v-agent"><div class="pad" id="p-agent"><div class="skel"><i></i><i></i><i></i></div></div></section>
  <section class="view" id="v-plan"><div class="pad" id="p-plan"><div class="skel"><i></i><i></i><i></i></div></div></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tb on" data-v="0"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg><span>Chart</span></button>
  <button class="tb" data-v="1"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg><span>Level</span></button>
  <button class="tb" data-v="2"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8v8M19 8v8M8.5 5.5v13M15.5 5.5v13"/></svg><span>Gamma</span></button>

<script>
"use strict";

const S = {
  market:"NQ", tf:"15m", data:null, plan:null, messages:[], overview:[],
  view:0, profileMode:"heat", layers:{tpo:false, va:true, gpbox:true, gcurve:false, orbs:true, fix:true, live:true, zonen:true, profil:true, session:true},
  fitAll:false, immersive:false, lastMsgCount:0, busy:false, cross:null, trails:null,
};
const TFS = ["1m","5m","15m","30m","1h","1d"];
const SYM = {NQ:"NDX", ES:"SPX", YM:"DJX", RTY:"RUT", GC:"GLD"};

const $ = id => document.getElementById(id);
const fmt = (v,d=0) => (v==null||isNaN(v)) ? "—"
  : v.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtM = v => v==null ? "—" : (Math.abs(v)>=1e9 ? (v/1e9).toFixed(1)+" Mrd"
  : Math.abs(v)>=1e6 ? (v/1e6).toFixed(0)+" Mio" : (v/1e3).toFixed(0)+"k");
const sgn = v => v==null ? "—" : (v>=0?"+":"")+fmt(v);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm = iso => { try{ return new Date(iso).toLocaleTimeString("de-DE",
  {hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/** Kurse weich auf den neuen Wert zaehlen statt springen zu lassen.
    Bei einer Zahl, die sich alle 20 Sekunden aendert, macht der Sprung
    aus einer kleinen Bewegung eine grosse - das Zaehlen zeigt die
    Richtung, ohne sie zu uebertreiben. */
const _ticks = new WeakMap();
function tickTo(el, val, dur=520){
  if(val==null || isNaN(val)){ el.textContent="—"; return; }
  const from = _ticks.get(el);
  _ticks.set(el, val);
  if(from==null || Math.abs(val-from) < 0.01 || !window.requestAnimationFrame){
    el.textContent = fmt(val); return;
  }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now-t0)/dur);
    const e = 1 - Math.pow(1-k, 3);          // sanft auslaufend
    el.textContent = fmt(from + (val-from)*e);
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ======================= Laden =======================
async function load(){
  try{
    const r = await fetch(`/api/state?market=${S.market}&tf=${S.tf}`);
    if(!r.ok) throw 0;
    const d = await r.json();
    const fresh = !S.data || S.data.market!==d.market || S.data.interval!==d.interval;
    S.data = d;
    if(fresh || !S.view0) fitView();
    S.view0 = true;
    render();
  }catch(e){}
}
async function loadTrails(){
  try{
    S.trails = await (await fetch(`/api/trails?market=${S.market}`)).json();
    draw();
  }catch(e){}
}
async function loadOverview(){
  try{ S.overview = await (await fetch("/api/overview")).json(); renderStrip(); }catch(e){}
}
async function loadMessages(){
  try{
    const d = await (await fetch(`/api/agent/messages?market=${S.market}`)).json();
    S.messages = d.messages||[]; S.budget = d.budget;
    if(S.messages.length > S.lastMsgCount){
      if(S.view!==3){ $("badge").hidden=false; buzz(12); }
      S.lastMsgCount = S.messages.length;
    }
    renderAgent();
  }catch(e){}
}
async function loadPlan(){
  try{ S.plan = await (await fetch(`/api/agent/plan?market=${S.market}`)).json(); renderPlan(); }
  catch(e){}
}

// ======================= Chart =======================
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,dpr=1;
const PAD={r:56,b:68,t:6};
let CHROME=124;

function measureChrome(){
  const tb = $("topbar")?.offsetHeight || 62;
  const st = $("strip")?.offsetHeight || 62;
  CHROME = tb + st;
  document.documentElement.style.setProperty("--topbar-h", tb+"px");
  document.documentElement.style.setProperty("--chrome-h", CHROME+"px");
}

function resize(){
  measureChrome();
  const w=$("cvwrap");
  // Bis Faktor 3 statt 2: ein iPhone Pro zeichnet damit auf dem echten
  // Panelraster statt auf zwei Dritteln davon.
  dpr = Math.min(devicePixelRatio||1, 3);
  W=w.clientWidth; H=w.clientHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textRendering = "geometricPrecision";
  ORB_SPRITES.clear();
  draw();
}

/** Auf das Geraetepixel rasten. Eine Linie auf halbem CSS-Pixel ist bei
    Faktor 3 kein halbes Geraetepixel mehr und wird grau ausgefranst. */
function snap(v){ return Math.round(v*dpr)/dpr; }
/** Mittiger Versatz fuer haarscharfe 1px-Linien, abhaengig vom Faktor. */
function half(){ return 0.5/dpr; }
function fitView(){
  const n=(S.data?.bars||[]).length; if(!n){ S.vw=null; return; }
  const want=Math.min(n, S.tf==="1d"?90:70);
  S.vw={i0:Math.max(0,n-want), i1:n};
}
function span(){ return S.vw ? S.vw.i1-S.vw.i0 : 0; }
function clampView(){
  const n=(S.data?.bars||[]).length; if(!n||!S.vw) return;
  const sp=Math.max(10, Math.min(n, S.vw.i1-S.vw.i0));
  S.vw.i0=Math.max(0, Math.min(n-sp, S.vw.i0)); S.vw.i1=S.vw.i0+sp;
}
function vbars(){
  const b=S.data?.bars||[]; if(!b.length) return [];
  const v=S.vw||{i0:0,i1:b.length};
  return b.slice(Math.max(0,Math.floor(v.i0)), Math.min(b.length,Math.ceil(v.i1)));
}


/** Fasst fixe Level auf demselben Preis zusammen: eine Marke, mehrere Gründe. */
function mergedFixed(){
  const lv = S.data?.fixed?.levels || [];
  const rank = {untested:0, tested:1, held:2, broken:3};
  const by = new Map();
  lv.forEach(l=>{
    const k = Math.round(l.price);
    const cur = by.get(k);
    if(!cur){ by.set(k, {...l, labels:[l.label]}); return; }
    cur.labels.push(l.label);
    if(rank[l.state] > rank[cur.state]) cur.state = l.state;
    cur.exams_total = Math.max(cur.exams_total, l.exams_total);
    cur.exams_held = Math.max(cur.exams_held||0, l.exams_held||0);
    cur.exams_broken = Math.max(cur.exams_broken||0, l.exams_broken||0);
    if(Math.abs(l.drift||0) > Math.abs(cur.drift||0)){ cur.drift=l.drift; cur.live=l.live; }
    if(l.born < cur.born) cur.born = l.born;
  });
  return [...by.values()].sort((a,b)=>b.price-a.price);
}

/** Fixe Level aus dem Zonenbuch, dazu optional der laufende Stand als Geist. */
/** Farbe nach Art des Levels, nicht nach seiner Lage zum Kurs.

    Eine Call-Wand bleibt Gold, auch wenn der Kurs darueber steigt; ein
    Zero-Gamma bleibt Pivot, auch wenn es unter dem Kurs liegt. Vorher
    faerbte die Lage - dann leuchtete das Zero-Gamma wie eine Put-Wand
    und behauptete etwas, das es nicht ist. */
function levelColor(kind){
  if(/^call/.test(kind)) return "--resist";
  if(/^put/.test(kind))  return "--support";
  if(/flip|pain|pin/.test(kind)) return "--pivot";
  return "--struct";
}

function chartLevels(){
  const d=S.data; if(!d) return [];
  const out=[];
  const roleCol = p => p>d.spot*1.0015 ? "--resist" : p<d.spot*0.9985 ? "--support" : "--pivot";
  if(S.layers.fix) mergedFixed().forEach(l=>{
    out.push({p:l.price, lab:l.labels.join(" · "), c:levelColor(l.kind),
      w:/_2|_3/.test(l.kind)?1:1.8,
      dash:l.state==="broken"?[2,3]:null, dim:l.state==="broken"?.55:1, badge:true});
  });
  if(S.layers.live){
    // Geisterlinien: wohin die Wand seit dem Einfrieren gewandert ist.
    mergedFixed().forEach(l=>{
      if(l.live && l.drift && Math.abs(l.drift) > (d.atr||1)*0.03)
        out.push({p:l.live, lab:"", c:levelColor(l.kind), w:1, dash:[1,5], dim:.4, badge:false});
    });
  }
  if(S.layers.session){
    const s=d.session||{}, vp=d.vp||{};
    if(vp.poc) out.push({p:vp.poc, lab:"POC", c:"--pivot", w:1, dash:[1,4], dim:.85, badge:true});
    if(s.pdh) out.push({p:s.pdh, lab:"PDH", c:"--pivot", w:1, dash:[1,4], dim:.6, badge:true});
    if(s.pdl) out.push({p:s.pdl, lab:"PDL", c:"--pivot", w:1, dash:[1,4], dim:.6, badge:true});
  }
  return out;
}

/** Zeitstempel auf die X-Achse abbilden - ueber die Bars, nicht linear.
    Zwischen zwei Sitzungen klafft eine Luecke, die eine reine
    Zeitrechnung falsch auffuellen wuerde. */
function tToX(ts, bars, bw){
  const n = bars.length;
  if(n < 2) return bw/2;
  if(ts <= bars[0].t) return bw/2;
  if(ts >= bars[n-1].t){
    const step = bars[n-1].t - bars[n-2].t || 60;
    return Math.min(n - 1 + (ts - bars[n-1].t)/step, n - 0.5)*bw + bw/2;
  }
  let lo=0, hi=n-1;
  while(lo < hi-1){ const m=(lo+hi)>>1; if(bars[m].t <= ts) lo=m; else hi=m; }
  const span = (bars[hi].t - bars[lo].t) || 1;
  return (lo + (ts - bars[lo].t)/span)*bw + bw/2;
}

/** Volumenprofil, zweigeteilt nach gehandelter Optionsseite.

    Cboe liefert je Minute getrennt Call- und Put-Volumen. Ein Preisband,
    an dem fast nur Puts liefen, bedeutet etwas anderes als eines mit
    ueberwiegend Calls - auch wenn die Gesamtsumme dieselbe ist. Deshalb
    faerbt sich jeder Balken zwischen Tuerkis (Put-lastig) und Gold
    (Call-lastig) ein, statt einheitlich grau zu bleiben.

    Dazu markiert: Value Area, POC, Volumenknoten und Vakuum-Zonen. */
/** TPO als Blockreihen - eine Zelle je Periode, in der der Preis
    beruehrt wurde. Bewusst anders gezeichnet als das Volumenprofil:
    das eine ist eine Flaeche (wie viel), das andere sind zaehlbare
    Bloecke (wie oft). Wer beide sieht, soll sie nicht verwechseln.

    Das TPO bekommt eine eigene abgedunkelte Spalte statt frei ueber den
    Kerzen zu liegen. Ohne sie standen elf deckende Bloecke je Reihe vor
    dem Chart und die Kerzen der ersten Handelsstunde waren nicht mehr
    lesbar - zwei Ebenen, die sich gegenseitig ausloeschen. Mit eigener
    Spalte bleibt es das, was es sein soll: ein Streifen neben dem
    Chart, den man abzaehlen kann. */
function drawTPO(ctx, y, pw, ph, topPad, V){
  const tp = S.data?.tpo;
  if(!tp || !(tp.bins||[]).length) return;
  const x0 = (S.layers.profil ? Math.min(pw*0.19, 74) + 5 : 2) + 4;
  const cell = 3.0, gap = 1.0;
  const maxCells = Math.max(1, Math.floor(Math.min(52, pw*0.14) / (cell+gap)));
  const colW = maxCells*(cell+gap) + 8;
  const rowH = Math.max(1.2, ph / (tp.bins_n || 180));

  // Eigene Spalte: ein dunkler Grund, damit die Bloecke gegen ihn
  // zaehlbar sind und nicht gegen die Kerzen dahinter.
  // Die Spalte reicht nur so weit wie die Sitzung, die sie beschreibt -
  // nicht ueber die ganze Charthoehe. Ueber die volle Hoehe gezogen lief
  // sie als heller Balken durch den leeren Bereich unterhalb der Kerzen
  // und sah aus wie ein Zeichenfehler.
  const cTop = Math.max(topPad, y(tp.hi)), cBot = Math.min(topPad+ph, y(tp.lo));
  if(cBot - cTop < 8) return;
  ctx.save();
  // Nicht ganz deckend: die Kerzen dahinter bleiben schemenhaft
  // sichtbar. Deckend war die Spalte ein Loch im Chart, durchsichtig
  // waren die Bloecke nicht mehr abzaehlbar - das hier ist die Mitte.
  const bgGrad = ctx.createLinearGradient(x0-4, 0, x0-4+colW, 0);
  bgGrad.addColorStop(0, V("--ground")); bgGrad.addColorStop(1, V("--panel"));
  ctx.fillStyle = bgGrad; ctx.globalAlpha = .62;
  ctx.fillRect(x0-4, cTop, colW, cBot-cTop);
  ctx.globalAlpha = .5; ctx.strokeStyle = V("--panel-3"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(snap(x0-4+colW), cTop);
  ctx.lineTo(snap(x0-4+colW), cBot); ctx.stroke();
  ctx.globalAlpha = 1;

  // Initial Balance: die Spanne der ersten beiden Perioden. Der Bereich,
  // gegen den der Rest des Tages gemessen wird.
  if(tp.ib_low && tp.ib_high){
    const y1=Math.min(y(tp.ib_high), y(tp.ib_low)), y2=Math.max(y(tp.ib_high), y(tp.ib_low));
    ctx.fillStyle=V("--struct"); ctx.globalAlpha=.14;
    ctx.fillRect(x0-4, y1, colW, Math.max(1,y2-y1));
    ctx.globalAlpha=.55; ctx.strokeStyle=V("--struct"); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0-3, y1); ctx.lineTo(x0-3, y2); ctx.stroke();
    ctx.globalAlpha=1;
  }

  tp.bins.forEach(b=>{
    if(!b.n) return;
    const yy = y(b.p);
    if(yy < topPad-1 || yy > topPad+ph+1) return;
    const n = Math.min(maxCells, b.n);
    // Farbe nach Anzahl der Perioden - blau fuer die Preise, durch die
    // der Markt nur streifte, rot fuer die, an denen er den halben Tag
    // stand. Beim TPO traegt die Farbe echte zusaetzliche Information:
    // die Blockzahl je Zeile ist auf die Spaltenbreite gedeckelt, die
    // Farbe ist es nicht.
    const c = heat(b.w);
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.globalAlpha = b.va ? .92 : .62;
    for(let i=0;i<n;i++)
      ctx.fillRect(x0 + i*(cell+gap), snap(yy - rowH/2), cell, Math.max(1, rowH));
  });
  ctx.globalAlpha=1;

  // Single Prints: Preise, die nur eine einzige Periode gesehen haben -
  // dort ist der Markt ohne Gegenwehr durchgelaufen.
  (tp.singles||[]).forEach(p=>{
    const yy=snap(y(p))+half();
    if(yy < topPad || yy > topPad+ph) return;
    ctx.strokeStyle=V("--resist"); ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0-4,yy); ctx.lineTo(x0-1,yy); ctx.stroke();
  });
  ctx.globalAlpha=1;

  if(tp.poc){
    const yy=snap(y(tp.poc))+half();
    ctx.strokeStyle=V("--pivot"); ctx.globalAlpha=.85; ctx.lineWidth=1.2;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x0-4,yy); ctx.lineTo(x0-4+colW,yy); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }

  // Beschriftung der Spalte, damit sie nicht fuer ein zweites
  // Volumenprofil gehalten wird.
  ctx.font="7px "+V("--mono"); ctx.fillStyle=V("--struct");
  ctx.textAlign="left"; ctx.globalAlpha=.8;
  ctx.fillText("TPO "+tp.brackets+"\u00d7"+tp.bracket_min+"m", x0+2, cBot-3);
  ctx.globalAlpha=1;
  ctx.restore();
}

/** Farbverlauf des Profils nach Volumenstaerke - blau, gruen, gelb, rot.
    Uebernommen aus der Desktop-Vorlage: die Farbe verstaerkt dort die
    Balkenlaenge, statt eine zweite Groesse zu kodieren. Der Blick findet
    den POC dadurch ohne Suchen. */
const HEAT = [[46,86,168],[38,150,190],[52,168,120],[150,190,70],
              [224,180,60],[220,120,50],[196,60,58]];
function heat(t){
  t = Math.max(0, Math.min(0.999, t));
  const f = t*(HEAT.length-1), i = Math.floor(f), k = f-i;
  const a = HEAT[i], b = HEAT[Math.min(HEAT.length-1, i+1)];
  return [Math.round(a[0]+(b[0]-a[0])*k),
          Math.round(a[1]+(b[1]-a[1])*k),
          Math.round(a[2]+(b[2]-a[2])*k)];
}

function drawProfile(ctx, y, pw, ph, topPad, V, loP, hiP){
  const vp = S.data.vp;
  const maxW = Math.min(pw*0.19, 74);
  // Keine Untergrenze mehr: bei 1000 Baendern erzwang die alte Klemme
  // von 1,1 Pixel eine Gesamthoehe von 1100 Pixeln auf 600 verfuegbaren.
  const rowH = ph / (vp.bins_n || 1000);
  const gold = [224,169,60], violet = [169,123,232], flat = [91,106,125];
  const cream = [207,198,178], slate = [91,106,125];

  // Value Area ueber die ganze Chartbreite, nicht nur hinter dem Profil.
  // Sie ist eine Aussage ueber den Kursbereich, nicht ueber den Streifen:
  // hier liefen 70 Prozent des Volumens, und der Kurs kehrt dorthin
  // ueberdurchschnittlich oft zurueck.
  if(S.layers.va && vp.val && vp.vah){
    const y1=Math.min(y(vp.vah), y(vp.val)), y2=Math.max(y(vp.vah), y(vp.val));
    const h=Math.abs(y2-y1);
    const g=ctx.createLinearGradient(0,y1,0,y2);
    g.addColorStop(0,   "rgba(158,71,86,.05)");
    g.addColorStop(0.5, "rgba(158,71,86,.15)");
    g.addColorStop(1,   "rgba(158,71,86,.05)");
    ctx.fillStyle=g; ctx.fillRect(0, y1, pw, h);
    // Kanten: VAH und VAL sind die Marken, an denen sich entscheidet,
    // ob der Kurs in der Spanne bleibt oder sie verlaesst.
    ctx.strokeStyle=V("--va"); ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    [y1,y2].forEach(yy=>{
      const ly=snap(yy)+half();
      ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(pw,ly); ctx.stroke();
    });
    ctx.setLineDash([]); ctx.globalAlpha=1;
    ctx.font="8px "+V("--mono"); ctx.fillStyle=V("--va"); ctx.textAlign="right";
    ctx.globalAlpha=.85;
    ctx.fillText("VAH", pw-4, y1+10); ctx.fillText("VAL", pw-4, y2-4);
    ctx.globalAlpha=1; ctx.textAlign="left";
  }

  // Baender zeichnen. Bei 1000 Baendern ist eine Zeile auf dem Telefon
  // etwa 0,6 CSS-Pixel hoch, auf einem 3x-Display also knapp zwei
  // Geraetepixel. Deshalb hier KEIN Runden auf ganze Pixel: gerundet
  // fielen fast zwei Drittel der Zeilen auf dieselbe Bildzeile und
  // ueberschrieben einander, aus 1000 Baendern wurden sichtbar 600.
  // Ungerundet mischt die Leinwand die Zeilen korrekt - das ist keine
  // Unschaerfe, sondern die richtige Verkleinerung.
  const W_ = vp.w || [], CS = vp.cs || [], nB = vp.bins_n || W_.length;
  const bLo = vp.lo, bStep = vp.step;
  const va0 = vp.va0 == null ? -1 : vp.va0, va1 = vp.va1 == null ? -2 : vp.va1;
  // Nur die sichtbaren Baender durchlaufen. Der Preis ist linear im
  // Index, also laesst sich der sichtbare Ausschnitt direkt ausrechnen,
  // statt 1000 mal zu pruefen und zu verwerfen.
  let i0 = Math.floor((loP - bLo)/bStep) - 1;
  let i1 = Math.ceil((hiP - bLo)/bStep) + 1;
  i0 = Math.max(0, i0); i1 = Math.min(nB-1, i1);
  // Winziger Ueberstand, damit zwischen zwei Zeilen keine Haarlinie
  // durchscheint, wo die Kantenglaettung beide zur Haelfte deckt.
  const over = 0.5/dpr;
  for(let i=i0;i<=i1;i++){
    const w = W_[i]|0;
    if(w <= 4) continue;
    const yy = y(bLo + (i+0.5)*bStep);
    const inVA = i >= va0 && i <= va1;
    let rgb, alpha;
    if(S.profileMode === "heat"){
      // Value Area in Creme bis Weiss, ausserhalb gedaempftes
      // Schiefergrau. Die Staerke steckt schon in der Balkenlaenge -
      // die Farbe muss sie nicht ein zweites Mal erzaehlen und traegt
      // stattdessen die Frage, die man beim Blick auf ein
      // Volumenprofil zuerst stellt: liegt dieser Preis drinnen oder
      // draussen. Die Helligkeit staffelt innerhalb beider Bereiche
      // noch nach Gewicht, damit die Struktur nicht flach wird.
      const t = w/1000;
      rgb = inVA ? cream.map((c,j)=> Math.round(c + (255-c)*t*0.55))
                 : slate;
      alpha = inVA ? 0.58 + 0.40*t : 0.26 + 0.30*t;
    } else {
      // Rollenfarben: Faerbung nach gehandelter Optionsseite.
      // Die Empfindlichkeit ist auf 25 Prozentpunkte um die Mitte
      // gestellt, nicht auf die vollen 0 bis 100. Gemessen schwankt der
      // Call-Anteil je Band real zwischen 31 und 59 Prozent - gegen die
      // volle Skala gerechnet blieb davon ein Farbausschlag von einem
      // Drittel uebrig und das ganze Profil sah einheitlich grau aus.
      // 25 Prozent Call gegen 75 Prozent Call ist ein klarer Befund und
      // darf die Farbe ausreizen.
      const t = Math.max(-1, Math.min(1, ((CS[i]==null?50:CS[i]) - 50)/25));
      const to = t >= 0 ? gold : violet, k = Math.abs(t);
      rgb = flat.map((f,j)=> Math.round(f + (to[j]-f)*k));
      alpha = inVA ? 0.50 : 0.24;
    }
    ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
    ctx.fillRect(0, yy - rowH/2, maxW*w/1000, rowH + over);
  }

  // POC: die Zeile, an der am meisten umging
  if(vp.poc){
    const yy = snap(y(vp.poc))+half();
    ctx.strokeStyle=V("--pivot"); ctx.lineWidth=1.4; ctx.globalAlpha=.95;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(maxW+10,yy); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font="8px "+V("--mono"); ctx.fillStyle=V("--pivot"); ctx.textAlign="left";
    ctx.fillText("POC", maxW+13, yy+3);
  }
  // Knoten und Vakuum am linken Rand markieren
  (vp.hvn||[]).forEach(n=>{
    const yy=snap(y(n.p))+half();
    if(yy<topPad||yy>topPad+ph) return;
    ctx.strokeStyle=V("--ink-dim"); ctx.globalAlpha=.7; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(7,yy); ctx.stroke(); ctx.globalAlpha=1;
  });
  (vp.lvn||[]).forEach(n=>{
    const yy=snap(y(n.p))+half();
    if(yy<topPad||yy>topPad+ph) return;
    ctx.strokeStyle=V("--warn"); ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(maxW*0.5,yy); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  });
}

/** Vorgezeichnete Orbs mit Leuchtkern.

    Ein radialer Verlauf je Punkt waere bei ueber tausend Orbs zu teuer.
    Stattdessen wird je Farbe und gerasterter Groesse einmal ein Sprite
    gezeichnet und danach nur noch kopiert - das haelt das Schieben
    fluessig und gibt trotzdem echtes Leuchten statt flacher Kreise. */
const ORB_SPRITES = new Map();
function orbSprite(color, r){
  const key = color+"|"+r+"|"+dpr;
  let sp = ORB_SPRITES.get(key);
  if(sp) return sp;
  const pad = r*1.7, size = Math.ceil(pad*2*dpr);
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  const cx = pad, cy = pad;
  const grad = g.createRadialGradient(cx,cy,0, cx,cy,pad);
  grad.addColorStop(0,    color);
  grad.addColorStop(0.52, color);
  grad.addColorStop(0.74, color+"55");
  grad.addColorStop(1,    color+"00");
  g.fillStyle = grad;
  g.beginPath(); g.arc(cx,cy,pad,0,6.2832); g.fill();
  // harter Kern, damit die Kette bei kleinen Groessen nicht verwaescht
  g.globalCompositeOperation = "source-over";
  g.fillStyle = color;
  g.beginPath(); g.arc(cx,cy,Math.max(0.6,r*0.55),0,6.2832); g.fill();
  sp = {canvas:c, pad};
  ORB_SPRITES.set(key, sp);
  return sp;
}

/** Wand-Verlauf als Orb-Ketten: x = Zeit, y = Preis, Radius = Bestand.
    Eine Linie sagt, wo die Wand liegt. Die Kette sagt zusaetzlich, ob
    sie waechst oder zerfaellt. */
function drawOrbs(ctx, bars, y, bw, pw, ph, V, topPad){
  const walls = S.data?.leading_walls || [];
  const tr = S.trails;
  const tracks = (tr && tr.tracks) || [];
  if(!walls.length && !tracks.length) return;
  if(!bars.length) return;

  const bucket = (tr && tr.bucket) || 120;
  const t0 = bars[0].t, t1 = bars[bars.length-1].t;

  // Aufgezeichnete Staerke je Spur und Zeitfenster nachschlagbar machen
  const rec = new Map();
  let peak = 0;
  tracks.forEach(tk=>{
    tk.points.forEach(q=>{
      rec.set(`${tk.chain}|${tk.side}|${tk.strike}|${q.t}`, q.oi);
      if(q.oi > peak) peak = q.oi;
    });
  });
  walls.forEach(w=>{ if(w.oi > peak) peak = w.oi; });
  if(peak <= 0) return;

  // Schrittweite: nie enger als vier Bildpunkte, sonst zeichnen sich die
  // Orbs uebereinander und kosten nur Rechenzeit.
  const pxPerSec = (pw) / Math.max(1, (t1 - t0));
  const step = Math.max(bucket, Math.ceil(4 / Math.max(pxPerSec, 1e-9) / bucket) * bucket);

  walls.forEach(w=>{
    const yy = y(w.price);
    if(yy < topPad-6 || yy > topPad+ph+6) return;
    const col = V(w.side === "call" ? "--resist" : "--support");
    const isIndex = w.chain_kind === "Index";
    const key = `${w.chain}|${w.side}|${w.strike}`;

    for(let t = t0; t <= t1 + bucket; t += step){
      const x = tToX(t, bars, bw);
      if(x < -8 || x > pw + 8) continue;
      // Gemessen oder angenommen? Ein aufgezeichneter Wert schlaegt den
      // aktuellen Bestand, sonst gilt der aktuelle als Annahme.
      const slot = t - (t % bucket);
      const measured = rec.get(`${key}|${slot}`);
      const oi = measured != null ? measured : w.oi;
      const rel = Math.min(1, oi / peak);
      const r = Math.round((1.1 + 3.4 * Math.sqrt(rel)) * 2) / 2;
      const sp = orbSprite(col, r);
      // Nicht gemessene Abschnitte deutlich zurueckgenommen: das Band
      // zeigt, DASS die Wand da ist, ohne eine Staerke zu behaupten,
      // die nicht erhoben wurde.
      ctx.globalAlpha = measured != null ? (0.34 + 0.55*rel) : (0.17 + 0.30*rel);
      ctx.drawImage(sp.canvas, x - sp.pad, yy - sp.pad, sp.pad*2, sp.pad*2);
      if(isIndex && measured != null && r > 2.5){
        ctx.globalAlpha = 0.8; ctx.strokeStyle = col; ctx.lineWidth = 1/dpr*1.2;
        ctx.beginPath(); ctx.arc(x, yy, r + 1.6, 0, 6.2832); ctx.stroke();
      }
    }
  });
  ctx.globalAlpha = 1;
}

function draw(){
  const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  ctx.clearRect(0,0,W,H);
  // Grund mit leichtem Verlauf statt Flaeche - die Kerzen stehen dadurch
  // freier, ohne dass eine zweite Farbe ins Spiel kommt
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, V("--panel")); bg.addColorStop(0.55, V("--ground"));
  bg.addColorStop(1, V("--ground"));
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  const bars=vbars();
  if(!bars.length){
    ctx.fillStyle=V("--ink-faint"); ctx.font="13px "+V("--sans"); ctx.textAlign="center";
    ctx.fillText("keine Kursdaten", W/2, H/2); return;
  }
  const topPad = PAD.t + (S.immersive ? 6 : CHROME*0.42);
  const pw=W-PAD.r, ph=H-PAD.b-topPad;
  let lo=Math.min(...bars.map(b=>b.l)), hi=Math.max(...bars.map(b=>b.h));
  const lv=chartLevels(), range=(hi-lo)||1;
  const slack = S.fitAll ? Infinity : range*0.45;
  const loL=lo-slack, hiL=hi+slack;
  const barLo=lo, barHi=hi, barRange=(barHi-barLo)||1;
  lv.forEach(l=>{ if(l.p>=loL&&l.p<=hiL){ lo=Math.min(lo,l.p); hi=Math.max(hi,l.p); }});
  if(S.data.spot){ lo=Math.min(lo,S.data.spot); hi=Math.max(hi,S.data.spot); }
  // Harte Klemme statt Schwellenwert: ein Level darf die Skala um
  // hoechstens ein Viertel der Kerzenspanne je Seite aufziehen. Damit
  // gehoeren den Kerzen immer mindestens zwei Drittel des Bildes, und
  // was weiter weg liegt, sagt die Randmarke.
  if(!S.fitAll){
    lo = Math.max(lo, barLo - barRange*0.25);
    hi = Math.min(hi, barHi + barRange*0.25);
  }
  const pd=(hi-lo)*0.06||1; lo-=pd; hi+=pd;
  const y=p=>topPad+(hi-p)/(hi-lo)*ph, bw=pw/bars.length;

  if(S.layers.profil && S.data.vp?.w) drawProfile(ctx, y, pw, ph, topPad, V, lo, hi);
  if(S.layers.tpo) drawTPO(ctx, y, pw, ph, topPad, V);
  if(S.layers.zonen) (S.data.zones||[]).forEach(z=>{
    const y1=y(z.top),y2=y(z.bot);
    const c = z.role==="resist"?"224,169,60" : z.role==="support"?"169,123,232" : "207,198,178";
    ctx.fillStyle=`rgba(${c},.075)`; ctx.fillRect(0,y1,pw,Math.max(1.5,y2-y1));
  });

  if(S.layers.gcurve) drawGammaCurve(ctx, y, pw, ph, V, lo, hi, topPad);
  if(S.layers.orbs) drawOrbs(ctx, bars, y, bw, pw, ph, V, topPad);

  const upC=V("--up"), dnC=V("--down");
  bars.forEach((b,i)=>{
    const x=i*bw, cw=Math.max(1.3,bw*0.6), up=b.c>=b.o;
    const col = up?upC:dnC;
    // Docht auf das Geraetepixel rasten, sonst franst eine 1px-Linie aus
    const wx = snap(x+bw/2)+half();
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1/dpr, bw*0.055);
    ctx.beginPath(); ctx.moveTo(wx,snap(y(b.h))); ctx.lineTo(wx,snap(y(b.l))); ctx.stroke();
    const t=snap(y(Math.max(b.o,b.c))), bo=snap(y(Math.min(b.o,b.c)));
    const h=Math.max(1/dpr, bo-t), bx=snap(x+(bw-cw)/2);
    // Leichter Verlauf im Koerper: gibt der Kerze Volumen, ohne dass die
    // Farbe ihre Bedeutung verliert
    if(h > 3){
      const g=ctx.createLinearGradient(bx,t,bx+cw,t);
      g.addColorStop(0, col); g.addColorStop(1, col+"CC");
      ctx.fillStyle=g;
    } else ctx.fillStyle=col;
    ctx.fillRect(bx, t, cw, h);
  });

  const used=[], usedBox=[];
  lv.sort((a,b)=>a.p-b.p).forEach(l=>{
    const yy=y(l.p); if(yy<topPad-2||yy>topPad+ph+2) return;
    const c=V(l.c);
    ctx.globalAlpha=l.dim??1; ctx.strokeStyle=c; ctx.lineWidth=l.w; ctx.setLineDash(l.dash||[]);
    const ly = snap(yy)+half();
    ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(pw,ly); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    if(!l.badge) return;
    let by=yy; while(used.some(u=>Math.abs(u-by)<11)) by+=11;
    used.push(by);
    ctx.fillStyle=c; ctx.fillRect(pw+2, by-6.5, PAD.r-4, 12.5);
    ctx.fillStyle=V("--ground"); ctx.font="600 9.5px "+V("--mono"); ctx.textAlign="left";
    ctx.fillText(fmt(l.p), pw+5, by+2.5);
    if(l.lab && !S.layers.gpbox){
      ctx.fillStyle=c; ctx.font="8.5px "+V("--mono"); ctx.textAlign="right";
      ctx.globalAlpha=.9; ctx.fillText(l.lab, pw-4, by-1); ctx.globalAlpha=1;
    }
    // Beschriftungskasten in der Art der Desktop-Vorlage: Bezeichnung
    // oben, Preis darunter, direkt am Level statt nur an der Skala.
    if(l.lab && S.layers.gpbox){
      ctx.font="7.5px "+V("--mono");
      const w1=ctx.measureText(l.lab).width;
      ctx.font="600 9px "+V("--mono");
      const w2=ctx.measureText(fmt(l.p)).width;
      // Rechts neben dem Profil absetzen, nicht darauf - im Desktop
      // stehen die Kaesten ebenfalls frei.
      const profW = S.layers.profil ? Math.min(pw*0.19, 74) + 8 : 6;
      const bw2=Math.max(w1,w2)+10;
      // Dicht liegende Kaesten nach unten ausweichen lassen, sonst
      // ueberdeckt der eine den anderen und beide sind unlesbar.
      let byB = yy, bx = profW, guard = 0;
      while(usedBox.some(u=>Math.abs(u.y-byB)<25 && Math.abs(u.x-bx)<bw2+6) && guard++<2){
        byB += 25;
      }
      // Mehr als zwei Schritte Versatz waeren kein Ausweichen mehr,
      // sondern ein Kasten ohne erkennbaren Bezug - dann lieber keiner.
      // Die Preisskala rechts zeigt das Level ohnehin.
      // Der Chart laeuft absichtlich unter der Chrome weiter - ein
      // Beschriftungskasten dort waere aber unlesbar.
      const safeTop = (S.immersive ? topPad : CHROME) + 18;
      const fits = guard <= 2
        && byB > safeTop && byB < topPad + ph - 6
        && bx + bw2 < pw - 30;
      if(fits) usedBox.push({y:byB, x:bx});
      if(fits){
        // Verbinder, wenn der Kasten ausgewichen ist
        if(Math.abs(byB-yy) > 1){
          ctx.strokeStyle=c; ctx.globalAlpha=.4; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(bx+bw2/2, yy); ctx.lineTo(bx+bw2/2, byB-14); ctx.stroke();
          ctx.globalAlpha=1;
        }
        ctx.fillStyle=V("--ink"); ctx.globalAlpha=.93;
        ctx.fillRect(bx, byB-14, bw2, 12);
        ctx.fillStyle=c; ctx.fillRect(bx, byB-2, bw2, 12);
        ctx.globalAlpha=1;
        ctx.fillStyle=V("--ground"); ctx.textAlign="left";
        ctx.font="7.5px "+V("--mono"); ctx.fillText(l.lab, bx+5, byB-5);
        ctx.font="600 9px "+V("--mono"); ctx.fillText(fmt(l.p), bx+5, byB+7);
      }
    }
  });

  // Level ausserhalb des Fensters als Randmarke. Die Skala dafuer
  // aufzuziehen wuerde die Kerzen zu einem Strich stauchen - die Marke
  // sagt dasselbe und kostet keinen Platz.
  if(!S.fitAll){
    const off = lv.filter(l=>l.badge && (l.p > hi || l.p < lo));
    const above = off.filter(l=>l.p > hi).sort((a,b)=>a.p-b.p).slice(0,3);
    const below = off.filter(l=>l.p < lo).sort((a,b)=>b.p-a.p).slice(0,3);
    ctx.font="9px "+V("--mono");
    [[above,1],[below,-1]].forEach(([list,dir])=>{
      list.forEach((l,i)=>{
        const c=V(l.c);
        const yy = dir>0 ? topPad+7+i*13 : topPad+ph-7-i*13;
        const txt = (dir>0?"▲ ":"▼ ")+fmt(l.p);
        const w = ctx.measureText(txt).width+9;
        ctx.globalAlpha=.92; ctx.fillStyle=c;
        ctx.fillRect(pw-w-3, yy-6, w, 12);
        ctx.globalAlpha=1; ctx.fillStyle=V("--ground"); ctx.textAlign="left";
        ctx.fillText(txt, pw-w+1, yy+3);
        if(l.lab){
          ctx.fillStyle=c; ctx.globalAlpha=.75; ctx.textAlign="right";
          ctx.fillText(l.lab, pw-w-7, yy+3); ctx.globalAlpha=1;
        }
      });
    });
    ctx.textAlign="left";
  }

  if(S.data.spot){
    const yy=y(S.data.spot);
    if(yy>=topPad&&yy<=topPad+ph){
      ctx.strokeStyle=V("--ink"); ctx.globalAlpha=.45; ctx.setLineDash([4,3]);
      const sy=snap(yy)+half();
      ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(pw,sy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      ctx.fillStyle=V("--ink"); ctx.fillRect(pw+2,yy-7.5,PAD.r-4,15);
      ctx.fillStyle=V("--ground"); ctx.font="700 10px "+V("--mono"); ctx.textAlign="left";
      ctx.fillText(fmt(S.data.spot), pw+5, yy+3);
    }
  }
  if(S.cross!=null){
    const i=Math.max(0,Math.min(bars.length-1,S.cross));
    const b=bars[i], x=i*bw+bw/2;
    ctx.strokeStyle=V("--ink-dim"); ctx.globalAlpha=.5; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x,topPad); ctx.lineTo(x,topPad+ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,y(b.c)); ctx.lineTo(pw,y(b.c)); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    $("cross").className="cross on";
    $("cross").innerHTML = `${new Date(b.t*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}<br>`+
      `O ${fmt(b.o)}&nbsp; H ${fmt(b.h)}<br>L ${fmt(b.l)}&nbsp; C ${fmt(b.c)}`;
  } else $("cross").className="cross";

  // Vignette: nimmt den Raendern Gewicht, damit die Mitte traegt
  const vig = ctx.createRadialGradient(W*0.45, H*0.45, Math.min(W,H)*0.35,
                                       W*0.45, H*0.45, Math.max(W,H)*0.78);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.30)");
  ctx.fillStyle = vig; ctx.fillRect(0,0,pw,topPad+ph);

  ctx.fillStyle=V("--ink-faint"); ctx.font="9px "+V("--mono");
  const st=Math.max(1,Math.floor(bars.length/4));
  // Beschriftung nach der tatsaechlichen Spanne, nicht nach dem Namen der
  // Zeitebene. Vorher entschied allein S.tf==="1d" ueber Datum oder
  // Uhrzeit - bei 573 Viertelstundenkerzen ueber sechs Tage stand damit
  // nur die Tageszeit da und die Achse las sich rueckwaerts:
  // 15:45, 13:30, 17:45, 15:30. Richtige Zeitpunkte, aber an
  // verschiedenen Tagen, und ohne Datum nicht zu unterscheiden.
  const spanD = bars.length > 1
    ? (bars[bars.length-1].t - bars[0].t) / 86400 : 0;
  const dOpt = {day:"2-digit", month:"2-digit"};
  // Ueber ein Jahr hinaus braucht es das Jahr. Auf der Tagesebene lief
  // die Achse ueber zwei Jahre und zeigte "10.09. · 12.03. · 10.09." -
  // zwei verschiedene Septembertage, nicht zu unterscheiden.
  const yOpt = {month:"2-digit", year:"2-digit"};
  // Die Schwelle zum reinen Datum liegt bei zehn Tagen, nicht bei
  // fuenf: bei knapp ueber fuenf Tagen fielen zwei der fuenf Marken auf
  // denselben Kalendertag und die Achse las sich "08.09. · 08.09.".
  // Solange die Uhrzeit die Marken noch trennt, gehoert sie dazu.
  for(let i=0;i<bars.length;i+=st){
    const d=new Date(bars[i].t*1000);
    const lab = spanD > 300
      ? d.toLocaleDateString("de-DE", yOpt)
      : (S.tf==="1d" || spanD > 10)
      ? d.toLocaleDateString("de-DE", dOpt)
      : spanD > 1.2
        ? d.toLocaleDateString("de-DE", dOpt)+" "
          + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
        : d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    let x=i*bw+bw/2; ctx.textAlign="center";
    if(x<24){x=2;ctx.textAlign="left";} else if(x>pw-24){x=pw-2;ctx.textAlign="right";}
    ctx.fillText(lab, x, H-PAD.b+13);
  }
  ctx.textAlign="left";
}

// Gesten
let drag=null,pinch=null,press=null,tuckTimer=null;
const wrap=$("cvwrap");

/** Marktleiste waehrend der Geste einklappen und danach zurueckholen -
    dieselbe Mechanik, mit der Feed-Apps beim Scrollen Platz schaffen. */
function tuck(on){
  const st=$("strip");
  if(!st) return;
  clearTimeout(tuckTimer);
  if(on){ st.classList.add("tucked"); }
  else tuckTimer = setTimeout(()=>st.classList.remove("tucked"), 1300);
}
wrap.addEventListener("touchstart",e=>{
  tuck(true);
  if(e.touches.length===1){
    drag={x:e.touches[0].clientX, i0:S.vw?.i0||0, t:Date.now(), moved:false};
    press=setTimeout(()=>{ // langes Drücken blendet das Fadenkreuz ein
      const r=cv.getBoundingClientRect();
      S.cross=Math.floor((e.touches[0].clientX-r.left)/((W-PAD.r)/Math.max(1,span())));
      buzz(8); draw();
    },320);
  } else if(e.touches.length===2){
    clearTimeout(press);
    pinch={d:Math.abs(e.touches[0].clientX-e.touches[1].clientX), sp:span(), i0:S.vw?.i0||0};
    drag=null;
  }
},{passive:true});
wrap.addEventListener("touchmove",e=>{
  if(!S.vw) return;
  if(pinch&&e.touches.length===2){
    clearTimeout(press);
    const d=Math.abs(e.touches[0].clientX-e.touches[1].clientX);
    if(d>10){
      const n=(S.data.bars||[]).length;
      const sp=Math.max(10,Math.min(n,pinch.sp*(pinch.d/d))), mid=pinch.i0+pinch.sp/2;
      S.vw={i0:mid-sp/2,i1:mid+sp/2}; clampView(); draw();
    }
  } else if(drag&&e.touches.length===1){
    const dx=e.touches[0].clientX-drag.x;
    if(Math.abs(dx)>6){ clearTimeout(press); drag.moved=true; }
    if(S.cross!=null){
      const r=cv.getBoundingClientRect();
      S.cross=Math.floor((e.touches[0].clientX-r.left)/((W-PAD.r)/Math.max(1,span())));
      draw(); return;
    }
    if(!drag.moved) return;
    const per=(W-PAD.r)/Math.max(1,span());
    S.vw.i0=drag.i0-dx/per; S.vw.i1=S.vw.i0+span(); clampView(); draw();
  }
},{passive:true});
wrap.addEventListener("touchend",()=>{
  tuck(false);
  clearTimeout(press);
  if(S.cross!=null){ S.cross=null; draw(); }
  drag=null; pinch=null;
},{passive:true});
wrap.addEventListener("wheel",e=>{
  if(!S.vw) return; e.preventDefault();
  const n=(S.data.bars||[]).length;
  const sp=Math.max(10,Math.min(n,span()*(e.deltaY>0?1.15:.87))), mid=S.vw.i0+span()/2;
  S.vw={i0:mid-sp/2,i1:mid+sp/2}; clampView(); draw();
},{passive:false});

// ======================= Rendern =======================
function render(){
  const d=S.data; if(!d) return;
  $("sym").textContent = SYM[S.market]||S.market;
  tickTo($("spot"), d.spot);
  const ov = S.overview.find(o=>o.key===S.market);
  const ch = $("chg");
  if(ov && ov.change!=null){
    ch.textContent = `${sgn(ov.change)}  ${ov.change_pct>=0?"+":""}${ov.change_pct.toFixed(2)}%`;
    ch.className = "chg tnum "+(ov.change>=0?"up":"dn");

    d.regime==="long"?"LONG γ" : d.regime==="short"?"SHORT γ" : "—";

  $("meta").innerHTML =
    `${d.bar_source?.source==="cboe"?"Cboe":"Yahoo"}${stale?" · STALE":""} · ATR ${fmt(d.atr)} · `+
    `${d.bars.length} Kerzen${S.layers.profil && d.vp?.basis
      ? " · "+({cme:"CME-Volumen", etf:"Stückvolumen", options:"Optionsfluss", time:"Zeit je Preis"}[d.vp.basis] || d.vp.basis)

      : ""}${S.trails?.tracks?.length && S.layers.orbs
      ? " · "+S.trails.tracks.length+" Spuren" : ""} · ${hhmm(d.ts)}`;

}

function switchMarket(k){
  if(k===S.market) return;
  S.market=k; S.plan=null; S.data=null; S.view0=false; S.lastMsgCount=0; S.trails=null;
  buzz(10); closeSheet();

  load(); loadMessages(); loadPlan(); loadTrails();
}

function renderLevel(){
  const d=S.data, el=$("p-level");
  const fx=d.fixed||{}, lv=mergedFixed();
  const anchor=fx.anchor||{};
  const stateTag = s => s==="held"?'<span class="tag held">gehalten</span>'
    : s==="broken"?'<span class="tag broken">gebrochen</span>'
    : s==="tested"?'<span class="tag tested">im Test</span>'
    : '<span class="tag">ungetestet</span>';
  const col = p => p>d.spot*1.0015?"var(--resist)":p<d.spot*0.9985?"var(--support)":"var(--pivot)";
  const kcol = k => `var(${levelColor(k)})`;

  let h = `<div class="sec">Fixe Level · eingefroren ${hhmm(anchor.ts)} am ${fx.anchor_hour}:00-Anker</div>`;
  h += lv.length ? lv.map(l=>`
    <div class="card role" style="--c:${kcol(l.kind)}">
      <div class="ch">
        <b>${fmt(l.price)}</b>${stateTag(l.state)}
        <span class="far">${sgn(l.price-d.spot)}</span>
      </div>
      <div class="cs">${esc(l.labels.join(" · "))}${
        Math.abs(l.drift||0) >= 1 ? ` · läuft aktuell auf ${fmt(l.live)} <span style="color:var(--warn)">(${sgn(l.drift)})</span>` : " · unverändert"}</div>
      <div class="cm">
        <span>${l.exams_total===0?"nie getestet":l.exams_total+". Prüfung"}</span>
        ${l.exams_held?`<span style="color:var(--support)">${l.exams_held}× gehalten</span>`:""}
        ${l.exams_broken?`<span style="color:var(--warn)">${l.exams_broken}× gebrochen</span>`:""}
        <span>seit ${esc(l.born)}</span>
      </div>
    </div>`).join("")
    : '<div class="empty">Das Buch ist noch leer. Es wird am nächsten Tagesanker gefüllt.</div>';

  // Leading Walls aus allen Ketten des Marktes
  const lw = d.leading_walls || [];
  const conf = d.wall_confluence || [];
  if(conf.length){
    h += `<div class="sec">Konfluenz über Ketten — dieselbe Wand, zwei Quellen</div>`;
    h += conf.slice(0,4).map(z=>`
      <div class="card role" style="--c:${col(z.mid)}">
        <div class="ch"><b>${z.top-z.bot < 2 ? fmt(z.mid) : fmt(z.bot)+" – "+fmt(z.top)}</b>
          <span class="tag">${esc(z.chains.join(" + "))}</span>
          <span class="far">${sgn(z.mid-d.spot)}</span></div>
        <div class="cs">${z.members} Wände auf einem Fleck · ${esc(z.sides.map(x=>x==="call"?"Call":"Put").join(" und "))}</div>
        <div class="cm"><span>${fmtM(z.oi)} Open Interest</span></div>
      </div>`).join("");
  }
  if(lw.length){
    const mx = Math.max(...lw.map(w=>w.oi))||1;
    const byChain = {};
    lw.forEach(w=>{ (byChain[w.chain] = byChain[w.chain]||[]).push(w); });
    h += `<div class="sec">Leading Walls je Kette</div>`;
    Object.entries(byChain).forEach(([chain, ws])=>{
      const grid = ws[0].grid;
      h += `<div class="card"><div class="ch">
        <b style="font-size:13px">${esc(chain)}</b>
        <span class="tag">${esc(ws[0].chain_kind)}</span>
        <span class="far">Raster ${fmt(grid)} Pkt</span></div>`;
      h += ws.map(w=>`<div class="brow">
        <span class="k" style="color:var(--${w.side==="call"?"resist":"support"})">${fmt(w.price)}</span>
        <span class="bar" style="--c:var(--${w.side==="call"?"resist":"support"})"><i style="width:${(w.oi/mx*100).toFixed(0)}%"></i></span>
        <span class="v">${fmtM(w.oi)}</span></div>`).join("");
      h += `</div>`;
    });
    const r = d.chain_ratios||{};
    const etf = Object.entries(r).find(([k,v])=>v!==1);
    if(etf) h += `<div class="foot">ETF-Strikes sind über das Verhältnis
      ${etf[0]} × ${etf[1].toFixed(3)} in den Index-Preisraum übersetzt — beide Kurse
      zum selben Zeitpunkt aus derselben Quelle, keine Futures-Basis nötig.
      Ein ${esc(etf[0])}-Strike-Schritt entspricht rund ${fmt((lw.find(w=>w.chain===etf[0])||{}).grid||0)}
      Indexpunkten; das ist der Genauigkeitsboden jeder daraus abgeleiteten Marke.</div>`;
  }

  h += `<div class="sec">Konfluenz-Zonen</div>`;
  const zs=d.zones||[];
  h += zs.length ? zs.map(z=>`
    <div class="card role" style="--c:${col(z.mid)}">
      <div class="ch"><b>${z.width<2?fmt(z.mid):fmt(z.bot)+" – "+fmt(z.top)}</b>
        <span class="tag">#${z.rank}</span>
        <span class="far">${sgn(z.mid-d.spot)}</span></div>
      <div class="cs">${esc(z.labels.join(" · "))}</div>
      <div class="cm"><span>${fmt(z.width)} Punkte</span><span>${z.width_atr.toFixed(2)} ATR</span>
        <span>Score ${z.score.toFixed(1)}</span></div>
    </div>`).join("")
    : '<div class="empty">Keine Zone trägt genug Konfluenz — es braucht mindestens zwei verschiedene Quellenarten im selben Band.</div>';

  h += `<div class="foot">Die fixen Level werden einmal am ${fx.anchor_hour}:00-Anker eingefroren und danach nur
    fortgeschrieben. Ohne das wandert jede Wand mit jedem Snapshot — und ein Level, das sich ständig
    verschiebt, lässt sich weder handeln noch messen. Der Prüfungszähler läuft über Tage weiter,
    solange derselbe Strike wiederkehrt.</div>`;
  el.innerHTML=h;
}

function renderGamma(){
  const d=S.data, el=$("p-gamma");
  if(d.net_gex==null){ el.innerHTML='<div class="empty">Keine Optionskette verfügbar.</div>'; return; }
  const g=d.greeks||{};
  let h=`<div class="tiles">
    <div class="tile"><div class="l">Netto-GEX je Punkt</div>
      <div class="v" style="color:${d.net_gex<0?"var(--warn)":"var(--support)"}">${fmtM(d.net_gex)}</div>
      <div class="n">${d.regime==="short"?"Dealer verstärken Bewegungen":"Dealer dämpfen Bewegungen"}</div></div>
    <div class="tile"><div class="l">davon 0DTE</div><div class="v">${fmtM(d.net_gex_zdte)}</div>
      <div class="n">Verfall heute</div></div>
    <div class="tile"><div class="l">Zero-Gamma</div><div class="v">${fmt(d.flip)}</div>
      <div class="n">${d.flip?`${fmt(Math.abs(d.spot-d.flip))} Pkt ${d.spot>d.flip?"darunter":"darüber"}`:"—"}</div></div>
    <div class="tile"><div class="l">Max Pain</div><div class="v">${fmt(d.max_pain)}</div>
      <div class="n">Verfalls-Gravitation</div></div>
    <div class="tile"><div class="l">Gamma-Pin</div><div class="v">${fmt(d.gamma_pin)}</div>
      <div class="n">stärkster Einzelmagnet</div></div>
    <div class="tile"><div class="l">Put / Call</div><div class="v">${d.pcr?d.pcr.toFixed(2):"—"}</div>
      <div class="n">${fmtM(d.put_oi)} Put · ${fmtM(d.call_oi)} Call</div></div>
    <div class="tile"><div class="l">Netto-Vanna</div><div class="v">${fmtM(g.vanna)}</div>
      <div class="n">je Vola-Punkt</div></div>
    <div class="tile"><div class="l">Netto-Charm</div><div class="v">${fmtM(g.charm)}</div>
      <div class="n">Delta-Zerfall je Tag</div></div>
  </div>`;

  const walls=[...(d.call_walls||[]).map(w=>({...w,r:"resist"})),
               ...(d.put_walls||[]).map(w=>({...w,r:"support"}))].sort((a,b)=>b.price-a.price);
  if(walls.length){
    const mx=Math.max(...walls.map(w=>w.oi))||1;
    h+=`<div class="sec">OI-Wände · ±6 % um den Kurs</div>`+walls.map(w=>`
      <div class="brow"><span class="k" style="color:var(--${w.r})">${fmt(w.price)}</span>
      <span class="bar" style="--c:var(--${w.r})"><i style="width:${(w.oi/mx*100).toFixed(0)}%"></i></span>
      <span class="v">${fmtM(w.oi)}</span></div>`).join("");
  }
  if((d.fresh_flow||[]).length){
    const mx=Math.max(...d.fresh_flow.map(x=>x.voi))||1;
    h+=`<div class="sec">Fresh Flow · Volumen gegen stehendes OI</div>`+d.fresh_flow.map(x=>`
      <div class="brow"><span class="k">${fmt(x.strike)}</span>
      <span class="bar" style="--c:var(--agent)"><i style="width:${(x.voi/mx*100).toFixed(0)}%"></i></span>
      <span class="v">${x.voi.toFixed(1)}×</span></div>`).join("");
  }
  if((d.expiries||[]).length){
    const mx=Math.max(...d.expiries.map(e=>Math.abs(e.single)))||1;
    h+=`<div class="sec">Verfallsleiter · Netto-Gamma je Verfall</div>`+d.expiries.map(e=>`
      <div class="brow"><span class="k" style="font-size:11.5px">${e.expiry.slice(5)}</span>
      <span class="bar" style="--c:${e.single<0?"var(--warn)":"var(--support)"}"><i style="width:${(Math.abs(e.single)/mx*100).toFixed(0)}%"></i></span>
      <span class="v">${fmtM(e.single)}</span></div>`).join("");
  }
  h+=`<div class="foot">Vorzeichen: Calls positiv, Puts negativ — die übliche Annahme, nicht gemessen.
    Für gemessene Vorzeichen bräuchte es die Fluss-Klassifikation aus zwei Snapshots.
    Zero-Gamma wird über ein Preisgitter neu gerechnet, nicht als stärkster Gamma-Strike genommen:
    der klebt per Konstruktion am Geld.</div>`;
  el.innerHTML=h;
}

function renderAgent(){
  const el=$("p-agent");
  const list = S.messages.slice(-40);
  const body = list.length ? list.map(m=>`
    <div class="msg ${m.role}">
      <div class="mh">${m.role==="proactive"?"● "+esc(m.trigger||"MELDUNG").toUpperCase()

      ${m.why&&m.role==="proactive"?`<div class="why">Auslöser: ${esc(m.why)}</div>`:""}

    : '<div class="empty">Der Agent beobachtet im 20-Sekunden-Takt.<br>Er meldet sich, sobald ein Auslöser greift — Zonenkontakt, Regimewechsel, Wandbewegung oder ein Termin.</div>';
  const model=S.budget?.model;
  el.innerHTML = body + `
    <div class="composer">

      <button id="askBtn">Senden</button>
    </div>
    <div class="foot">${model
      ? `Modell ${esc(model)} · Budget ${S.budget.used}/${S.budget.limit} heute`
      : "Ohne GEMINI_API_KEY antwortet der Agent aus der Engine — jede Zahl stammt aus der Rechnung, keine wird erfunden."}</div>`;

async function ask(){
  const inp=$("askInput"); const t=(inp.value||"").trim();
  if(!t||S.busy) return;
  S.busy=true; $("askBtn").disabled=true; inp.value=""; inp.blur(); buzz(8);
  try{
    await fetch("/api/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({market:S.market,text:t})});
    await loadMessages();
    $("v-agent").scrollTop=$("v-agent").scrollHeight;
  }catch(e){}
  S.busy=false; const b=$("askBtn"); if(b) b.disabled=false;
}

// Nach unten wischen schliesst - auf einem Telefon die erwartete Geste,
// und der einzige verlaessliche Weg, wenn das Sheet fast den ganzen
// Bildschirm fuellt und "daneben tippen" kaum Flaeche laesst.
(function(){
  const sh=$("sheet"); let y0=null;
  const zone=$("grabzone");
  const start=e=>{ y0=e.touches[0].clientY; sh.style.transition="none"; };
  const move=e=>{
    if(y0==null) return;
    const dy=Math.max(0, e.touches[0].clientY-y0);
    sh.style.transform=`translateY(${dy}px)`;
  };
  const end=e=>{
    if(y0==null) return;
    const dy=Math.max(0,(e.changedTouches[0]?.clientY??y0)-y0);
    sh.style.transition=""; sh.style.transform="";
    if(dy>70){ buzz(8); closeSheet(); }
    y0=null;
  };
  [zone, sh].forEach(el=>{
    el.addEventListener("touchstart",start,{passive:true});
    el.addEventListener("touchmove",move,{passive:true});
    el.addEventListener("touchend",end,{passive:true});
  });
})();
