<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChartTerminal">
<link rel="manifest" href="/manifest.webmanifest">
<script>
// Ohne registrierten Service Worker bietet Chrome auf Android die
// Installation nicht an - Manifest und Icons allein genuegen nicht.
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>ChartTerminal</title>
<style>
/* Rollenfarben statt Quellfarben — Redesign 03.09.
   Gold = Widerstand, Türkis = Support, Beige = Pivot, Violett = Agent.
   Woher ein Level stammt, steht im Text, nie in der Farbe. */
:root{
  /* ── Grund ─────────────────────────────────────────────────────────
     Nahezu neutrales Schwarz mit minimalem Kaelteanteil. Die Flaeche
     traegt keine Bedeutung, damit die Overlays sie tragen koennen. */
  --ground:#0A0C11; --panel:#11141B; --panel-2:#161A22; --panel-3:#1D222C;
  --line:#28303C; --line-soft:#1C222B;
  --ink:#ECEFF4; --ink-dim:#8B97A8; --ink-faint:#5A6675;

  /* ── Daten: was ein Level bedeutet ─────────────────────────────────
     Gold und Violett wie in der Vorlage. Jede dieser Farben steht fuer
     eine Seite des Marktes und fuer nichts anderes. */
  --resist:#E0A93C;   /* Call-Seite, Widerstand */
  --support:#A97BE8;  /* Put-Seite, Support */
  --pivot:#CFC6B2;    /* Pivot, Zero-Gamma, Max Pain */
  --struct:#5B6A7D;   /* Struktur: POC, Vortagesmarken */
  --va:#9E4756;       /* Value Area: wo 70 % des Volumens liefen */

  /* ── Stimme ────────────────────────────────────────────────────────
     Der Agent bekommt das freigewordene Tuerkis. Kuehl, klar von Gold
     und Violett getrennt, und nie an einem Level. */
  --agent:#46C4BC;

  /* ── Zustand: kein Datum, sondern eine Lage ────────────────────────
     Regime, Kursveraenderung, Frische. Bewusst getrennt von den
     Datenfarben, damit "LONG" nicht wie eine Put-Wand aussieht. */
  --pos:#4FB477; --neg:#E5705A;
  --live:#4FB477; --warn:#E5705A;

  /* ── Kerzen ────────────────────────────────────────────────────────
     Neutral gehalten. Traegt der Kurs selbst Farbe, konkurriert er mit
     den Overlays - dasselbe macht die Vorlage. */
  --up:#C2CBD6; --down:#4A5563;

  --mono:ui-monospace,"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --tabh:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;overflow:hidden;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--resist);outline-offset:2px;border-radius:6px}

/* ============ Kopfzeile ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:32;
  padding:calc(var(--st) + 9px) 14px 9px;display:flex;align-items:center;gap:11px;
  background:color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  transition:transform .24s cubic-bezier(.32,.72,0,1), opacity .2s ease;
}
/* Verlauf unter der Chrome: der Chart laeuft darunter weiter und bleibt
   trotzdem lesbar - dieselbe Loesung wie in Vollbild-Feeds. */
.topbar::after{
  content:"";position:absolute;left:0;right:0;top:100%;height:22px;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--ground) 70%,transparent), transparent);
}
body.immersive .topbar,body.immersive .strip,body.immersive .tabbar{
  transform:translateY(var(--hide,-110%));opacity:0;pointer-events:none;
}
body.immersive .tabbar{--hide:110%}
.strip.tucked{transform:translateY(calc(-100% - var(--topbar-h,62px)));opacity:0}

/* Der Griff steht dort, wo die Leiste war. Er ist die Spur, ohne die
   eine weggeklappte Flaeche verloren waere - vier sichtbare Bildpunkte
   auf einem Tippziel von 44. */
.striphandle{
  /* Ueber der Leiste (31), nicht darunter: mit z-index 30 lag der Griff
     hinter der Zeichenflaeche und war nicht antippbar. */
  position:fixed;top:var(--topbar-h,62px);left:0;right:0;z-index:32;
  height:22px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;
  animation:handleIn .22s ease-out;
}
.striphandle i{
  /* Nicht --line: das ist eine Trennlinienfarbe und auf dem fast
     schwarzen Chartgrund gemessen unsichtbar (#28303C auf #0A0C11).
     Ein Griff, den man nicht sieht, ist kein Griff. */
  width:36px;height:4px;border-radius:2px;display:block;
  background:var(--ink-faint);opacity:.75;
  box-shadow:0 0 0 4px color-mix(in srgb, var(--ground) 70%, transparent);
}
.striphandle:active i{background:var(--resist)}
@keyframes handleIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.idbtn{display:flex;align-items:center;gap:5px;min-height:44px;padding-right:6px}
.idbtn .nm{font-size:19px;font-weight:800;letter-spacing:-.02em}
.idbtn .car{color:var(--ink-faint);font-size:11px;margin-top:2px}
.price-wrap{margin-left:auto;text-align:right;line-height:1.2}
.price{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chg{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.chg.up{color:var(--pos)} .chg.dn{color:var(--neg)}
.rg{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-dim);
  letter-spacing:.02em;white-space:nowrap;
}
.rg.long{color:var(--pos);border-color:rgba(79,180,119,.42);background:rgba(79,180,119,.11)}
.rg.short{color:var(--neg);border-color:rgba(229,112,90,.42);background:rgba(229,112,90,.11)}
.rg i{width:5px;height:5px;border-radius:50%;background:currentColor}

/* ============ Marktleiste ============
   Zwei Stufen. Eingeklappt eine schmale Zeile, die die Werte nur zeigt;
   aufgeklappt die ausfuehrlichen Karten. Gemessen kostete die Leiste in
   der alten Form 89 von 915 Bildpunkten - fast ein Zehntel des Bildes
   fuer Zahlen, die man meistens nur streift. */
.strip{
  position:fixed;top:var(--topbar-h,62px);left:0;right:0;z-index:31;
  display:flex;align-items:flex-start;gap:4px;padding:6px 4px 6px 12px;
  background:color-mix(in srgb, var(--ground) 76%, transparent);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  transition:transform .28s cubic-bezier(.32,.72,0,1), opacity .2s ease;
}
.striprow{
  flex:1 1 auto;min-width:0;display:flex;gap:7px;
  overflow-x:auto;scrollbar-width:none;
}
.striprow::-webkit-scrollbar{display:none}
.stripx{
  flex:none;width:40px;height:34px;border-radius:10px;border:1px solid var(--line-soft);
  background:var(--panel-2);color:var(--ink-faint);font-size:13px;line-height:1;
  transition:transform .22s cubic-bezier(.32,.72,0,1);
}
.strip.full .stripx{transform:rotate(180deg)}

/* Eingeklappt: eine Zeile, nur lesen und antippen.
   Die Veraenderung steht nicht als eigene Zahl daneben, sondern faerbt
   den Kurs. Ausgeschrieben brauchte ein Wert 140 Bildpunkte und es
   passten zweieinhalb in die Zeile - als Farbe sind es 90 und vier. Die
   Richtung ist damit weiter da, sie kostet nur keine Breite mehr. */
.strip.slim .mchip{
  flex:none;display:flex;align-items:baseline;gap:6px;height:34px;
  padding:0 10px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line-soft);
}
.strip.slim .mchip .k{font-size:11px}
.strip.slim .mchip .p{font-size:12.5px;margin:0}
.strip.slim .mchip .c{display:none}
.strip.slim .mchip.up .p{color:var(--pos)}
.strip.slim .mchip.dn .p{color:var(--neg)}

/* Aufgeklappt: Karten wie bisher, umbrechend statt scrollend */
.strip.full .striprow{flex-wrap:wrap;overflow:visible}
.strip.full .mchip{
  flex:none;min-width:86px;padding:8px 11px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--line-soft);text-align:left;
}
.mchip.on{border-color:var(--resist);background:rgba(224,169,60,.11)}
.mchip .k{font-size:11.5px;font-weight:700;color:var(--ink-dim)}
.mchip.on .k{color:var(--resist)}
.mchip .p{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.mchip .c{font-family:var(--mono);font-size:10px;margin-top:1px;color:var(--ink-faint)}
.mchip .c.up{color:var(--pos)} .mchip .c.dn{color:var(--neg)}

/* ============ Ansichten ============ */
.track{
  flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;
}
.track::-webkit-scrollbar{display:none}
.view{
  flex:none;width:100%;scroll-snap-align:start;overflow-y:auto;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;position:relative;
}
.view.chart{overflow:hidden}
.pad{padding:calc(var(--chrome-h,124px) + 12px) 14px calc(20px + var(--sb))}

/* Chart */
.cvwrap{position:absolute;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
.meta{
  position:absolute;left:8px;top:calc(var(--chrome-h,124px) + 6px);font-family:var(--mono);font-size:9.5px;
  color:var(--ink-faint);line-height:1.4;pointer-events:none;white-space:nowrap;
  background:color-mix(in srgb, var(--ground) 62%, transparent);
  border:1px solid var(--line-soft);border-radius:7px;padding:3px 8px;font-size:9px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.tfbar{
  position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;align-items:center;
  padding:0 10px;
}
/* Zeitebenen duerfen scrollen, die Werkzeuge nicht: sonst rutschen sie auf
   schmalen Geraeten aus dem Bild und sind nur per Wischen erreichbar. */
.tfscroll{
  flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
}
.tfscroll::-webkit-scrollbar{display:none}
.tficons{flex:none;display:flex;gap:6px}
.tfc{
  flex:none;min-width:44px;height:44px;padding:0 10px;border-radius:12px;
  background:rgba(20,27,37,.92);border:1px solid var(--line);
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
}
.tfc.on{background:var(--resist);border-color:var(--resist);color:#17130A}
.tfc.icon{min-width:44px}

.cross{
  position:absolute;left:10px;top:10px;background:rgba(20,27,37,.95);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:11px;line-height:1.6;
  pointer-events:none;display:none;backdrop-filter:blur(8px);
}
.cross.on{display:block}

/* ============ Karten ============ */
.sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:20px 2px 9px}
.sec:first-child{margin-top:2px}
.card{
  background:var(--panel-2);border:1px solid var(--line-soft);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;
}
.card.role{border-left:3px solid var(--c,var(--line))}
.ch{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ch b{font-family:var(--mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ch .tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:6px;
  background:var(--panel-3);color:var(--ink-dim)}
.ch .tag.held{background:rgba(79,180,119,.16);color:var(--pos)}
.ch .tag.broken{background:rgba(229,112,90,.16);color:var(--neg)}
.ch .tag.tested{background:rgba(217,164,65,.16);color:var(--resist)}
.ch .far{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums}
.cs{font-size:12.5px;color:var(--ink-dim);margin-top:6px;line-height:1.5}
.cm{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:6px;
  display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:38px 20px;line-height:1.6}

/* Kennzahlen-Raster */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.tile{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:13px;padding:12px 13px}
.tile .l{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .n{font-size:11px;color:var(--ink-dim);margin-top:4px;line-height:1.4}

/* Balkenzeilen */
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.brow:last-child{border-bottom:none}
.brow .k{font-family:var(--mono);font-size:13px;font-weight:700;min-width:66px;font-variant-numeric:tabular-nums}
.brow .bar{flex:1;height:9px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--c,var(--line));border-radius:3px}
.brow .v{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);min-width:54px;text-align:right}

/* Agent */
.msg{padding:12px 13px;border-radius:13px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.msg .mh{font-family:var(--mono);font-size:9.5px;margin-bottom:6px;display:flex;gap:8px;align-items:center;
  letter-spacing:.05em}
.msg .mh .ts{margin-left:auto;color:var(--ink-faint)}
.msg.proactive{background:var(--panel-2);border-left:3px solid var(--agent)}
.msg.proactive .mh{color:var(--agent)}
.msg.user{background:rgba(224,169,60,.10);border:1px solid rgba(224,169,60,.28);margin-left:30px}
.msg.user .mh{color:var(--resist)}
.msg.agent{background:var(--panel-2);border-left:3px solid var(--line)}
.msg.agent .mh{color:var(--ink-faint)}
.msg .why{font-size:11px;color:var(--ink-faint);margin-top:7px;font-style:italic}
.composer{
  position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(4px + var(--sb));
  background:linear-gradient(transparent,var(--ground) 22%);
}
.composer input{
  flex:1;min-width:0;height:44px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:22px;padding:0 16px;color:var(--ink);font-size:15px;user-select:text;
}
.composer button{
  height:44px;padding:0 18px;border-radius:22px;background:var(--resist);color:#17130A;
  font-size:14px;font-weight:700;
}
.composer button:disabled{opacity:.4}

/* Plan */
.plan h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--resist);margin:20px 0 8px}
.plan h4:first-child{margin-top:0}
.plan p{font-size:13.5px;line-height:1.62;margin:0 0 8px}
.plan ul{margin:0;padding-left:18px}
.plan li{font-size:13.5px;line-height:1.6;margin-bottom:7px}
.plan .hint{margin:6px 0 2px;padding:9px 11px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--line-soft);
  font-size:11px;color:var(--ink-faint);line-height:1.5}
.bias{display:inline-block;font-size:12px;font-weight:700;background:rgba(224,169,60,.13);
  border:1px solid rgba(224,169,60,.35);color:var(--resist);padding:6px 12px;border-radius:9px;margin-bottom:9px}
.upd{border-left:3px solid var(--agent);background:var(--panel-2);border-radius:0 10px 10px 0;
  padding:11px 13px;margin-top:9px;font-size:13px;line-height:1.55}
.upd .t{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-bottom:5px}
.foot{font-size:11px;color:var(--ink-faint);line-height:1.55;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--line-soft)}

/* ============ Bottom-Navigation ============ */
.tabbar{
  flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line-soft);
  padding-bottom:var(--sb);
}
.tb{
  flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-faint);position:relative;
}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tb span{font-size:9.5px;font-weight:600;letter-spacing:.02em}
.tb.on{color:var(--resist)}
.tb .badge{position:absolute;top:7px;right:calc(50% - 17px);width:7px;height:7px;
  border-radius:50%;background:var(--agent);border:1.5px solid var(--panel)}

/* ============ Sheets ============ */
.scrim{position:fixed;inset:0;background:rgba(4,7,11,.62);z-index:80;opacity:0;
  pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--panel-2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:82vh;overflow-y:auto;padding-bottom:calc(12px + var(--sb));
}
.sheet.on{transform:translateY(0)}
.grabzone{padding:10px 0 6px;cursor:grab;touch-action:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;padding:0 18px 4px}
.sh-close{
  margin-left:auto;width:44px;height:44px;border-radius:22px;background:var(--panel-3);
  border:1px solid var(--line);color:var(--ink-dim);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.sh-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);padding:8px 18px 4px}
.si{display:flex;align-items:center;gap:13px;padding:15px 18px;min-height:56px;
  border-top:1px solid var(--line-soft);font-size:15px}
.si .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-faint);flex:none;
  display:flex;align-items:center;justify-content:center}
.si.on .box{background:var(--resist);border-color:var(--resist)}
.si.on .box::after{content:"";width:9px;height:5px;border-left:2px solid #17130A;
  border-bottom:2px solid #17130A;transform:rotate(-45deg) translate(1px,-1px)}
.si .sub{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.si.sel{color:var(--resist);font-weight:600}
.sh-n{padding:13px 18px;font-size:11.5px;color:var(--ink-faint);line-height:1.55;
  border-top:1px solid var(--line-soft)}

/* Live-Punkt: gruen heisst Bruecke laeuft, grau heisst verzoegert */
.livedot{width:7px;height:7px;border-radius:50%;display:inline-block;
  margin:0 2px 0 6px;vertical-align:middle;background:var(--down)}
.livedot.on{background:var(--pos);box-shadow:0 0 0 0 rgba(79,180,119,.55);
  animation:lvp 2.4s ease-out infinite}
@keyframes lvp{0%{box-shadow:0 0 0 0 rgba(79,180,119,.5)}
  70%{box-shadow:0 0 0 7px rgba(79,180,119,0)}
  100%{box-shadow:0 0 0 0 rgba(79,180,119,0)}}

/* Naechste Annaeherung: Farbe nach Abstand in ATR */
.near{padding:7px 13px 0;font-size:11px;color:var(--ink-faint);
  font-family:var(--mono);line-height:1.5}
.near b{color:var(--ink-dim);font-weight:600}
.near.hit{color:var(--pos)} .near.hit b{color:var(--pos)}
.near.hot b{color:var(--resist)}
.near.cold{opacity:.6}

/* Preisraum messen */
.sp-row{display:flex;align-items:center;gap:12px;padding:11px 18px;
  border-top:1px solid var(--line-soft)}
.sp-row label{font-size:13px;color:var(--ink-dim);min-width:104px}
.sp-row input{flex:1;min-width:0;background:var(--panel-3);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  font-family:var(--mono);font-size:16px;   /* 16px: iOS zoomt darunter hinein */
  -webkit-appearance:none}
.sp-row input:focus{outline:none;border-color:var(--resist)}
.sp-btns{display:flex;gap:10px;padding:14px 18px}
.sp-b{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-3);color:var(--ink);font-size:14px;font-weight:600}
.sp-b.prim{background:var(--resist);border-color:var(--resist);color:#1A1206}

/* Aktualisieren */
.refresh{
  position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:5;
  font-size:11px;color:var(--ink-faint);font-family:var(--mono);opacity:0;transition:opacity .2s
}
.refresh.on{opacity:1}

/* ---------- Tiefe und Rueckmeldung ---------- */
.card{
  background:linear-gradient(180deg,var(--panel-2),color-mix(in srgb,var(--panel-2) 88%, #000));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px -12px rgba(0,0,0,.8);
}
.tile{
  background:linear-gradient(180deg,var(--panel-2),color-mix(in srgb,var(--panel-2) 90%, #000));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.topbar{box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.tabbar{box-shadow:0 -8px 22px -18px rgba(0,0,0,.9)}

/* Druck sichtbar machen - ein Ziel, das nachgibt, fuehlt sich verlaesslich an */
.tb:active,.mchip:active,.tfc:active,.pill:active,.si:active{transform:scale(.965)}
.tb,.mchip,.tfc,.si{transition:transform .09s ease, color .15s ease, background .15s ease}
.card{transition:transform .09s ease}
.card:active{transform:scale(.99)}

/* Aktiver Reiter bekommt einen Lichtpunkt statt nur Farbe */
.tb.on::before{
  content:"";position:absolute;top:5px;width:16px;height:2px;border-radius:2px;
  background:var(--resist);box-shadow:0 0 8px var(--resist);
}

/* Ladezustand: Platzhalter in der Form des Inhalts statt "lädt…" */
.livedot.shut{background:var(--ink-faint);box-shadow:none}
.skel{padding:14px 0}
.skel i{
  display:block;height:58px;border-radius:13px;margin-bottom:9px;
  background:linear-gradient(90deg,var(--panel-2) 0%,var(--panel-3) 50%,var(--panel-2) 100%);
  background-size:200% 100%;animation:shim 1.4s ease-in-out infinite;
}
.skel i:nth-child(2){animation-delay:.12s} .skel i:nth-child(3){animation-delay:.24s}
@keyframes shim{0%{background-position:120% 0}100%{background-position:-120% 0}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";

const S = {
  market:"NQ", tf:"15m", data:null, plan:null, messages:[], overview:[],
  view:0, profileMode:"heat", layers:{tpo:false, va:true, gpbox:true, gcurve:false, orbs:true, fix:true, live:true, zonen:true, profil:true, session:true},
  fitAll:false, immersive:false, lastMsgCount:0, busy:false, cross:null, trails:null,
  // Preisfenster von Hand. null heisst: die Automatik entscheidet und der
  // Kurs steht in der Mitte. Sobald jemand an der Skala zieht, steht hier
  // ein Fenster und die Automatik schweigt, bis AUTO es wieder loescht.
  vs:null, autoScale:null, geo:null, autoBtn:null,
  // Ladephase. "keine Kursdaten" stand beim Start im leeren Chart und
  // sah aus wie ein Fehler, obwohl es Warten war.
  laedt:true, ladeFehler:null,
};
const TFS = ["1m","5m","15m","30m","1h","1d"];
const SYM = {NQ:"NDX", ES:"SPX", YM:"DJX", RTY:"RUT", GC:"GLD"};

const $ = id => document.getElementById(id);
/** Zahlen mit deutschen Tausenderpunkten.

    Die Formatierer werden gemerkt. v.toLocaleString(..., {optionen})
    baut bei JEDEM Aufruf einen neuen Intl-Formatierer auf, und das ist
    keine Kleinigkeit: gemessen ging ein Drittel der Rechenzeit eines
    Bildes allein dafuer drauf - 33 Prozent, verteilt auf die Preisleiter,
    die Level-Schilder, das Fadenkreuz und jede Zahl in den Tafeln.
    Derselbe Formatierer, einmal gebaut, macht daraus einen Bruchteil. */
const _nf = new Map();
function nfmt(d){
  let f = _nf.get(d);
  if(!f){
    f = new Intl.NumberFormat("de-DE",
        {minimumFractionDigits:d, maximumFractionDigits:d});
    _nf.set(d, f);
  }
  return f;
}
const fmt = (v,d=0) => (v==null||isNaN(v)) ? "—" : nfmt(d).format(v);
/** Ein PREIS zur Anzeige. Verschiebt in den Preisraum des Brokers.

    Getrennt von fmt(), und das ist der ganze Punkt: fmt() bleibt fuer
    Abstaende zustaendig - ATR, Zonenbreiten, "42 Punkte entfernt",
    Drift. Ein Abstand darf NICHT verschoben werden, denn der Versatz
    kuerzt sich in jeder Differenz heraus. Beides durch dieselbe
    Funktion zu schicken hiesse, jede Distanz um den Versatz zu
    verfaelschen.

    Die Geometrie fasst px() ebenfalls nicht an. Kerzen, Waende und
    Achse bleiben im Index-Preisraum und liegen damit weiter exakt
    aufeinander; verschoben wird allein die ausgegebene Zahl. Genau eine
    Umrechnung, an genau einer Stelle - siehe terminal/broker.py. */
const px = (v,d=0) => (v==null||isNaN(v)) ? "—" : fmt(v + (S.off||0), d);
const fmtM = v => v==null ? "—" : (Math.abs(v)>=1e9 ? (v/1e9).toFixed(1)+" Mrd"
  : Math.abs(v)>=1e6 ? (v/1e6).toFixed(0)+" Mio" : (v/1e3).toFixed(0)+"k");
const sgn = v => v==null ? "—" : (v>=0?"+":"")+fmt(v);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm = iso => { try{ return new Date(iso).toLocaleTimeString("de-DE",
  {hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/** Kurse weich auf den neuen Wert zaehlen statt springen zu lassen.
    Bei einer Zahl, die sich alle 20 Sekunden aendert, macht der Sprung
    aus einer kleinen Bewegung eine grosse - das Zaehlen zeigt die
    Richtung, ohne sie zu uebertreiben. */
const _ticks = new WeakMap();
function tickTo(el, val, dur=520){
  if(val==null || isNaN(val)){ el.textContent="—"; return; }
  const from = _ticks.get(el);
  _ticks.set(el, val);
  if(from==null || Math.abs(val-from) < 0.01 || !window.requestAnimationFrame){
    el.textContent = px(val); return;
  }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now-t0)/dur);
    const e = 1 - Math.pow(1-k, 3);          // sanft auslaufend
    el.textContent = px(from + (val-from)*e);
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ======================= Laden =======================
async function load(){
  const markt = S.market;
  try{
    const r = await fetch(`/api/state?market=${markt}&tf=${S.tf}`);
    if(!r.ok) throw new Error("Server antwortet "+r.status);
    const d = await r.json();
    if(markt !== S.market) return;     // inzwischen weitergeklickt
    const fresh = !S.data || S.data.market!==d.market || S.data.interval!==d.interval;
    // Stand der Ausschnitt am rechten Rand, laeuft er mit. Sonst faellt
    // der Chart im Lauf der Sitzung still hinter den Kurs zurueck - man
    // sieht ein Bild, das aussieht wie jetzt und eine Stunde alt ist.
    const nAlt = (S.data?.bars||[]).length;
    const tAlt = nAlt ? S.data.bars[nAlt-1].t : 0;
    const amRand = S.vw ? (S.vw.i1 >= nAlt - 0.6) : true;
    S.data = d;
    // Versatz in den Preisraum des Brokers. Steht an genau dieser einen
    // Stelle im Zustand; px() liest ihn, sonst niemand.
    S.off = (d.space && d.space.offset) || 0;
    S.laedt = false; S.ladeFehler = null;
    if(fresh || !S.view0){ fitView(); S.vs = null; }
    else if(amRand && S.vw){
      const zu = d.bars.length - nAlt;
      if(zu > 0){ S.vw.i0 += zu; S.vw.i1 += zu; clampView(); }
    }
    // Eine NEUE SITZUNG faengt von vorn an: aus 389 Balken werden um
    // 15:30 wieder eine Handvoll. Der Ausschnitt stand dann bei Index
    // 330 von 5 - hinter dem Ende der Reihe, und der Chart war leer.
    //
    // Erkannt wird sie am Kalendertag des juengsten Balkens, nicht an
    // der blossen Anzahl: die schwankt auch mal, wenn eine kaputte
    // Kerze herausfaellt, und dafuer soll der Ausschnitt nicht
    // zurueckspringen.
    const tNeu = d.bars.length ? d.bars[d.bars.length-1].t : 0;
    const neueSitzung = tAlt && tNeu
      && new Date(tAlt*1000).toDateString() !== new Date(tNeu*1000).toDateString();
    if(neueSitzung || (S.vw && S.vw.i0 > d.bars.length - 1)){
      fitView(); S.vs = null;
    }
    S.view0 = true;
    render();
  }catch(e){
    // Fehler nur dann zeigen, wenn noch gar nichts da ist. Steht schon
    // ein Chart, ist ein misslungener Nachlauf kein Grund, ihn gegen
    // eine Fehlermeldung zu tauschen - der naechste Takt holt ihn.
    if(!S.data || !(S.data.bars||[]).length){
      S.laedt = false;
      S.ladeFehler = (e && e.message) ? e.message : "keine Verbindung";
      paint();
    }
  }
}
/** Nur die Kerzen nachladen.

    Beim Wechsel der Zeitebene aendert sich im ganzen Snapshot NICHTS
    ausser den Balken: Kette, Gamma, Waende, Level, Volumenprofil und TPO
    haengen an den Optionsdaten und an Minutenbars, nicht an der
    gewaehlten Aufloesung. Trotzdem wurde bisher der komplette Snapshot
    neu gebaut - gemessen 12 Sekunden fuer eine Zahl, die sich nicht
    aendert.

    Jetzt kommt zuerst der schmale Endpunkt, der nur Balken liefert; der
    Chart steht damit sofort. Der volle Stand wird danach im Hintergrund
    nachgezogen, damit auch die Bruecken-Kerzen und das Alter stimmen. */
async function ladeKerzen(){
  const tf = S.tf, markt = S.market;
  try{
    const r = await fetch(`/api/candles?market=${markt}&tf=${tf}`);
    if(!r.ok) return false;
    const d = await r.json();
    // Zwischenzeitlich weitergeklickt? Dann gehoert die Antwort nicht
    // mehr zu dem, was auf dem Schirm steht.
    if(tf !== S.tf || markt !== S.market) return false;
    if(!d.bars || !d.bars.length) return false;
    S.data = Object.assign({}, S.data, {
      bars: d.bars, interval: tf, bar_source: d.source});
    S.laedt = false; S.vs = null;
    fitView();
    // Solange nur Balken da sind, NUR den Chart zeichnen. Die Tafeln
    // rechts leben von Kette, Gamma und Zonenbuch - mit einem halben
    // Snapshot gefuettert wuerden sie Unsinn anzeigen oder brechen.
    // Sie kommen, wenn load() durch ist, und bis dahin steht ihr
    // Ladebalken.
    if(S.data.spot != null) render();
    else { renderTf(); measureChrome(); paint(); }
    return true;
  }catch(e){ return false; }
}

async function loadTrails(){
  try{
    S.trails = await (await fetch(`/api/trails?market=${S.market}`)).json();
    paint();
  }catch(e){}
}
async function loadOverview(){
  try{ S.overview = await (await fetch("/api/overview")).json(); renderStrip(); }catch(e){}
}
async function loadMessages(){
  try{
    const d = await (await fetch(`/api/agent/messages?market=${S.market}`)).json();
    S.messages = d.messages||[]; S.budget = d.budget;
    if(S.messages.length > S.lastMsgCount){
      if(S.view!==3){ $("badge").hidden=false; buzz(12); }
      S.lastMsgCount = S.messages.length;
    }
    renderAgent();
  }catch(e){}
}
async function loadPlan(){
  try{ S.plan = await (await fetch(`/api/agent/plan?market=${S.market}`)).json(); renderPlan(); }
  catch(e){}
}

// ======================= Chart =======================
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,dpr=1;
const PAD={r:56,b:68,t:6};
let CHROME=124;

function measureChrome(){
  const tb = $("topbar")?.offsetHeight || 62;
  const el = $("strip");
  // Weggeklappt zaehlt die Leiste nicht mehr mit. Vorher war das
  // Wegklappen rein optisch - sie schob sich aus dem Bild, aber der
  // Chart rechnete weiter mit ihrer Hoehe und gewann keinen Millimeter.
  //
  // An ihre Stelle tritt aber der Griff, und der braucht sein eigenes
  // Band. Mit null gerechnet legte sich die Statuszeile ueber ihn und
  // das Wort "Kerzen" verschwand halb hinter der Pille - zwei Dinge am
  // selben Platz, von denen keines mehr lesbar war.
  const weg = el ? el.classList.contains("tucked") : true;
  const st = weg ? ($("striphandle")?.offsetHeight || 22)
                 : (el ? el.offsetHeight : 0);
  CHROME = tb + st;
  document.documentElement.style.setProperty("--topbar-h", tb+"px");
  document.documentElement.style.setProperty("--chrome-h", CHROME+"px");
}

/** Die Farben des Stilbogens, einmal gelesen.

    Sie stehen als CSS-Variablen und aendern sich nie - es gibt keinen
    Hell-Modus und keinen Umschalter. Sie bei jedem Zugriff neu abzufragen
    hiess, den Layoutbaum zu befragen, und zwar innerhalb der Schleifen,
    die ueber tausend Profilbaender und jede Perle laufen. */
let TH = {};
const THEMA = ["--ground","--panel","--panel-2","--panel-3","--line","--line-soft",
  "--ink","--ink-dim","--ink-faint","--resist","--support","--pivot","--struct",
  "--va","--agent","--warn","--up","--down","--mono","--sans"];
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  TH = {};
  THEMA.forEach(k => TH[k] = cs.getPropertyValue(k).trim());
}
readTheme();

/** Zeichnen auf den naechsten Bildaufbau buendeln.

    touchmove feuert auf neueren Telefonen bis zu 120 mal je Sekunde.
    Jedes Ereignis sofort zu zeichnen hiess, mehr Bilder zu rechnen als der
    Bildschirm zeigen kann - die Warteschlange lief voll und der Chart
    hinkte dem Finger hinterher. Gemessen kostete ein Bild 26 ms; bei 120
    Ereignissen je Sekunde waren das drei Sekunden Arbeit je Sekunde Wisch.
    Gebuendelt wird hoechstens einmal je Bildaufbau gezeichnet. */
let rafId = 0;
function paint(){
  if(rafId) return;
  rafId = requestAnimationFrame(()=>{ rafId = 0; draw(); });
}

function resize(){
  measureChrome();
  readTheme();
  const w=$("cvwrap");
  // Bis Faktor 3 statt 2: ein iPhone Pro zeichnet damit auf dem echten
  // Panelraster statt auf zwei Dritteln davon.
  dpr = Math.min(devicePixelRatio||1, 3);
  W=w.clientWidth; H=w.clientHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textRendering = "geometricPrecision";
  ORB_SPRITES.clear();
  draw();
}

/** Grund und Vignette sind Bilder, keine Rechnungen.

    Beide sind Verlaeufe ueber die ganze Flaeche - bei Faktor 3 sind das
    1236 mal 2574 Geraetepixel, die der Browser in jedem Bild neu
    ausmischt. Sie aendern sich aber nur, wenn sich das Fenster aendert.
    Einmal gebacken und danach kopiert kostet dasselbe wie ein Bild
    zeichnen statt wie hundert. */
let _hg = {k:"", grund:null, vig:null};
function hintergrund(topPad, pw, ph){
  const k = [W,H,dpr,topPad,pw,ph,TH["--ground"]].join("|");
  if(_hg.k === k) return _hg;
  const mach = () => {
    const c = document.createElement("canvas");
    c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
    const g = c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
    return [c, g];
  };
  const [cg, gg] = mach();
  const bg = gg.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, TH["--panel"]); bg.addColorStop(0.55, TH["--ground"]);
  bg.addColorStop(1, TH["--ground"]);
  gg.fillStyle = bg; gg.fillRect(0,0,W,H);

  const [cv2, gv] = mach();
  const vig = gv.createRadialGradient(W*0.45, H*0.45, Math.min(W,H)*0.35,
                                      W*0.45, H*0.45, Math.max(W,H)*0.78);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.30)");
  gv.fillStyle = vig; gv.fillRect(0,0,pw,topPad+ph);

  _hg = {k, grund:cg, vig:cv2};
  return _hg;
}

/** Textbreiten merken. measureText ist eine Messung im Schriftsystem und
    kostet je Aufruf; die Beschriftungen der Level sind bei jedem Bild
    dieselben und aendern sich nur mit den Daten. */
const _mw = new Map();
function textW(ctx, txt){
  const k = ctx.font + "\u0000" + txt;
  let w = _mw.get(k);
  if(w === undefined){ w = ctx.measureText(txt).width; if(_mw.size > 600) _mw.clear(); _mw.set(k, w); }
  return w;
}

/** Auf das Geraetepixel rasten. Eine Linie auf halbem CSS-Pixel ist bei
    Faktor 3 kein halbes Geraetepixel mehr und wird grau ausgefranst. */
function snap(v){ return Math.round(v*dpr)/dpr; }
/** Mittiger Versatz fuer haarscharfe 1px-Linien, abhaengig vom Faktor. */
function half(){ return 0.5/dpr; }
function fitView(){
  const n=(S.data?.bars||[]).length; if(!n){ S.vw=null; return; }
  const want=Math.min(n, S.tf==="1d"?90:70);
  // Ein Achtel Freiraum rechts von Anfang an: der letzte Balken steht
  // dann nicht auf der Preisachse, sondern davor, und die Marken haben
  // Platz, nach rechts weiterzulaufen.
  const luft = want*0.12;
  S.vw={i0:Math.max(0,n-want+luft), i1:Math.max(0,n-want+luft)+want};
}
function span(){ return S.vw ? S.vw.i1-S.vw.i0 : 0; }
/** Wieviel Ausschnitt darf rechts neben dem letzten Balken leer bleiben.

    Vorher null: der Ausschnitt endete hart am letzten Balken, und der
    Kurs klebte damit immer am rechten Rand. Genau dort braucht man aber
    Platz - dort liegt das, was noch nicht passiert ist, und dorthin
    zeigen Wand, Zero-Gamma und jede Linie, die man einzeichnet.

    Zwei Drittel des Ausschnitts sind der uebliche Freiraum. Ein Drittel
    Balken bleibt immer stehen, sonst zeigt der Chart ins Nichts und man
    findet nicht mehr zurueck. */
const LUFT = 0.66;
function clampView(){
  const n=(S.data?.bars||[]).length; if(!n||!S.vw) return;
  const sp=Math.max(10, Math.min(n, S.vw.i1-S.vw.i0));
  const rechts = n - sp + sp*LUFT;
  S.vw.i0=Math.max(0, Math.min(rechts, S.vw.i0)); S.vw.i1=S.vw.i0+sp;
}


/** Fasst fixe Level auf demselben Preis zusammen: eine Marke, mehrere Gründe. */
function mergedFixed(){
  const lv = S.data?.fixed?.levels || [];
  const rank = {untested:0, tested:1, held:2, broken:3};
  const by = new Map();
  lv.forEach(l=>{
    const k = Math.round(l.price);
    const cur = by.get(k);
    if(!cur){ by.set(k, {...l, labels:[l.label]}); return; }
    cur.labels.push(l.label);
    if(rank[l.state] > rank[cur.state]) cur.state = l.state;
    cur.exams_total = Math.max(cur.exams_total, l.exams_total);
    cur.exams_held = Math.max(cur.exams_held||0, l.exams_held||0);
    cur.exams_broken = Math.max(cur.exams_broken||0, l.exams_broken||0);
    if(Math.abs(l.drift||0) > Math.abs(cur.drift||0)){ cur.drift=l.drift; cur.live=l.live; }
    if(l.born < cur.born) cur.born = l.born;
  });
  return [...by.values()].sort((a,b)=>b.price-a.price);
}

/** Fixe Level aus dem Zonenbuch, dazu optional der laufende Stand als Geist. */
/** Farbe nach Art des Levels, nicht nach seiner Lage zum Kurs.

    Eine Call-Wand bleibt Gold, auch wenn der Kurs darueber steigt; ein
    Zero-Gamma bleibt Pivot, auch wenn es unter dem Kurs liegt. Vorher
    faerbte die Lage - dann leuchtete das Zero-Gamma wie eine Put-Wand
    und behauptete etwas, das es nicht ist. */
function levelColor(kind){
  if(/^call/.test(kind)) return "--resist";
  if(/^put/.test(kind))  return "--support";
  if(/flip|pain|pin/.test(kind)) return "--pivot";
  return "--struct";
}

/** Die Levelliste aendert sich mit den Daten, nicht mit dem Ausschnitt.

    Sie bei jedem Bild neu zu bauen hiess, waehrend eines Wischs sechzig
    mal dieselbe Liste aus denselben Zahlen zusammenzusetzen. Sie haengt
    an den geladenen Daten und an den Schaltern - beides steht waehrend
    einer Geste still. */
let _lvCache = {d:null, tr:null, k:"", v:null};
function chartLevelsCached(){
  const k = [S.layers.fix, S.layers.live, S.layers.session, S.layers.zonen,
             S.data?.spot].join("|");
  if(_lvCache.d === S.data && _lvCache.tr === S.trails && _lvCache.k === k)
    return _lvCache.v;
  _lvCache = {d:S.data, tr:S.trails, k, v:chartLevels()};
  return _lvCache.v;
}

function chartLevels(){
  const d=S.data; if(!d) return [];
  const out=[];
  const roleCol = p => p>d.spot*1.0015 ? "--resist" : p<d.spot*0.9985 ? "--support" : "--pivot";
  if(S.layers.fix) mergedFixed().forEach(l=>{
    out.push({p:l.price, lab:l.labels.join(" · "), c:levelColor(l.kind),
      w:/_2|_3/.test(l.kind)?1:1.8,
      dash:l.state==="broken"?[2,3]:null, dim:l.state==="broken"?.55:1, badge:true});
  });
  if(S.layers.live){
    // Geisterlinien: wohin die Wand seit dem Einfrieren gewandert ist.
    mergedFixed().forEach(l=>{
      if(l.live && l.drift && Math.abs(l.drift) > (d.atr||1)*0.03)
        out.push({p:l.live, lab:"", c:levelColor(l.kind), w:1, dash:[1,5], dim:.4, badge:false});
    });
  }
  if(S.layers.session){
    const s=d.session||{}, vp=d.vp||{};
    if(vp.poc) out.push({p:vp.poc, lab:"POC", c:"--pivot", w:1, dash:[1,4], dim:.85, badge:true});
    if(s.pdh) out.push({p:s.pdh, lab:"PDH", c:"--pivot", w:1, dash:[1,4], dim:.6, badge:true});
    if(s.pdl) out.push({p:s.pdl, lab:"PDL", c:"--pivot", w:1, dash:[1,4], dim:.6, badge:true});
  }
  return out;
}

/** Zeitstempel auf die X-Achse abbilden - ueber die Bars, nicht linear.
    Zwischen zwei Sitzungen klafft eine Luecke, die eine reine
    Zeitrechnung falsch auffuellen wuerde. */
/** Zeitpunkt -> Balkenindex, als Bruch.

    Sucht in der VOLLEN Reihe, nicht im sichtbaren Ausschnitt. Vorher hing
    das Ergebnis am Anfang des Ausschnitts und musste bei jedem Schieben
    neu gedeutet werden; im absoluten Index ist es eine Eigenschaft des
    Zeitpunkts allein. */
function tToI(ts, all){
  const n = all.length;
  if(n < 2) return 0;
  if(ts <= all[0].t) return 0;
  if(ts >= all[n-1].t){
    const step = all[n-1].t - all[n-2].t || 60;
    return n - 1 + (ts - all[n-1].t)/step;
  }
  let lo=0, hi=n-1;
  while(lo < hi-1){ const m=(lo+hi)>>1; if(all[m].t <= ts) lo=m; else hi=m; }
  const span = (all[hi].t - all[lo].t) || 1;
  return lo + (ts - all[lo].t)/span;
}

/** Runde Schrittweite fuer eine Preisleiter.

    1, 2, 2,5 oder 5 mal eine Zehnerpotenz - andere Schritte liest niemand
    ab. 25 Punkte sind eine Marke, 23,7 sind eine Rechnung. */
function niceStep(range, want){
  const roh = Math.max(1e-9, range / Math.max(1, want));
  const p = Math.pow(10, Math.floor(Math.log10(roh))), k = roh / p;
  return (k <= 1 ? 1 : k <= 2 ? 2 : k <= 2.5 ? 2.5 : k <= 5 ? 5 : 10) * p;
}

/** Volumenprofil, zweigeteilt nach gehandelter Optionsseite.

    Cboe liefert je Minute getrennt Call- und Put-Volumen. Ein Preisband,
    an dem fast nur Puts liefen, bedeutet etwas anderes als eines mit
    ueberwiegend Calls - auch wenn die Gesamtsumme dieselbe ist. Deshalb
    faerbt sich jeder Balken zwischen Tuerkis (Put-lastig) und Gold
    (Call-lastig) ein, statt einheitlich grau zu bleiben.

    Dazu markiert: Value Area, POC, Volumenknoten und Vakuum-Zonen. */
/** TPO als Blockreihen - eine Zelle je Periode, in der der Preis
    beruehrt wurde. Bewusst anders gezeichnet als das Volumenprofil:
    das eine ist eine Flaeche (wie viel), das andere sind zaehlbare
    Bloecke (wie oft). Wer beide sieht, soll sie nicht verwechseln.

    Das TPO bekommt eine eigene abgedunkelte Spalte statt frei ueber den
    Kerzen zu liegen. Ohne sie standen elf deckende Bloecke je Reihe vor
    dem Chart und die Kerzen der ersten Handelsstunde waren nicht mehr
    lesbar - zwei Ebenen, die sich gegenseitig ausloeschen. Mit eigener
    Spalte bleibt es das, was es sein soll: ein Streifen neben dem
    Chart, den man abzaehlen kann. */
function drawTPO(ctx, y, pw, ph, topPad, V){
  const tp = S.data?.tpo;
  if(!tp || !(tp.bins||[]).length) return;
  const x0 = (S.layers.profil ? Math.min(pw*0.19, 74) + 5 : 2) + 4;
  const cell = 3.0, gap = 1.0;
  const maxCells = Math.max(1, Math.floor(Math.min(52, pw*0.14) / (cell+gap)));
  const colW = maxCells*(cell+gap) + 8;
  // Blockhoehe aus der ECHTEN Hoehe eines Preisbands, nicht aus
  // ph/Baenderzahl. Der alte Ausdruck unterstellte, dass das TPO immer
  // genau die sichtbare Preisspanne fuellt - gemessen fuellte es das
  // 1,43-fache, und jeder Block wurde entsprechend zu kurz gezeichnet.
  // Solange die Skala sich von selbst nach den Kerzen richtete, fiel das
  // nicht auf; seit man an ihr ziehen kann, waere die Blockhoehe beim
  // Zoomen als einzige stehengeblieben.
  //
  // Der Massstab steckt in y() selbst: y(0)-y(1) ist, wieviele
  // Bildpunkte ein Preispunkt gerade misst. Die 0,82 lassen die Luecke
  // stehen, an der man die Bloecke abzaehlt - beim TPO ist sie Absicht,
  // anders als beim Volumenprofil.
  const pxProPunkt = y(0) - y(1);
  const bandH = (tp.step || ((tp.hi - tp.lo) / (tp.bins_n || 180))) * pxProPunkt;
  const rowH = Math.max(1.2, bandH * 0.82);

  // Eigene Spalte: ein dunkler Grund, damit die Bloecke gegen ihn
  // zaehlbar sind und nicht gegen die Kerzen dahinter.
  // Die Spalte reicht nur so weit wie die Sitzung, die sie beschreibt -
  // nicht ueber die ganze Charthoehe. Ueber die volle Hoehe gezogen lief
  // sie als heller Balken durch den leeren Bereich unterhalb der Kerzen
  // und sah aus wie ein Zeichenfehler.
  const cTop = Math.max(topPad, y(tp.hi)), cBot = Math.min(topPad+ph, y(tp.lo));
  if(cBot - cTop < 8) return;
  ctx.save();
  // Nicht ganz deckend: die Kerzen dahinter bleiben schemenhaft
  // sichtbar. Deckend war die Spalte ein Loch im Chart, durchsichtig
  // waren die Bloecke nicht mehr abzaehlbar - das hier ist die Mitte.
  const bgGrad = ctx.createLinearGradient(x0-4, 0, x0-4+colW, 0);
  bgGrad.addColorStop(0, V("--ground")); bgGrad.addColorStop(1, V("--panel"));
  ctx.fillStyle = bgGrad; ctx.globalAlpha = .62;
  ctx.fillRect(x0-4, cTop, colW, cBot-cTop);
  ctx.globalAlpha = .5; ctx.strokeStyle = V("--panel-3"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(snap(x0-4+colW), cTop);
  ctx.lineTo(snap(x0-4+colW), cBot); ctx.stroke();
  ctx.globalAlpha = 1;

  // Initial Balance: die Spanne der ersten beiden Perioden. Der Bereich,
  // gegen den der Rest des Tages gemessen wird.
  if(tp.ib_low && tp.ib_high){
    const y1=Math.min(y(tp.ib_high), y(tp.ib_low)), y2=Math.max(y(tp.ib_high), y(tp.ib_low));
    ctx.fillStyle=V("--struct"); ctx.globalAlpha=.14;
    ctx.fillRect(x0-4, y1, colW, Math.max(1,y2-y1));
    ctx.globalAlpha=.55; ctx.strokeStyle=V("--struct"); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0-3, y1); ctx.lineTo(x0-3, y2); ctx.stroke();
    ctx.globalAlpha=1;
  }

  tp.bins.forEach(b=>{
    if(!b.n) return;
    const yy = y(b.p);
    if(yy < topPad-1 || yy > topPad+ph+1) return;
    const n = Math.min(maxCells, b.n);
    // Farbe nach Anzahl der Perioden - blau fuer die Preise, durch die
    // der Markt nur streifte, rot fuer die, an denen er den halben Tag
    // stand. Beim TPO traegt die Farbe echte zusaetzliche Information:
    // die Blockzahl je Zeile ist auf die Spaltenbreite gedeckelt, die
    // Farbe ist es nicht.
    const c = heat(b.w);
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.globalAlpha = b.va ? .92 : .62;
    for(let i=0;i<n;i++)
      ctx.fillRect(x0 + i*(cell+gap), snap(yy - rowH/2), cell, Math.max(1, rowH));
  });
  ctx.globalAlpha=1;

  // Single Prints: Preise, die nur eine einzige Periode gesehen haben -
  // dort ist der Markt ohne Gegenwehr durchgelaufen.
  (tp.singles||[]).forEach(p=>{
    const yy=snap(y(p))+half();
    if(yy < topPad || yy > topPad+ph) return;
    ctx.strokeStyle=V("--resist"); ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0-4,yy); ctx.lineTo(x0-1,yy); ctx.stroke();
  });
  ctx.globalAlpha=1;

  if(tp.poc){
    const yy=snap(y(tp.poc))+half();
    ctx.strokeStyle=V("--pivot"); ctx.globalAlpha=.85; ctx.lineWidth=1.2;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x0-4,yy); ctx.lineTo(x0-4+colW,yy); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }

  // Beschriftung der Spalte, damit sie nicht fuer ein zweites
  // Volumenprofil gehalten wird.
  ctx.font="7px "+V("--mono"); ctx.fillStyle=V("--struct");
  ctx.textAlign="left"; ctx.globalAlpha=.8;
  ctx.fillText("TPO "+tp.brackets+"\u00d7"+tp.bracket_min+"m", x0+2, cBot-3);
  ctx.globalAlpha=1;
  ctx.restore();
}

/** Farbverlauf des Profils nach Volumenstaerke - blau, gruen, gelb, rot.
    Uebernommen aus der Desktop-Vorlage: die Farbe verstaerkt dort die
    Balkenlaenge, statt eine zweite Groesse zu kodieren. Der Blick findet
    den POC dadurch ohne Suchen. */
const HEAT = [[46,86,168],[38,150,190],[52,168,120],[150,190,70],
              [224,180,60],[220,120,50],[196,60,58]];
function heat(t){
  t = Math.max(0, Math.min(0.999, t));
  const f = t*(HEAT.length-1), i = Math.floor(f), k = f-i;
  const a = HEAT[i], b = HEAT[Math.min(HEAT.length-1, i+1)];
  return [Math.round(a[0]+(b[0]-a[0])*k),
          Math.round(a[1]+(b[1]-a[1])*k),
          Math.round(a[2]+(b[2]-a[2])*k)];
}

/** Der Profilstreifen in seinem eigenen Raster: eine Bildzeile je Band.

    Gemerkt, solange Profil, Farbwahl und Breite dieselben bleiben - also
    ueber jede Geste hinweg und bis zum naechsten Nachladen. */
let _vpCache = {vp:null, k:"", c:null};
function profilStreifen(vp, maxW, hZiel){
  const nB = vp.bins_n || (vp.w||[]).length;
  const W_ = vp.w || [];
  if(!nB || !W_.length) return null;
  // Der Streifen wird mindestens so hoch gezeichnet, wie er am Ende auf
  // dem Schirm steht. Sonst vergroessert die Leinwand beim Kopieren, und
  // Vergroessern heisst Verwischen: 1000 Zeilen auf 2100 Geraetepixel
  // gezogen ergaben einen weichen Verlauf statt abzaehlbarer Baender -
  // und die Feinheit ist bei einem Profil der ganze Punkt. Verkleinern
  // ist dagegen genau richtig, es mischt.
  //
  // Auf 32 Zeilen gerundet, damit nicht bei jedem Bildpunkt neu
  // gezeichnet wird - und trotzdem nah genug an 1:1, dass die Glaettung
  // beim Kopieren fast nichts zu tun hat. Gemessen an der Feinheit der
  // Baender: eine Zweierpotenz als Raster verfehlte die Zielhoehe um bis
  // zu ein Drittel, und genau dieses Verhaeltnis verwischte sie.
  //
  // Ist der Streifen am Ende KLEINER als seine Baender - weit
  // herausgezoomt -, bleibt er bei 1000 Zeilen und die Leinwand
  // verkleinert. Das ist hier das Richtige: Verkleinern mischt, und
  // gerundet fielen sonst zwei Drittel der Zeilen auf dieselbe und aus
  // 1000 Baendern wuerden sichtbar 600.
  const hoehe = Math.min(8192, Math.max(nB, Math.ceil((hZiel||0)/32)*32));
  const k = [S.profileMode, Math.round(maxW), S.layers.va, hoehe].join("|");
  if(_vpCache.vp === vp && _vpCache.k === k) return _vpCache.c;

  const CS = vp.cs || [];
  const va0 = vp.va0 == null ? -1 : vp.va0, va1 = vp.va1 == null ? -2 : vp.va1;
  const gold = [224,169,60], violet = [169,123,232], flat = [91,106,125];
  const cream = [207,198,178], slate = [91,106,125];
  const c = document.createElement("canvas");
  // Breite in Geraetepixeln, damit die Balkenenden beim Kopieren nicht
  // schon im Streifen verwaschen sind. Hoehe: genau ein Punkt je Band.
  const bw2 = Math.max(1, Math.round(maxW*dpr));
  c.width = bw2; c.height = hoehe;
  const rh = hoehe / nB;
  // Winziger Ueberstand, damit zwischen zwei Zeilen keine Haarlinie
  // durchscheint, wo die Kantenglaettung beide zur Haelfte deckt.
  const ueber = rh*0.25;
  const g = c.getContext("2d");
  for(let i=0;i<nB;i++){
    const w = W_[i]|0;
    if(w <= 4) continue;
    const inVA = i >= va0 && i <= va1;
    let rgb, alpha;
    if(S.profileMode === "heat"){
      // Value Area in Creme bis Weiss, ausserhalb gedaempftes
      // Schiefergrau. Die Staerke steckt schon in der Balkenlaenge - die
      // Farbe muss sie nicht ein zweites Mal erzaehlen und traegt
      // stattdessen die Frage, die man beim Blick auf ein Volumenprofil
      // zuerst stellt: liegt dieser Preis drinnen oder draussen.
      const t = w/1000;
      rgb = inVA ? cream.map(x=> Math.round(x + (255-x)*t*0.55)) : slate;
      alpha = inVA ? 0.58 + 0.40*t : 0.26 + 0.30*t;
    } else {
      // Rollenfarben: Faerbung nach gehandelter Optionsseite. Die
      // Empfindlichkeit ist auf 25 Prozentpunkte um die Mitte gestellt,
      // nicht auf die vollen 0 bis 100. Gemessen schwankt der
      // Call-Anteil je Band real zwischen 31 und 59 Prozent - gegen die
      // volle Skala gerechnet blieb ein Farbausschlag von einem Drittel
      // uebrig und das ganze Profil sah einheitlich grau aus.
      const t = Math.max(-1, Math.min(1, ((CS[i]==null?50:CS[i]) - 50)/25));
      const to = t >= 0 ? gold : violet, kk = Math.abs(t);
      rgb = flat.map((f,j)=> Math.round(f + (to[j]-f)*kk));
      alpha = inVA ? 0.50 : 0.24;
    }
    g.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
    // Band 0 liegt beim TIEFSTEN Preis, die Bildzeile 0 aber oben -
    // also von unten nach oben fuellen. Andersherum stuende das Profil
    // auf dem Kopf und der POC laege am falschen Ende.
    g.fillRect(0, (nB-1-i)*rh, bw2*w/1000, rh+ueber);
  }
  _vpCache = {vp, k, c};
  return c;
}

function drawProfile(ctx, y, pw, ph, topPad, V){
  const vp = S.data.vp;
  const maxW = Math.min(pw*0.19, 74);

  // Value Area ueber die ganze Chartbreite, nicht nur hinter dem Profil.
  // Sie ist eine Aussage ueber den Kursbereich, nicht ueber den Streifen:
  // hier liefen 70 Prozent des Volumens, und der Kurs kehrt dorthin
  // ueberdurchschnittlich oft zurueck.
  if(S.layers.va && vp.val && vp.vah){
    const y1=Math.min(y(vp.vah), y(vp.val)), y2=Math.max(y(vp.vah), y(vp.val));
    const h=Math.abs(y2-y1);
    const g=ctx.createLinearGradient(0,y1,0,y2);
    g.addColorStop(0,   "rgba(158,71,86,.05)");
    g.addColorStop(0.5, "rgba(158,71,86,.15)");
    g.addColorStop(1,   "rgba(158,71,86,.05)");
    ctx.fillStyle=g; ctx.fillRect(0, y1, pw, h);
    // Kanten: VAH und VAL sind die Marken, an denen sich entscheidet,
    // ob der Kurs in der Spanne bleibt oder sie verlaesst.
    ctx.strokeStyle=V("--va"); ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    [y1,y2].forEach(yy=>{
      const ly=snap(yy)+half();
      ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(pw,ly); ctx.stroke();
    });
    ctx.setLineDash([]); ctx.globalAlpha=1;
    ctx.font="8px "+V("--mono"); ctx.fillStyle=V("--va"); ctx.textAlign="right";
    ctx.globalAlpha=.85;
    ctx.fillText("VAH", pw-4, y1+10); ctx.fillText("VAL", pw-4, y2-4);
    ctx.globalAlpha=1; ctx.textAlign="left";
  }

  // Baender: einmal gezeichnet, danach kopiert.
  //
  // Bei 1000 Baendern waren das 1000 Fuellbefehle JE BILD, dazu je Band
  // zwei Feldabbildungen und ein zusammengesetzter Farbtext. Gemessen
  // kostete das Profil allein 9,6 der 23 Millisekunden eines Bildes -
  // und es aenderte sich dabei nie: die Baender haengen am Profil und an
  // der Farbwahl, nicht am Ausschnitt.
  //
  // Deshalb wird der Streifen in seinem EIGENEN Raster vorgezeichnet -
  // ein Bildpunkt Hoehe je Band, also 1000 Zeilen - und danach als ein
  // einziges Bild auf die Preisskala gedehnt. Weil Preis und Bandindex
  // linear zusammenhaengen, ist das genau dieselbe Abbildung wie vorher,
  // nur in einem Befehl statt in tausend. Die Glaettung der Leinwand
  // mischt beim Verkleinern die Zeilen - was der frueher handgerechnete
  // Ueberstand erzwingen sollte, macht sie von sich aus richtig.
  const yTop = y(vp.lo + vp.step*(vp.bins_n || 1000));
  const yBot = y(vp.lo);
  const streifen = profilStreifen(vp, maxW, Math.round((yBot-yTop)*dpr));
  if(streifen){
    if(yBot > yTop){
      ctx.save();
      ctx.beginPath(); ctx.rect(0, topPad, pw, ph); ctx.clip();
      ctx.drawImage(streifen, 0, yTop, maxW, yBot - yTop);
      ctx.restore();
    }
  }

  // POC: die Zeile, an der am meisten umging
  if(vp.poc){
    const yy = snap(y(vp.poc))+half();
    ctx.strokeStyle=V("--pivot"); ctx.lineWidth=1.4; ctx.globalAlpha=.95;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(maxW+10,yy); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.font="8px "+V("--mono"); ctx.fillStyle=V("--pivot"); ctx.textAlign="left";
    ctx.fillText("POC", maxW+13, yy+3);
  }
  // Knoten und Vakuum am linken Rand markieren
  (vp.hvn||[]).forEach(n=>{
    const yy=snap(y(n.p))+half();
    if(yy<topPad||yy>topPad+ph) return;
    ctx.strokeStyle=V("--ink-dim"); ctx.globalAlpha=.7; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(7,yy); ctx.stroke(); ctx.globalAlpha=1;
  });
  (vp.lvn||[]).forEach(n=>{
    const yy=snap(y(n.p))+half();
    if(yy<topPad||yy>topPad+ph) return;
    ctx.strokeStyle=V("--warn"); ctx.globalAlpha=.55; ctx.lineWidth=1;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(maxW*0.5,yy); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  });
}

/** Vorgezeichnete Orbs mit Leuchtkern.

    Ein radialer Verlauf je Punkt waere bei ueber tausend Orbs zu teuer.
    Stattdessen wird je Farbe und gerasterter Groesse einmal ein Sprite
    gezeichnet und danach nur noch kopiert - das haelt das Schieben
    fluessig und gibt trotzdem echtes Leuchten statt flacher Kreise. */
const ORB_SPRITES = new Map();
function orbSprite(color, r){
  const key = color+"|"+r+"|"+dpr;
  let sp = ORB_SPRITES.get(key);
  if(sp) return sp;
  // Eine Perle, kein Leuchten. Die Vorlage besteht aus abzaehlbaren
  // Punkten mit klarer Kante; der weiche Verlauf von vorher liess sie zu
  // einem durchgehenden Schlauch verschmelzen, in dem sich nichts mehr
  // unterscheiden liess. Der Farbverlauf reicht deshalb nur noch knapp
  // ueber den Rand - gerade genug gegen Treppenstufen, nicht so weit,
  // dass benachbarte Perlen ineinanderlaufen.
  const pad = r*1.22, size = Math.ceil(pad*2*dpr);
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  const cx = pad, cy = pad;
  const grad = g.createRadialGradient(cx,cy,0, cx,cy,pad);
  grad.addColorStop(0,    color);
  grad.addColorStop(0.80, color);
  grad.addColorStop(0.92, color+"AA");
  grad.addColorStop(1,    color+"00");
  g.fillStyle = grad;
  g.beginPath(); g.arc(cx,cy,pad,0,6.2832); g.fill();
  sp = {canvas:c, pad};
  ORB_SPRITES.set(key, sp);
  return sp;
}

/** Alles, was an Waenden und Spuren haengt und nicht am Ausschnitt.

    Diese Rechnung lief bisher in jedem Bild: zwei Karten aufbauen, ueber
    alle Stuetzstellen laufen, eine Liste sortieren. Waehrend eines Wischs
    also sechzig mal je Sekunde - fuer ein Ergebnis, das sich nur aendert,
    wenn neue Spurdaten eintreffen. Das ist einmal je Nachladen.

    Staerke einer Wand als NOMINAL, nicht als Kontraktzahl.

    Die Helligkeit vergleicht Waende ueber Ketten hinweg, und Kontrakte
    sind nicht ueberall gleich gross: ein NDX-Kontrakt laeuft auf 100
    Indexpunkte, ein QQQ-Kontrakt auf 100 Anteile - das 41-fache je
    Stueck. Gegen ein gemeinsames Maximum aus Kontraktzahlen gerechnet
    erschien die staerkste NDX-Wand mit 3.511 Kontrakten neben QQQ mit
    235.246 bei 1,5 Prozent Helligkeit, also gar nicht. Sie war da, nur
    unsichtbar. In Nominal sind es 10,6 gegen 20,1 Mrd - Faktor 1,9
    statt 78. Und das ist auch die richtige Groesse: eine Wand wirkt,
    weil der Dealer dagegen absichern muss, und wieviel er kaufen oder
    verkaufen muss, haengt am Geld, nicht an der Zahl der Tickets.

    PULS: was in DIESEN zwei Minuten am Strike geschah.

    Das Band war bisher ueber den ganzen Tag gleich hell, und das war
    kein Darstellungsfehler, sondern eine Folge der Datenlage: moduliert
    wurde mit dem Open Interest, und der steht waehrend der Sitzung
    still - die OCC rechnet ihn ueber Nacht. Gemessen an einem 0DTE-Call
    mit 731 Kontrakten Tagesumsatz und Open Interest null ist das kein
    Zweifelsfall. Ein Band aus OI KANN nicht atmen.

    Das gehandelte Volumen laeuft dagegen live mit. Es ist ueber den Tag
    kumuliert, also sagt erst die DIFFERENZ zweier Stuetzstellen, was
    gerade passiert. Die Groessenordnung rechtfertigt den Aufwand: im
    Band um den Kurs wurden heute 76.858 Kontrakte gehandelt gegen
    39.136 stehendes OI - 196 Prozent Umschlag.

    Bezug ist das 95. Perzentil, nicht das Maximum - dieselbe Lehre wie
    beim Volumenprofil. Gemessen: ein einzelner Sprung von 161.995 gegen
    einen Median von 29. Gegen dieses Maximum normiert waere jeder echte
    Schub auf zwei Promille Helligkeit gefallen. */
const nomWand = (oi, strike) => oi * 100 * (strike || 1);
let _orbCache = {w:null, t:null, v:null};
function orbVorberechnung(walls, tracks){
  if(_orbCache.w === walls && _orbCache.t === tracks) return _orbCache.v;
  const rec = new Map(), puls = new Map(), alle = [];
  let peak = 0;
  tracks.forEach(tk=>{
    const pts = tk.points;
    for(let i=0;i<pts.length;i++){
      const q = pts[i];
      rec.set(`${tk.chain}|${tk.side}|${tk.strike}|${q.t}`, q);
      const n = nomWand(q.oi, tk.strike);
      if(n > peak) peak = n;
      // Nur Zuwachs zaehlt. Faellt der kumulierte Wert (neuer Tag,
      // Neustart der Bruecke), ist das kein Handel, sondern ein
      // Zaehlerwechsel - und der darf nicht als Ausbruch aufleuchten.
      const vPrev = i ? (pts[i-1].v || 0) : (q.v || 0);
      const dv = Math.max(0, (q.v || 0) - vPrev);
      puls.set(`${tk.chain}|${tk.side}|${tk.strike}|${q.t}`, dv);
      if(dv > 0) alle.push(dv);
    }
  });
  walls.forEach(w=>{ const n = nomWand(w.oi, w.strike); if(n > peak) peak = n; });
  let v = null;
  if(peak > 0){
    alle.sort((a,b)=>a-b);
    const pulsPeak = alle.length
      ? Math.max(alle[Math.min(alle.length-1, Math.floor(alle.length*0.95))], 1)
      : 0;
    v = {rec, puls, peak, pulsPeak};
  }
  _orbCache = {w:walls, t:tracks, v};
  return v;
}

/** Wand-Verlauf als Orb-Ketten: x = Zeit, y = Preis, Radius = Bestand.
    Eine Linie sagt, wo die Wand liegt. Die Kette sagt zusaetzlich, ob
    sie waechst oder zerfaellt. */
/** Der WEG wandernder Marken - Zero-Gamma, Max Pain.

    Bewusst eine Linie und keine Perlenkette. Die Kette taugt fuer eine
    Wand, weil die auf ihrem Strike sitzt und sich nur ihre Staerke
    aendert - jede Perle steht dann fuer denselben Preis. Das Zero-Gamma
    sitzt auf keinem Strike: es ist die Nullstelle einer Kurve und
    wandert mit der impliziten Vola. Eine Kette von Perlen auf
    wechselnder Hoehe waere kein Band mehr, sondern Streusel.

    Und es ist die Bewegung, die zaehlt. Dass das Zero-Gamma 58 Punkte
    entfernt steht, ist eine Zahl; dass es dem Kurs seit einer Stunde
    entgegenkommt, ist eine Aussage. */
function drawPaths(ctx, bars, y, xT, pw, ph, V, topPad){
  const paths = S.trails?.paths;
  if(!paths || !bars.length) return;
  const t0 = bars[0].t, t1 = bars[bars.length-1].t;
  // Auf die Zeichenflaeche beschneiden. Ein wandernder Weg verlaesst sie
  // haeufiger als eine waagerechte Wand - ohne Beschnitt lief er ueber
  // die Zeitachse und die Werkzeugleiste hinaus.
  ctx.save();
  ctx.beginPath(); ctx.rect(0, topPad, pw, ph); ctx.clip();
  const stil = {
    flip:     {c:"--pivot",  w:1.3, dash:[3,3], lab:"Zero-Gamma"},
    max_pain: {c:"--struct", w:1.0, dash:[1,4], lab:"Max Pain"},
  };
  Object.entries(paths).forEach(([name, pts])=>{
    const st = stil[name]; if(!st || pts.length < 2) return;
    const seg = pts.filter(q=>q.t >= t0 - 120 && q.t <= t1 + 120);
    if(seg.length < 2) return;
    ctx.strokeStyle = V(st.c); ctx.lineWidth = st.w;
    ctx.setLineDash(st.dash); ctx.globalAlpha = .62;
    ctx.beginPath();
    let auf = false;
    seg.forEach(q=>{
      const x = xT(q.t), yy = y(q.p);
      if(yy < topPad-40 || yy > topPad+ph+40){ auf = false; return; }
      if(!auf){ ctx.moveTo(x, yy); auf = true; } else ctx.lineTo(x, yy);
    });
    ctx.stroke(); ctx.setLineDash([]);
    // Der letzte Punkt bekommt einen Kopf, damit das Ende der Spur
    // ablesbar ist und nicht im Nichts ausfranst.
    const last = seg[seg.length-1], ly = y(last.p);
    if(ly >= topPad-2 && ly <= topPad+ph+2){
      ctx.globalAlpha = .9; ctx.fillStyle = V(st.c);
      ctx.beginPath(); ctx.arc(xT(last.t), ly, 2.1, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
  ctx.restore();
}

/** Die Gamma-Kurve: Netto-Gamma ueber den Preis, quer gelegt.

    Diese Funktion gab es nicht. Der Schalter "Gamma-Kurve" stand seit
    jeher im Menue der Ebenen und rief sie auf - wer ihn umlegte, bekam
    keinen Fehlerhinweis, sondern einen schwarzen Chart: der Aufruf brach
    draw() ab, bevor eine einzige Kerze gezeichnet war, und blieb
    abgebrochen, weil der Schalter gesetzt blieb.

    Gelesen wird sie wie ein Profil, nur dass nicht Volumen nach rechts
    steht, sondern Gamma - und zwar mit Vorzeichen. Gold heisst positiv:
    dort daempfen die Absicherungen der Haendler die Bewegung. Violett
    heisst negativ: dort verstaerken sie sie. Der Punkt dazwischen ist
    das Zero-Gamma, und er ist der Grund fuer die ganze Darstellung -
    eine Zahl sagt, wo es liegt, die Kurve sagt, wie steil der Uebergang
    ist. Ein flacher Durchgang ist eine Grenze, die nichts kostet; ein
    steiler ist eine Wand. */
function drawGammaCurve(ctx, y, pw, ph, V, lo, hi, topPad){
  const c = S.data?.curve;
  if(!Array.isArray(c) || c.length < 3) return;
  let m = 0;
  for(const q of c){ const a = Math.abs(q.gex || 0); if(a > m) m = a; }
  if(!(m > 0)) return;

  // Rechte Haelfte der Flaeche: links steht das Volumenprofil.
  const x0 = pw*0.68, amp = pw*0.20;
  const gx = g => x0 + (Math.max(-1, Math.min(1, g/m))) * amp;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, topPad, pw, ph); ctx.clip();

  // Nulllinie. Ohne sie ist die Kurve eine Schlangenlinie ohne Bezug.
  ctx.strokeStyle=V("--ink-faint"); ctx.globalAlpha=.4; ctx.lineWidth=1;
  ctx.setLineDash([2,4]);
  const zx=snap(x0)+half();
  ctx.beginPath(); ctx.moveTo(zx,topPad); ctx.lineTo(zx,topPad+ph); ctx.stroke();
  ctx.setLineDash([]);

  // Abschnittweise fuellen statt in einem Zug: so faerbt sich jeder
  // Abschnitt nach seinem eigenen Vorzeichen und der Wechsel braucht
  // keine Sonderbehandlung.
  for(let i=0;i<c.length-1;i++){
    const a=c[i], b=c[i+1];
    const ya=y(a.s), yb=y(b.s);
    if((ya<topPad-30&&yb<topPad-30)||(ya>topPad+ph+30&&yb>topPad+ph+30)) continue;
    ctx.fillStyle = ((a.gex||0)+(b.gex||0))/2 >= 0 ? V("--resist") : V("--support");
    ctx.globalAlpha=.12;
    ctx.beginPath();
    ctx.moveTo(x0,ya); ctx.lineTo(gx(a.gex||0),ya);
    ctx.lineTo(gx(b.gex||0),yb); ctx.lineTo(x0,yb);
    ctx.closePath(); ctx.fill();
  }

  ctx.globalAlpha=.7; ctx.lineWidth=1.2; ctx.strokeStyle=V("--pivot");
  ctx.beginPath();
  c.forEach((q,i)=>{ const xx=gx(q.gex||0), yy=y(q.s);
    i ? ctx.lineTo(xx,yy) : ctx.moveTo(xx,yy); });
  ctx.stroke();

  // Jeder Vorzeichenwechsel bekommt seinen Punkt. In der Regel ist es
  // einer; sind es mehrere, ist genau das die Aussage.
  for(let i=0;i<c.length-1;i++){
    const ga=c[i].gex||0, gb=c[i+1].gex||0;
    if((ga>=0) === (gb>=0)) continue;
    const t=Math.abs(ga)/(Math.abs(ga)+Math.abs(gb) || 1);
    const yy=y(c[i].s + (c[i+1].s - c[i].s)*t);
    if(yy<topPad||yy>topPad+ph) continue;
    ctx.globalAlpha=1; ctx.fillStyle=V("--pivot");
    ctx.beginPath(); ctx.arc(x0,yy,2.6,0,6.2832); ctx.fill();
    ctx.font="8px "+V("--mono"); ctx.textAlign="left";
    ctx.fillText("γ = 0", x0+7, yy-4);
  }
  ctx.globalAlpha=1; ctx.textAlign="left"; ctx.restore();
}

function drawOrbs(ctx, bars, y, xT, pw, ph, V, topPad){
  const walls = S.data?.leading_walls || [];
  const tr = S.trails;
  const tracks = (tr && tr.tracks) || [];
  if(!walls.length && !tracks.length) return;
  if(!bars.length) return;

  const bucket = (tr && tr.bucket) || 120;
  const t0 = bars[0].t, t1 = bars[bars.length-1].t;

  // Waende und Spuren aendern sich nur beim Nachladen - die Rechnung
  // dazu steht in orbVorberechnung() und wird gemerkt.
  const vor = orbVorberechnung(walls, tracks);
  if(!vor) return;
  const {rec, puls, peak, pulsPeak} = vor;

  // Schrittweite: nie enger als fuenfeinhalb Bildpunkte. Bei vier lagen
  // die Perlen in ruhigen Abschnitten so dicht, dass sie trotz Luecke zu
  // einer Linie verschwammen - und eine Linie sagt nichts darueber, ob
  // dort etwas geschah. Erst mit sichtbarem Abstand bleibt die Kette
  // abzaehlbar, und genau das ist der Punkt an einer Perlenkette.
  // Wie weit zurueck darf das Band ueberhaupt behauptet werden?
  //
  // Gezeichnet wurde bisher ueber den ganzen sichtbaren Zeitraum. Auf
  // der Minutenebene ist das richtig: die Wand steht seit heute frueh
  // dort, und wo nicht gemessen wurde, ist die Perle blasser. Auf der
  // TAGESEBENE mit drei Jahren im Bild wurde daraus eine Behauptung,
  // die falsch ist - die Wand bei 30.000 gab es 2023 nicht, und das
  // Band zog trotzdem quer durch den ganzen Chart.
  //
  // Zwei Tage sind die Grenze: so weit reicht ein Bestand, den man ohne
  // Messung noch fortschreiben darf. Was aelter ist, wurde nicht
  // erhoben und wird auch nicht gezeigt.
  const VORLAUF = 2*86400;
  const tStart = Math.max(t0, t1 - VORLAUF);
  const pxPerSec = (pw) / Math.max(1, (t1 - tStart));
  const step = Math.max(bucket, Math.ceil(5.5 / Math.max(pxPerSec, 1e-9) / bucket) * bucket);

  walls.forEach(w=>{
    const yy = y(w.price);
    if(yy < topPad-6 || yy > topPad+ph+6) return;
    const col = V(w.side === "call" ? "--resist" : "--support");
    const isIndex = w.chain_kind === "Index";
    const key = `${w.chain}|${w.side}|${w.strike}`;

    for(let t = tStart; t <= t1 + bucket; t += step){
      const x = xT(t);
      if(x < -8 || x > pw + 8) continue;
      // Gemessen oder angenommen? Ein aufgezeichneter Wert schlaegt den
      // aktuellen Bestand, sonst gilt der aktuelle als Annahme.
      const slot = t - (t % bucket);
      const measured = rec.get(`${key}|${slot}`);
      const oi = measured ? measured.oi : w.oi;
      const rel = Math.min(1, nomWand(oi, w.strike) / peak);

      // Der Puls dieses Zeitfensters. Wurzel statt linear, damit auch
      // maessiger Handel sichtbar wird und nicht nur der eine Ausreisser
      // des Tages alles andere flach druckt.
      const dv = measured ? (puls.get(`${key}|${slot}`) || 0) : 0;
      const imp = pulsPeak > 0 ? Math.sqrt(Math.min(1, dv / pulsPeak)) : 0;

      // Das Fundament traegt die Groesse, der Puls legt darauf. So bleibt
      // die Wand auch in einer stillen Minute sichtbar, statt zu
      // verschwinden - sie ist ja weiter da, es geschieht nur nichts.
      //
      // Die Untergrenze lag vorher bei 1,1 Bildpunkten, und damit hatte
      // JEDE Wand zu JEDER Zeit dieselbe Mindestdicke: aus dem Band wurde
      // ein durchgehender Schlauch, und eine schwache Wand sah aus wie
      // eine mittlere. Jetzt faellt die Groesse bis fast auf null, und
      // unterhalb einer halben Perle wird gar nicht gezeichnet - so
      // entstehen die Luecken und die einzelnen Punkte der Vorlage.
      const staerke = Math.pow(rel, 0.7);
      const r = Math.round((0.35 + 4.2*staerke + 3.0*imp) * 2) / 2;
      if(r < 0.5) continue;
      const sp = orbSprite(col, r);
      // Nicht gemessene Abschnitte deutlich zurueckgenommen: das Band
      // zeigt, DASS die Wand da ist, ohne eine Staerke zu behaupten,
      // die nicht erhoben wurde.
      const base = measured ? (0.16 + 0.62*staerke) : (0.08 + 0.34*staerke);
      ctx.globalAlpha = Math.min(1, base + 0.42*imp);
      ctx.drawImage(sp.canvas, x - sp.pad, yy - sp.pad, sp.pad*2, sp.pad*2);
      // Der Index-Ring blieb aus: er zog um jede kraeftige Perle einen
      // zweiten Kreis und machte aus der klaren Kette wieder ein
      // Geflimmer. Woher eine Wand stammt, sagt die Wandliste.
      void isIndex;
    }
  });
  ctx.globalAlpha = 1;
}

/** Ruhige Ladeanzeige: ein Bogen, der laeuft, und ein Satz dazu.

    Vorher stand hier "keine Kursdaten" - dieselben drei Woerter beim
    Warten wie beim Ausfall. Der Unterschied ist aber der wichtigste:
    beim einen soll man warten, beim anderen nachsehen. Also zwei
    Zustaende, zwei Bilder, und der laufende Bogen sagt ohne Worte, dass
    etwas passiert.

    Der Bogen laeuft nur, solange geladen wird. Eine Zeichenschleife, die
    im Hintergrund weiterdreht, kostet auf einem Telefon Akku fuer ein
    Bild, das niemand ansieht. */
let ladeRaf = 0;
function ladeBild(V){
  const cx = W/2, cy = (H-PAD.b)/2 + PAD.t;
  const fehler = S.ladeFehler;
  ctx.textAlign = "center";
  if(!fehler){
    const t = performance.now()/1000;
    const r = 15;
    ctx.lineWidth = 2.4; ctx.lineCap = "round";
    ctx.strokeStyle = V("--panel-3");
    ctx.beginPath(); ctx.arc(cx, cy-14, r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = V("--resist"); ctx.globalAlpha = .95;
    const a0 = (t*1.9) % 6.2832;
    ctx.beginPath(); ctx.arc(cx, cy-14, r, a0, a0 + 1.5 + Math.sin(t*1.3)*0.55);
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = V("--ink-dim"); ctx.font = "13px "+V("--sans");
    ctx.fillText("Kursdaten werden geholt", cx, cy+22);
    ctx.fillStyle = V("--ink-faint"); ctx.font = "11px "+V("--sans");
    ctx.fillText(SYM[S.market] ? SYM[S.market]+" · "+S.tf : S.tf, cx, cy+40);
    if(!ladeRaf) ladeRaf = requestAnimationFrame(()=>{ ladeRaf = 0; draw(); });
  } else {
    ctx.fillStyle = V("--warn"); ctx.font = "13px "+V("--sans");
    ctx.fillText("keine Kursdaten", cx, cy-6);
    ctx.fillStyle = V("--ink-faint"); ctx.font = "11px "+V("--sans");
    ctx.fillText(esc(fehler), cx, cy+14);
    ctx.fillText("wird weiter versucht", cx, cy+32);
  }
  ctx.textAlign = "left";
}

function draw(){
  const V=n=>TH[n]||"";
  ctx.clearRect(0,0,W,H);
  const alle=S.data?.bars||[];
  if(!alle.length){ ladeBild(V); return; }
  // Sind die juengsten Balken von heute? Entscheidet weiter unten ueber
  // das Datum auf der Achse und hier oben ueber das Sitzungsschild.
  const nichtHeuteOben =
    new Date(alle[alle.length-1].t*1000).toDateString() !== new Date().toDateString();
  const topPad = PAD.t + (S.immersive ? 6 : CHROME*0.42);
  const pw=W-PAD.r, ph=H-PAD.b-topPad;
  // Grund mit leichtem Verlauf statt Flaeche - die Kerzen stehen dadurch
  // freier, ohne dass eine zweite Farbe ins Spiel kommt. Gebacken.
  const HG = hintergrund(topPad, pw, ph);
  ctx.drawImage(HG.grund, 0, 0, W, H);

  // Der Ausschnitt ist ein Bruch, und er wird auch als Bruch gezeichnet.
  //
  // Vorher schnitt vbars() die sichtbaren Balken heraus und die Breite
  // ergab sich aus ihrer ANZAHL. Damit war jede Zwischenstellung
  // verloren: ein Wisch von 120 Bildpunkten erzeugte gemessen 25
  // verschiedene Bilder statt eines je Bildaufbau - der Chart sprang in
  // Stufen von einem Balken, statt dem Finger zu folgen. Und weil die
  // Anzahl zwischen 71 und 72 wechselte, aenderte sich bei jedem Sprung
  // zugleich die Balkenbreite und alles zuckte.
  //
  // Jetzt bestimmt die SPANNE die Breite, und die Lage jedes Balkens
  // haengt an seinem absoluten Index. i0 darf beliebig krumm sein.
  const vw = S.vw || {i0:0, i1:alle.length};
  const sp = Math.max(1e-6, vw.i1 - vw.i0);
  const bw = pw / sp;
  const X  = i => (i - vw.i0 + 0.5) * bw;        // Mitte von Balken i
  const iL = Math.max(0, Math.floor(vw.i0) - 1);
  const iR = Math.min(alle.length - 1, Math.ceil(vw.i1) + 1);
  const bars = alle.slice(iL, iR + 1);
  if(!bars.length) return;
  const xT = ts => X(tToI(ts, alle));

  let lo=Infinity, hi=-Infinity;
  for(let i=0;i<bars.length;i++){
    if(bars[i].l < lo) lo = bars[i].l;
    if(bars[i].h > hi) hi = bars[i].h;
  }
  const lv=chartLevelsCached(), range=(hi-lo)||1;
  const slack = S.fitAll ? Infinity : range*0.45;
  const loL=lo-slack, hiL=hi+slack;
  const barLo=lo, barHi=hi, barRange=(barHi-barLo)||1;
  lv.forEach(l=>{ if(l.p>=loL&&l.p<=hiL){ lo=Math.min(lo,l.p); hi=Math.max(hi,l.p); }});
  if(S.data.spot){ lo=Math.min(lo,S.data.spot); hi=Math.max(hi,S.data.spot); }
  // Harte Klemme statt Schwellenwert: ein Level darf die Skala um
  // hoechstens ein Viertel der Kerzenspanne je Seite aufziehen. Damit
  // gehoeren den Kerzen immer mindestens zwei Drittel des Bildes, und
  // was weiter weg liegt, sagt die Randmarke.
  if(!S.fitAll){
    lo = Math.max(lo, barLo - barRange*0.25);
    hi = Math.min(hi, barHi + barRange*0.25);
  } else {
    // "Alles zeigen" hiess woertlich alles - und das war der Fehler.
    //
    // Gemessen: die Skala sprang von 183 auf 3.276 Punkte, weil die
    // Put-Wand bei 27.500 und die Call-Wand bei 30.000 mit hineingezogen
    // wurden. Die Kerzen des Tages umfassen 183 Punkte, also 5,6 Prozent
    // davon - ein verwaschener Streifen, in dem keine einzelne Kerze
    // mehr zu erkennen war. Der Chart sah kaputt aus, nicht
    // herausgezoomt, und genau so wurde er auch gemeldet.
    //
    // Auch die weiteste Ansicht muss den Kurs noch zeigen. Das
    // Sechsfache der Kerzenspanne laesst ihnen ein Sechstel der Hoehe -
    // genug, um eine Kerze als Kerze zu lesen - und zeigt trotzdem ein
    // Vielfaches dessen, was die normale Ansicht zeigt. Was danach noch
    // ausserhalb liegt, nennt die Randmarke; die ist dafuer jetzt auch
    // in dieser Ansicht eingeschaltet.
    const mitte = S.data.spot != null ? S.data.spot : (barLo + barHi) / 2;
    const halb = barRange * 3;
    lo = Math.max(lo, Math.min(barLo, mitte - halb));
    hi = Math.min(hi, Math.max(barHi, mitte + halb));
  }

  // Der Kurs steht in der Mitte, und zwar immer.
  //
  // Vorher folgte die Skala allein der Kerzenspanne, und der Kurs landete,
  // wo er landete - am Tageshoch klebte er oben am Rand, am Tagestief
  // unten. Genau dann ist er aber am wichtigsten, und genau dann sah man
  // in die Richtung, in die er sich bewegte, am wenigsten Platz.
  //
  // Gespiegelt wird um den Kurs: der halbe Ausschnitt ist so gross wie
  // der weiteste Abstand vom Kurs zu einer Kerze. Damit ist jede Kerze
  // vollstaendig im Bild - das ist die zweite Bedingung - und oben wie
  // unten steht gleich viel Raum.
  //
  // Der Preis dafuer ist ehrlich zu benennen: steht der Kurs am Rand der
  // Tagesspanne, bleibt die Gegenseite leer. Das ist keine Verschwendung,
  // sondern die Aussage - der Raum zeigt, wie weit es zurueck zur anderen
  // Seite ist.
  if(!S.fitAll && S.data.spot){
    const c = S.data.spot;
    // Zwei Halbspannen: eine, die nur die Kerzen fasst, und eine, die
    // auch die nahen Level einschliesst.
    const halfBars = Math.max(c - barLo, barHi - c, barRange * 0.10);
    const halfLv   = Math.max(c - lo, hi - c);
    // Die Level duerfen mitziehen, aber nur um ein Drittel. Ohne diese
    // Grenze bestimmte ein Level die Skala und das Spiegeln verdoppelte
    // seinen Einfluss noch: gemessen blieben den Kerzen 47 Prozent der
    // Hoehe. Das Zentrieren allein kostet nicht so viel - es war das
    // Level, und was ausserhalb bleibt, sagt ohnehin die Randmarke.
    const half = Math.max(halfBars, Math.min(halfLv, halfBars * 1.35));
    lo = c - half; hi = c + half;
  }
  const pd=(hi-lo)*0.06||1; lo-=pd; hi+=pd;

  // Was die Automatik ergeben haette, bleibt gemerkt. Greift der Finger
  // an die Skala, faengt sie genau hier an - ohne Sprung.
  S.autoScale = {lo, hi};
  // Von Hand gesetzt schlaegt automatisch. Sonst waere jede Bewegung an
  // der Preisachse im naechsten Bild wieder weggerechnet.
  if(S.vs){
    lo = S.vs.lo; hi = S.vs.hi;
    if(!(hi > lo)){ S.vs = null; lo = S.autoScale.lo; hi = S.autoScale.hi; }
  }
  const y=p=>topPad+(hi-p)/(hi-lo)*ph;
  const pAt=yy=>hi-(yy-topPad)/ph*(hi-lo);   // Umkehrung, fuer die Gesten
  S.geo = {topPad, ph, pw, bw, lo, hi, y, pAt};

  // Preisleiter. Die Marken der Level sagen, WO etwas liegt; erst die
  // Leiter sagt, WIEVIEL dazwischen liegt. Ohne sie war der rechte Rand
  // eine Sammlung von Schildern ohne Massstab.
  //
  // Gerechnet wird in Brokerpreisen, nicht in Indexpreisen: runde Zahlen
  // sind nur dort rund, wo sie auch gelesen werden. Um einen Versatz von
  // 69 Punkten verschoben waere aus 29.200 sonst 29.269 geworden - eine
  // Leiter aus krummen Zahlen.
  const off = S.off || 0;
  const tick = niceStep((hi-lo), Math.max(3, Math.min(9, Math.round(ph/54))));
  const t0T = Math.ceil((lo+off)/tick)*tick, t1T = (hi+off);
  const dez = tick < 1 ? Math.min(4, Math.ceil(-Math.log10(tick))) : 0;
  ctx.strokeStyle=V("--line-soft"); ctx.lineWidth=1; ctx.globalAlpha=.55;
  ctx.beginPath();
  for(let p=t0T; p<=t1T; p+=tick){
    const yy=snap(y(p-off))+half();
    if(yy<topPad||yy>topPad+ph) continue;
    ctx.moveTo(0,yy); ctx.lineTo(pw,yy);
  }
  ctx.stroke(); ctx.globalAlpha=1;

  if(S.layers.profil && S.data.vp?.w) drawProfile(ctx, y, pw, ph, topPad, V);
  if(S.layers.tpo) drawTPO(ctx, y, pw, ph, topPad, V);
