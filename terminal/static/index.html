  if(S.layers.orbs) drawPaths(ctx, bars, y, xT, pw, ph, V, topPad);
  if(S.layers.zonen) (S.data.zones||[]).forEach(z=>{
    const y1=y(z.top),y2=y(z.bot);
    const c = z.role==="resist"?"224,169,60" : z.role==="support"?"169,123,232" : "207,198,178";
    ctx.fillStyle=`rgba(${c},.075)`; ctx.fillRect(0,y1,pw,Math.max(1.5,y2-y1));
  });

  if(S.layers.gcurve) drawGammaCurve(ctx, y, pw, ph, V, lo, hi, topPad);
  if(S.layers.orbs) drawOrbs(ctx, bars, y, xT, pw, ph, V, topPad);

  const upC=V("--up"), dnC=V("--down");
  // Ein createLinearGradient JE KERZE waren bei 389 Kerzen 389 neue
  // Verlaufsobjekte in jedem Bild. Der Verlauf laeuft waagerecht ueber
  // die Koerperbreite und die ist fuer alle Kerzen gleich - also einmal
  // bauen, bei 0 beginnend, und den Koerper darunter schieben.
  // ... und nur, solange ein Koerper ueberhaupt breit genug ist, dass
  // man einen Verlauf darin sehen kann. Bei fuenf Bildpunkten Abstand
  // ist der Koerper drei Punkte breit - darin ist ein Verlauf keine
  // Plastizitaet, sondern ein Rechenposten. Das Sichern und
  // Zuruecksetzen des Zustands je Kerze schlug mit 9 Prozent der
  // Bildzeit zu Buche, fuer etwas Unsichtbares.
  const cwG = Math.max(1.3, (pw/sp)*0.6);
  const breit = cwG >= 6;
  const koerperG = col => {
    const g = ctx.createLinearGradient(0,0,cwG,0);
    g.addColorStop(0, col); g.addColorStop(1, col+"CC");
    return g;
  };
  const gUp = breit?koerperG(upC):null, gDn = breit?koerperG(dnC):null;
  bars.forEach((b,k)=>{
    const x=X(iL+k)-bw/2, cw=Math.max(1.3,bw*0.6), up=b.c>=b.o;
    const col = up?upC:dnC;
    // Docht auf das Geraetepixel rasten, sonst franst eine 1px-Linie aus
    const wx = snap(x+bw/2)+half();
    // Runde Kappe statt der Standardkappe: bei starkem Herauszoomen
    // fallen Hoch und Tief auf denselben Geraetepixel, aus dem Docht
    // wird eine Strecke der Laenge null - und die zeichnet mit der
    // Standardkappe GAR NICHTS. Mit runder Kappe bleibt an dieser
    // Stelle wenigstens ein Punkt in Linienbreite stehen. Eine Kerze
    // verschwindet damit nie restlos, egal wie weit die Skala steht.
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1/dpr, bw*0.055); ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(wx,snap(y(b.h))); ctx.lineTo(wx,snap(y(b.l))); ctx.stroke();
    ctx.lineCap="butt";
    const t=snap(y(Math.max(b.o,b.c))), bo=snap(y(Math.min(b.o,b.c)));
    const h=Math.max(1/dpr, bo-t), bx=snap(x+(bw-cw)/2);
    // Leichter Verlauf im Koerper: gibt der Kerze Volumen, ohne dass die
    // Farbe ihre Bedeutung verliert
    if(h > 3 && breit){
      ctx.save(); ctx.translate(bx, 0);
      ctx.fillStyle = up?gUp:gDn; ctx.fillRect(0, t, cw, h);
      ctx.restore();
    } else { ctx.fillStyle=col; ctx.fillRect(bx, t, cw, h); }
  });

  // Die Achse selbst: Trennstrich und Zahlen. Nach den Kerzen gezeichnet,
  // damit kein Docht hineinragt, und vor den Level-Schildern, damit diese
  // eine Zahl verdecken duerfen statt umgekehrt.
  ctx.fillStyle=V("--ground"); ctx.globalAlpha=.72;
  ctx.fillRect(pw, topPad-PAD.t, PAD.r, ph+PAD.t+PAD.b);
  ctx.globalAlpha=1;
  ctx.strokeStyle=V("--line"); ctx.lineWidth=1; ctx.globalAlpha=.7;
  const axX=snap(pw)+half();
  ctx.beginPath(); ctx.moveTo(axX,topPad-PAD.t); ctx.lineTo(axX,topPad+ph); ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle=V("--ink-faint"); ctx.font="9px "+V("--mono"); ctx.textAlign="left";
  for(let p=t0T; p<=t1T; p+=tick){
    const yy=y(p-off);
    if(yy<topPad+6||yy>topPad+ph-4) continue;
    ctx.strokeStyle=V("--line"); ctx.globalAlpha=.8;
    ctx.beginPath(); ctx.moveTo(axX,snap(yy)+half()); ctx.lineTo(axX+3,snap(yy)+half()); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillText(fmt(p, dez), pw+6, yy+3);
  }

  // Steht die Skala von Hand, sagt das ein Schalter am Fuss der Achse.
  // Eine Ansicht, aus der man nicht zurueckfindet, ist eine Falle.
  S.autoBtn = null;
  // Der Schalter erscheint, sobald irgendetwas von Hand steht - die
  // Skala ODER der Ausschnitt. Nur an der Skala festgemacht waere er
  // nach einem reinen Seitwaertswisch weg gewesen, und dann gaebe es
  // keinen Weg zurueck zum Kurs.
  // S.fitAll gehoert dazu. Ohne ihn erschien in der weiten Ansicht gar
  // kein AUTO - und das war der Zustand, in dem man ihn am dringendsten
  // braucht: die Kerzen sind klein, nichts sieht mehr vertraut aus, und
  // der einzige Weg zurueck waere derselbe Knopf gewesen, den man als
  // Ursache nicht erkannt hat.
  const vonHand = !!S.vs || S.fitAll || (S.vw && alle.length
      && (S.vw.i1 < alle.length - 0.6 || S.vw.i0 > alle.length - sp*(1-LUFT*0.5)));
  if(vonHand){
    const bw2=PAD.r-6, bh=13, bx=pw+3, by=topPad+ph-bh-2;
    ctx.fillStyle=V("--pivot"); ctx.globalAlpha=.9;
    ctx.fillRect(bx, by, bw2, bh); ctx.globalAlpha=1;
    ctx.fillStyle=V("--ground"); ctx.font="600 8.5px "+V("--mono"); ctx.textAlign="center";
    ctx.fillText("AUTO", bx+bw2/2, by+9);
    ctx.textAlign="left";
    S.autoBtn = {x:bx, y:by, w:bw2, h:bh};
  }

  const used=[], usedBox=[];
  lv.sort((a,b)=>a.p-b.p).forEach(l=>{
    const yy=y(l.p); if(yy<topPad-2||yy>topPad+ph+2) return;
    const c=V(l.c);
    ctx.globalAlpha=l.dim??1; ctx.strokeStyle=c; ctx.lineWidth=l.w; ctx.setLineDash(l.dash||[]);
    const ly = snap(yy)+half();
    ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(pw,ly); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    if(!l.badge) return;
    let by=yy; while(used.some(u=>Math.abs(u-by)<11)) by+=11;
    used.push(by);
    ctx.fillStyle=c; ctx.fillRect(pw+2, by-6.5, PAD.r-4, 12.5);
    ctx.fillStyle=V("--ground"); ctx.font="600 9.5px "+V("--mono"); ctx.textAlign="left";
    ctx.fillText(px(l.p), pw+5, by+2.5);
    if(l.lab && !S.layers.gpbox){
      ctx.fillStyle=c; ctx.font="8.5px "+V("--mono"); ctx.textAlign="right";
      ctx.globalAlpha=.9; ctx.fillText(l.lab, pw-4, by-1); ctx.globalAlpha=1;
    }
    // Beschriftungskasten in der Art der Desktop-Vorlage: Bezeichnung
    // oben, Preis darunter, direkt am Level statt nur an der Skala.
    if(l.lab && S.layers.gpbox){
      ctx.font="7.5px "+V("--mono");
      const w1=textW(ctx, l.lab);
      ctx.font="600 9px "+V("--mono");
      const w2=textW(ctx, px(l.p));
      // Rechts neben dem Profil absetzen, nicht darauf - im Desktop
      // stehen die Kaesten ebenfalls frei.
      const profW = S.layers.profil ? Math.min(pw*0.19, 74) + 8 : 6;
      const bw2=Math.max(w1,w2)+10;
      // Dicht liegende Kaesten nach unten ausweichen lassen, sonst
      // ueberdeckt der eine den anderen und beide sind unlesbar.
      let byB = yy, bx = profW, guard = 0;
      while(usedBox.some(u=>Math.abs(u.y-byB)<25 && Math.abs(u.x-bx)<bw2+6) && guard++<2){
        byB += 25;
      }
      // Mehr als zwei Schritte Versatz waeren kein Ausweichen mehr,
      // sondern ein Kasten ohne erkennbaren Bezug - dann lieber keiner.
      // Die Preisskala rechts zeigt das Level ohnehin.
      // Der Chart laeuft absichtlich unter der Chrome weiter - ein
      // Beschriftungskasten dort waere aber unlesbar.
      const safeTop = (S.immersive ? topPad : CHROME) + 18;
      const fits = guard <= 2
        && byB > safeTop && byB < topPad + ph - 6
        && bx + bw2 < pw - 30;
      if(fits) usedBox.push({y:byB, x:bx});
      if(fits){
        // Verbinder, wenn der Kasten ausgewichen ist
        if(Math.abs(byB-yy) > 1){
          ctx.strokeStyle=c; ctx.globalAlpha=.4; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(bx+bw2/2, yy); ctx.lineTo(bx+bw2/2, byB-14); ctx.stroke();
          ctx.globalAlpha=1;
        }
        ctx.fillStyle=V("--ink"); ctx.globalAlpha=.93;
        ctx.fillRect(bx, byB-14, bw2, 12);
        ctx.fillStyle=c; ctx.fillRect(bx, byB-2, bw2, 12);
        ctx.globalAlpha=1;
        ctx.fillStyle=V("--ground"); ctx.textAlign="left";
        ctx.font="7.5px "+V("--mono"); ctx.fillText(l.lab, bx+5, byB-5);
        ctx.font="600 9px "+V("--mono"); ctx.fillText(px(l.p), bx+5, byB+7);
      }
    }
  });

  // Level ausserhalb des Fensters als Randmarke. Die Skala dafuer
  // aufzuziehen wuerde die Kerzen zu einem Strich stauchen - die Marke
  // sagt dasselbe und kostet keinen Platz.
  //
  // Auch in der weiten Ansicht. Frueher war sie dort abgeschaltet, weil
  // "alles zeigen" ja alles ins Bild holte; seit auch diese Ansicht eine
  // Grenze hat, kann etwas ausserhalb liegen - und dann soll es genannt
  // werden.
  {
    const off = lv.filter(l=>l.badge && (l.p > hi || l.p < lo));
    const above = off.filter(l=>l.p > hi).sort((a,b)=>a.p-b.p).slice(0,3);
    const below = off.filter(l=>l.p < lo).sort((a,b)=>b.p-a.p).slice(0,3);
    ctx.font="9px "+V("--mono");
    [[above,1],[below,-1]].forEach(([list,dir])=>{
      list.forEach((l,i)=>{
        const c=V(l.c);
        const yy = dir>0 ? topPad+7+i*13 : topPad+ph-7-i*13;
        const txt = (dir>0?"▲ ":"▼ ")+px(l.p);
        const w = textW(ctx, txt)+9;
        ctx.globalAlpha=.92; ctx.fillStyle=c;
        ctx.fillRect(pw-w-3, yy-6, w, 12);
        ctx.globalAlpha=1; ctx.fillStyle=V("--ground"); ctx.textAlign="left";
        ctx.fillText(txt, pw-w+1, yy+3);
        if(l.lab){
          ctx.fillStyle=c; ctx.globalAlpha=.75; ctx.textAlign="right";
          ctx.fillText(l.lab, pw-w-7, yy+3); ctx.globalAlpha=1;
        }
      });
    });
    ctx.textAlign="left";
  }

  if(S.data.spot){
    const yy=y(S.data.spot);
    if(yy>=topPad&&yy<=topPad+ph){
      ctx.strokeStyle=V("--ink"); ctx.globalAlpha=.45; ctx.setLineDash([4,3]);
      const sy=snap(yy)+half();
      ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(pw,sy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      ctx.fillStyle=V("--ink"); ctx.fillRect(pw+2,yy-7.5,PAD.r-4,15);
      ctx.fillStyle=V("--ground"); ctx.font="700 10px "+V("--mono"); ctx.textAlign="left";
      ctx.fillText(px(S.data.spot), pw+5, yy+3);
    }
  }
  // Ein Schild fuer die alte Sitzung.
  //
  // Die Statuszeile sagt zwar "BOERSE ZU", aber sie sagt nicht, WELCHEN
  // Tag man vor sich hat - und ein Minutenchart sieht immer aus wie
  // jetzt. Solange die letzten Balken nicht von heute sind, steht es
  // deshalb im Bild: welcher Tag, und wann es weitergeht.
  //
  // Es erscheint nur dann. Waehrend der Sitzung waere es ein Schild, das
  // etwas Selbstverstaendliches behauptet, und damit nur im Weg.
  if(nichtHeuteOben && alle.length){
    const letzte = new Date(alle[alle.length-1].t*1000);
    const c = S.data.clock || {};
    const auf = c.next_ts ? new Date(c.next_ts*1000) : null;
    // Was next_ts bedeutet, haengt davon ab, ob die Boerse offen ist:
    // dann ist es der Schluss, sonst die naechste Eroeffnung. Blind
    // "oeffnet" davorzuschreiben behauptete um 15:30, die Boerse oeffne
    // um 22 Uhr - das ist der Handelsschluss.
    const zeit = auf ? auf.toLocaleDateString("de-DE",{weekday:"short"})
                       + " " + auf.toLocaleTimeString("de-DE",
                         {hour:"2-digit",minute:"2-digit"}) : "";
    const kopf = "Sitzung " + letzte.toLocaleDateString("de-DE",
                   {weekday:"short", day:"2-digit", month:"2-digit"});
    // Der Nachsatz in zwei Laengen. Das Schild ist mittig und darf nicht
    // ueber die Zeichenflaeche hinauslaufen - auf einem 412 Punkte
    // breiten Telefon schnitt der lange Text rechts ab und endete mit
    // "verzoeger". Passt der lange nicht, kommt der kurze; passt auch
    // der nicht, bleibt der Tag allein - der ist die eigentliche
    // Aussage, alles andere steht ohnehin in der Statuszeile.
    ctx.font = "600 10px "+V("--mono");
    const lang = !auf ? "" : c.open ? " · Börse offen, Kerzen folgen verzögert"
                                    : " · Börse öffnet " + zeit;
    const kurz = !auf ? "" : c.open ? " · Kerzen folgen" : " · öffnet " + zeit;
    const passt = t => textW(ctx, t) + 18 <= pw - 12;
    const txt = passt(kopf + lang) ? kopf + lang
              : passt(kopf + kurz) ? kopf + kurz : kopf;
    const bw3 = textW(ctx, txt) + 18, bx3 = Math.max(6, (pw - bw3)/2);
    // UNTER die Chrome setzen, nicht an den Anfang der Zeichenflaeche.
    //
    // Der Chart laeuft absichtlich unter Kopfzeile und Marktleiste
    // weiter - das ist der gewonnene Platz. Ein Schild dort oben liegt
    // aber hinter den Marktkacheln und war damit genau das, was es nicht
    // sein darf: unlesbar. Die Statuszeile steht bei chrome+6 und ist
    // 18 hoch, also beginnt der freie Streifen bei chrome+28.
    const by3 = (S.immersive ? topPad + 6 : CHROME + 28);
    ctx.fillStyle = V("--panel-2"); ctx.globalAlpha = .93;
    ctx.fillRect(bx3, by3, bw3, 18);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = V("--line"); ctx.lineWidth = 1;
    ctx.strokeRect(snap(bx3)+half(), snap(by3)+half(), bw3, 18);
    ctx.fillStyle = V("--ink-dim"); ctx.textAlign = "center";
    ctx.fillText(txt, bx3 + bw3/2, by3 + 12.5);
    ctx.textAlign = "left";
  }

  if(S.cross!=null){
    const i=Math.max(0,Math.min(alle.length-1,Math.round(S.cross)));
    const b=alle[i], x=X(i);
    ctx.strokeStyle=V("--ink-dim"); ctx.globalAlpha=.5; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x,topPad); ctx.lineTo(x,topPad+ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,y(b.c)); ctx.lineTo(pw,y(b.c)); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    $("cross").className="cross on";
    $("cross").innerHTML = `${new Date(b.t*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}<br>`+
      `O ${px(b.o)}&nbsp; H ${px(b.h)}<br>L ${px(b.l)}&nbsp; C ${px(b.c)}`;
  } else $("cross").className="cross";

  // Vignette: nimmt den Raendern Gewicht, damit die Mitte traegt
  ctx.drawImage(HG.vig, 0, 0, W, H);

  ctx.fillStyle=V("--ink-faint"); ctx.font="9px "+V("--mono");
  const st=Math.max(1,Math.round(sp/4));
  // Die zuletzt beschriftete Stelle, damit sich zwei Marken nicht
  // ueberschreiben. Mit Datum sind die Beschriftungen fast doppelt so
  // breit wie vorher, und am linken Rand wurde eine davon in den
  // Ausschnitt hineingeklemmt - zwei Texte an derselben Stelle,
  // "10.0910.09. 21:51", und keiner mehr lesbar.
  let letztesX = -1e9;
  // Beschriftung nach der tatsaechlichen Spanne, nicht nach dem Namen der
  // Zeitebene. Vorher entschied allein S.tf==="1d" ueber Datum oder
  // Uhrzeit - bei 573 Viertelstundenkerzen ueber sechs Tage stand damit
  // nur die Tageszeit da und die Achse las sich rueckwaerts:
  // 15:45, 13:30, 17:45, 15:30. Richtige Zeitpunkte, aber an
  // verschiedenen Tagen, und ohne Datum nicht zu unterscheiden.
  const spanD = bars.length > 1
    ? (bars[bars.length-1].t - bars[0].t) / 86400 : 0;
  const dOpt = {day:"2-digit", month:"2-digit"};
  // Und das Datum IMMER dann, wenn die Balken nicht von heute sind.
  //
  // Die Spanne allein reichte nicht. Eine US-Sitzung dauert sechseinhalb
  // Stunden, liegt also weit unter jeder Tagesschwelle - die Achse zeigte
  // reine Uhrzeiten. Solange die Boerse zu ist, ist das aber die Sitzung
  // von GESTERN, und "21:56" liest sich dann wie heute Abend. Um 13:13
  // mittags stand damit eine Uhrzeit auf der Achse, die noch gar nicht
  // stattgefunden hat.
  //
  // Gerechnet wird im Kalendertag des Telefons, nicht in UTC: es geht
  // darum, was der Leser "heute" nennt. Der Wert steht schon oben, weil
  // auch das Sitzungsschild ihn braucht.
  const nichtHeute = nichtHeuteOben;
  // Ueber ein Jahr hinaus braucht es das Jahr. Auf der Tagesebene lief
  // die Achse ueber zwei Jahre und zeigte "10.09. · 12.03. · 10.09." -
  // zwei verschiedene Septembertage, nicht zu unterscheiden.
  const yOpt = {month:"2-digit", year:"2-digit"};
  // Die Schwelle zum reinen Datum liegt bei zehn Tagen, nicht bei
  // fuenf: bei knapp ueber fuenf Tagen fielen zwei der fuenf Marken auf
  // denselben Kalendertag und die Achse las sich "08.09. · 08.09.".
  // Solange die Uhrzeit die Marken noch trennt, gehoert sie dazu.
  // Vielfache von st im ABSOLUTEN Index. Vorher zaehlte die Schleife vom
  // Anfang des Ausschnitts, und der wandert beim Schieben - die
  // Beschriftung sprang mit jedem hereinlaufenden Balken auf andere
  // Zeitpunkte um. So bleibt eine Marke an ihrem Balken kleben.
  for(let i=Math.ceil(iL/st)*st; i<=iR; i+=st){
    const d=new Date(alle[i].t*1000);
    const lab = spanD > 300
      ? d.toLocaleDateString("de-DE", yOpt)
      : (S.tf==="1d" || spanD > 10)
      ? d.toLocaleDateString("de-DE", dOpt)
      : (spanD > 1.2 || nichtHeute)
        ? d.toLocaleDateString("de-DE", dOpt)+" "
          + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
        : d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    const lw = textW(ctx, lab);
    let x=X(i); ctx.textAlign="center";
    // Nicht mehr in den Ausschnitt hineinklemmen. Eine Marke, die aus
    // dem Bild laeuft, gehoert weggelassen - hineingeschoben steht sie
    // ueber dem falschen Balken und behauptet eine Zeit, die dort nicht
    // gilt.
    if(x - lw/2 < 1 || x + lw/2 > pw - 1) continue;
    if(x - lw/2 < letztesX + 8) continue;
    letztesX = x + lw/2;
    ctx.fillText(lab, x, H-PAD.b+13);
  }
  ctx.textAlign="left";
}

// ======================= Gesten =======================
/* ── Massstab und Lage ─────────────────────────────────────────────────

   Drei Dinge lassen sich verstellen, und jedes hat seine Geste:

     waagerecht wischen      Zeit schieben
     senkrecht wischen       Preis schieben
     zwei Finger             zoomen, waagerecht Zeit, senkrecht Preis
     an der Achse ziehen     Preisskala dehnen und stauchen

   Der senkrechte Anteil war vorher gar nicht vorhanden: die Skala rechnete
   sich in jedem Bild neu aus den Kerzen aus, also gab es nichts zu
   verstellen. Wer daran zog, zog ins Leere. Jetzt merkt sich S.vs ein
   Fenster, sobald jemand es anfasst - und AUTO gibt es wieder her. */

/** Liegt der Finger auf der Preisachse? Die Trefferflaeche ist etwas
    breiter als die Achse selbst; 56 Bildpunkte sind auf einem Telefon
    knapp vier Millimeter und ein Daumen ist breiter. */
function anAchse(clientX){
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) > (W - PAD.r - 12);
}
/** Der Balkenindex unter einem Bildschirmpunkt, als Bruch. */
function iBeiX(clientX){
  const r = cv.getBoundingClientRect();
  const sp = Math.max(1e-6, span());
  return (S.vw?.i0 || 0) + ((clientX - r.left) / ((W - PAD.r) / sp)) - 0.5;
}
/** Das gerade geltende Preisfenster - von Hand gesetztes oder das, was
    die Automatik im letzten Bild ergeben hat. */
function skalaJetzt(){
  const q = S.vs || S.autoScale;
  return q && q.hi > q.lo ? {lo:q.lo, hi:q.hi} : null;
}
/** Preisfenster setzen, mit Grenzen.

    Ohne Grenzen laesst sich der Chart in einer einzigen Wischbewegung so
    weit verstellen, dass gar nichts mehr im Bild ist - und dann sieht er
    kaputt aus, nicht verstellt. Bezug ist die Spanne, die die Automatik
    ergeben haette: hoechstens das Achtfache davon, mindestens ein
    Achtel, und die Mitte hoechstens fuenf Spannen vom Kurs weg.

    War vorher das 25-fache. Ein Zusammenziehen der Finger reicht, um
    diese Grenze zu erreichen, und bei ~140 Punkten normaler Spanne
    ergab das 25-fache 3.500 Punkte - jede Kerze darin unter einem
    Bildpunkt gequetscht und faktisch weg, nur die Wandketten blieben
    stehen. Ein Bild ohne eine einzige sichtbare Kerze sieht nicht nach
    "weit herausgezoomt" aus, es sieht nach kaputt aus. Das Achtfache
    zeigt entfernte Waende immer noch, laesst der Kursbewegung selbst
    aber ihren Platz. */
function setzeSkala(lo, hi){
  if(!(hi > lo) || !isFinite(lo) || !isFinite(hi)) return;
  const a = S.autoScale;
  if(a && a.hi > a.lo){
    const aR = a.hi - a.lo, aM = (a.hi + a.lo) / 2;
    let r = Math.max(aR/8, Math.min(aR*8, hi - lo));
    let m = (hi + lo) / 2;
    m = Math.max(aM - aR*5, Math.min(aM + aR*5, m));
    lo = m - r/2; hi = m + r/2;
  }
  S.vs = {lo, hi};
}

let drag=null,pinch=null,press=null,tuckTimer=null;
const wrap=$("cvwrap");

/** Marktleiste beim Arbeiten im Chart wegklappen - dieselbe Mechanik,
    mit der Feed-Apps beim Scrollen Platz schaffen.

    Sie kommt NICHT von selbst zurueck. Vorher tat sie das nach 1,3
    Sekunden, und das war das Schlechteste aus beiden Welten: waehrend
    der Geste sah man sie nicht, und kaum hatte man den Finger gehoben,
    schob sie sich wieder ueber den Chart - der Platz war nie wirklich
    da. Jetzt bleibt sie weg, bis man sie holt.

    Damit sie holbar bleibt, tritt ein schmaler Griff an ihre Stelle.
    Eine Flaeche, die verschwindet, ohne eine Spur zu hinterlassen, ist
    verloren; ein Griff kostet vier Bildpunkte und sagt, dass da noch
    etwas ist. */
function tuck(on){
  const st=$("strip");
  if(!st || st.classList.contains("tucked")===!!on) return;
  clearTimeout(tuckTimer);
  st.classList.toggle("tucked", !!on);
  $("striphandle").hidden = !on;
  // Erst jetzt aendert sich die nutzbare Hoehe wirklich.
  requestAnimationFrame(()=>{ measureChrome(); draw(); });
}
wrap.addEventListener("touchstart",e=>{
  tuck(true);
  if(e.touches.length===1){
    const t=e.touches[0], cx=t.clientX, cy=t.clientY;
    const sc=skalaJetzt(), achse=anAchse(cx);
    // Die Spanne wird HIER festgehalten.
    //
    // Vorher las das Schieben sie waehrend der Bewegung neu - und zwar
    // nachdem i0 schon verschoben war. Damit blieb i1 stehen und nur die
    // linke Kante lief mit: aus dem Schieben wurde ein Dehnen. Das war
    // der eigentliche Grund, warum sich der Chart nicht bewegen liess.
    drag={x:cx, y:cy, i0:S.vw?.i0||0, sp:span(), achse:achse,
          lo:sc?sc.lo:0, hi:sc?sc.hi:0, t:Date.now(), moved:false};
    // Eingefroren wird NICHT schon hier, sondern bei der ersten
    // wirklichen Bewegung - siehe touchmove.
    //
    // Vorher fror ein blosses Antippen die Skala sofort ein - auch der
    // Beginn jedes langen Druecks fuers Fadenkreuz, auch ein Verwackler
    // beim Scrollen einer anderen Leiste. Sichtbar aenderte sich dabei
    // nichts, denn eingefroren wurde genau der Stand, der schon zu
    // sehen war - aber von da an folgte die Skala dem Kurs nicht mehr,
    // ohne dass der Nutzer etwas dafuer getan hatte. Erst eine Geste,
    // die tatsaechlich etwas verschiebt, verdient das Einfrieren.
    if(!achse) press=setTimeout(()=>{ // langes Drücken blendet das Fadenkreuz ein
      S.cross=iBeiX(cx); buzz(8); paint();
    },380);
  } else if(e.touches.length===2){
    clearTimeout(press);
    const a=e.touches[0], b=e.touches[1], sc=skalaJetzt();
    pinch={dx:Math.abs(a.clientX-b.clientX), dy:Math.abs(a.clientY-b.clientY),
           sp:span(), i0:S.vw?.i0||0,
           mx:(a.clientX+b.clientX)/2, my:(a.clientY+b.clientY)/2,
           lo:sc?sc.lo:0, hi:sc?sc.hi:0};
    // Eingefroren wird erst, wenn die Geste tatsaechlich zoomt - siehe
    // touchmove und die Begruendung bei touchstart oben.
    drag=null;
  }
},{passive:true});
wrap.addEventListener("touchmove",e=>{
  if(!S.vw) return;
  const n=(S.data?.bars||[]).length, r=cv.getBoundingClientRect();
  if(pinch&&e.touches.length===2){
    clearTimeout(press);
    const a=e.touches[0], b=e.touches[1];
    const dx=Math.abs(a.clientX-b.clientX), dy=Math.abs(a.clientY-b.clientY);
    // Jede Achse nur dann, wenn die Finger in ihrer Richtung ueberhaupt
    // auseinanderstehen. Bei einem waagerechten Griff ist der senkrechte
    // Abstand ein paar Bildpunkte Zittern - daraus einen Zoomfaktor zu
    // rechnen hiesse, die Preisskala bei jeder Zeitgeste mitzureissen.
    if(!S.vs && pinch.hi>pinch.lo && (Math.abs(dx-pinch.dx)>10 || Math.abs(dy-pinch.dy)>10))
      S.vs = {lo:pinch.lo, hi:pinch.hi};
    if(pinch.dx>24 && dx>24){
      const sp2=Math.max(10,Math.min(n,pinch.sp*(pinch.dx/dx)));
      // Um den Mittelpunkt der Geste, nicht um die Bildmitte: der Punkt
      // zwischen den Fingern soll unter ihnen stehen bleiben.
      const f=Math.max(0,Math.min(1,(pinch.mx-r.left)/Math.max(1,W-PAD.r)));
      const anker=pinch.i0+f*pinch.sp;
      S.vw={i0:anker-f*sp2, i1:anker-f*sp2+sp2}; clampView();
    }
    if(pinch.dy>24 && dy>24 && pinch.hi>pinch.lo && S.geo){
      const g=S.geo;
      const f=Math.max(0,Math.min(1,(pinch.my-r.top-g.topPad)/Math.max(1,g.ph)));
      const ankerP=pinch.hi-f*(pinch.hi-pinch.lo);
      const R=(pinch.hi-pinch.lo)*(pinch.dy/dy);
      setzeSkala(ankerP-(1-f)*R, ankerP+f*R);
    }
    paint();
  } else if(drag&&e.touches.length===1){
    const t=e.touches[0];
    const dx=t.clientX-drag.x, dy=t.clientY-drag.y;
    // Drei Bildpunkte statt sechs. Sechs waren auf einem 3x-Bildschirm
    // fast zwei Millimeter tote Zone am Anfang jeder Geste, und genau
    // dieser Anfang entscheidet, ob sich etwas fluessig anfuehlt.
    if(!drag.moved && Math.abs(dx)+Math.abs(dy)>3){
      clearTimeout(press); drag.moved=true;
      // Jetzt erst einfrieren - siehe touchstart. Genau der Stand, der
      // in diesem Moment zu sehen ist, damit es beim Loslegen keinen
      // Sprung gibt.
      if(!S.vs && drag.hi>drag.lo) S.vs = {lo:drag.lo, hi:drag.hi};
    }
    if(S.cross!=null){ S.cross=iBeiX(t.clientX); paint(); return; }
    if(!drag.moved) return;
    if(drag.achse){
      // An der Achse ziehen dehnt und staucht das Preisfenster um seine
      // Mitte. Nach unten heisst mehr Preis im Bild, nach oben weniger -
      // dieselbe Richtung wie in jeder Chartsoftware.
      if(drag.hi>drag.lo){
        const c=(drag.lo+drag.hi)/2, hR=(drag.hi-drag.lo)/2;
        const k=Math.exp(dy/230);
        setzeSkala(c-hR*k, c+hR*k);
      }
    } else {
      // Zeit waagerecht. drag.sp ist die Spanne vom Anfang der Geste -
      // siehe oben, warum sie nicht unterwegs gelesen werden darf.
      const per=(W-PAD.r)/Math.max(1,drag.sp);
      S.vw={i0:drag.i0-dx/per, i1:drag.i0-dx/per+drag.sp}; clampView();
      // Preis senkrecht. Erst ab vier Bildpunkten, damit ein waagerechter
      // Wisch nicht bei jedem Zittern die Skala von der Automatik loest.
      if(Math.abs(dy)>4 && drag.hi>drag.lo && S.geo){
        const d=(drag.hi-drag.lo)*(dy/Math.max(1,S.geo.ph));
        setzeSkala(drag.lo+d, drag.hi+d);
      }
    }
    paint();
  }
},{passive:true});
/** Der letzte kurze Tipp - fuer die Doppeltipp-Erkennung unten. */
let letzterTipp = {t:0, x:0, y:0};
wrap.addEventListener("touchend",e=>{
  clearTimeout(press);
  if(S.cross!=null){ S.cross=null; paint(); }
  const t=e.changedTouches && e.changedTouches[0];
  let zurueckgesetzt = false;
  // Kurzes Tippen auf AUTO gibt die Skala an die Automatik zurueck.
  const b=S.autoBtn;
  if(b && t && drag && !drag.moved){
    const r=cv.getBoundingClientRect();
    const x=t.clientX-r.left, yy=t.clientY-r.top;
    if(x>=b.x-4 && x<=b.x+b.w+4 && yy>=b.y-6 && yy<=b.y+b.h+6){
      // ALLES zurueck: Skala, Ausschnitt und die weite Ansicht.
      //
      // Die weite Ansicht fehlte hier, und das war der Grund, warum der
      // Weg zurueck nicht funktionierte: wer den Zoom-Knopf gedrueckt
      // hatte, kam mit AUTO nicht wieder heraus, weil AUTO nur S.vs
      // loeschte - und S.fitAll rechnet an S.vs vorbei.
      S.vs=null; S.fitAll=false; fitView(); renderTf(); buzz(8); paint();
      zurueckgesetzt = true;
    }
  }
  // Doppeltipp irgendwo auf dem Chart tut dasselbe - die Geste, die man
  // aus praktisch jeder Chart-App kennt, und griffbereiter als der
  // kleine AUTO-Schalter, wenn die Skala gerade weit draussen steht und
  // der Schalter selbst kaum noch zu treffen ist.
  if(!zurueckgesetzt && t && drag && !drag.moved){
    const jetzt = Date.now();
    const dx = t.clientX-letzterTipp.x, dy = t.clientY-letzterTipp.y;
    if(jetzt-letzterTipp.t < 320 && Math.abs(dx)<30 && Math.abs(dy)<30){
      S.vs=null; S.fitAll=false; fitView(); renderTf(); buzz(10); paint();
      letzterTipp.t = 0;                     // verbraucht, kein Zaehler fuer einen dritten Tipp
    } else {
      letzterTipp = {t:jetzt, x:t.clientX, y:t.clientY};
    }
  }
  drag=null; pinch=null;
},{passive:true});
wrap.addEventListener("wheel",e=>{
  if(!S.vw) return; e.preventDefault();
  // Ueber der Achse zoomt das Rad den Preis, sonst die Zeit. Am
  // Schreibtisch ist das die einzige Entsprechung zur Zwei-Finger-Geste.
  if(anAchse(e.clientX)){
    const sc=skalaJetzt(); if(!sc) return;
    const c=(sc.lo+sc.hi)/2, hR=(sc.hi-sc.lo)/2, k=e.deltaY>0?1.12:0.89;
    setzeSkala(c-hR*k, c+hR*k); paint(); return;
  }
  const sc0=skalaJetzt();
  if(!S.vs && sc0) S.vs = {lo:sc0.lo, hi:sc0.hi};   // Skala stillstellen
  const n=(S.data.bars||[]).length;
  const sp=Math.max(10,Math.min(n,span()*(e.deltaY>0?1.15:.87))), mid=S.vw.i0+span()/2;
  S.vw={i0:mid-sp/2,i1:mid+sp/2}; clampView(); paint();
},{passive:false});

// ======================= Rendern =======================
function render(){
  const d=S.data; if(!d) return;
  $("sym").textContent = d.space?.name || SYM[S.market] || S.market;
  // Sichtbarer Unterschied zwischen live und verzoegert. Ein Chart, der
  // aussieht wie ein Kurs und eine Viertelstunde alt ist, ist
  // gefaehrlicher als einer, der sich als alt zu erkennen gibt.
  const lage = kursLage(d);
  const lv = $("livedot");
  if(lv){
    lv.className = "livedot " + (lage.k==="live" ? "on" : lage.k==="zu" ? "shut" : "off");
    lv.title = lage.k==="live"
      ? `Live aus ${esc(d.live.symbol||"der Brücke")}`
        + (d.live.src==="oanda" ? " (OANDA, nicht dein Broker)" : " (deine Brücke)")
        + ` · Tick vor ${Math.round(d.live.tick_age||0)} s`
      : lage.t + (d.live?.reason ? " — "+esc(d.live.reason) : "");
  }
  tickTo($("spot"), d.spot);
  const ov = S.overview.find(o=>o.key===S.market);
  const ch = $("chg");
  if(ov && ov.change!=null){
    ch.textContent = `${sgn(ov.change)}  ${ov.change_pct>=0?"+":""}${ov.change_pct.toFixed(2)}%`;
    ch.className = "chg tnum "+(ov.change>=0?"up":"dn");
  } else { ch.textContent=d.market_name||""; ch.className="chg tnum"; }
  const rg=$("regime"); rg.className="rg "+(d.regime||"");
  rg.querySelector("span").textContent =
    d.regime==="long"?"LONG γ" : d.regime==="short"?"SHORT γ" : "—";
  const stale = d.chain_stale || d.bar_source?.stale;
  $("meta").innerHTML =
    `${d.space?.name ? d.space.name+" "+sgn(Math.round(d.space.offset))
        +(d.space.stale?" ⚠":"")+" · " : ""}`+
    `${lage.t} · ${d.bar_source?.source==="cboe"?"Cboe"
        : d.bar_source?.source==="bridge"?"Brücke":"Yahoo"}`+
    `${stale?" · STALE":""} · ATR ${fmt(d.atr)} · `+
    `${d.bars.length} Kerzen${S.layers.profil && d.vp?.basis
      ? " · "+({cme:"CME-Volumen", etf:"Stückvolumen", options:"Optionsfluss", time:"Zeit je Preis"}[d.vp.basis] || d.vp.basis)
        + (d.vp.source ? " ("+esc(d.vp.source)+")" : "")
        + (S.layers.tpo && d.tpo?.brackets ? " + TPO "+d.tpo.brackets+"×"+d.tpo.bracket_min+"min" : "")
      : ""}${S.trails?.tracks?.length && S.layers.orbs
      ? " · "+S.trails.tracks.length+" Spuren" : ""} · ${hhmm(d.ts)}`;
  renderTf(); renderStrip(); renderLevel(); renderGamma(); paint();
}

/** In welchem Zustand ist der Kurs, und warum.

    Es gibt drei davon, und sie zu verwechseln ist der teuerste Fehler,
    den diese App machen kann:

      LIVE       die Bruecke liefert Ticks vom Broker
      VERZOEGERT die Boerse laeuft, Cboe liefert mit 15 Minuten Abstand
      ZU         die Boerse ist geschlossen, der Kurs KANN nicht laufen

    Der dritte Fall sah bisher aus wie der zweite, nur kaputt: der Chart
    stand still und nichts sagte, warum. Um halb eins deutscher Zeit ist
    aber schlicht noch nicht geoeffnet - die US-Sitzung beginnt um 15:30.

    Der Feiertag ist der Grund, warum hier nicht allein der Kalender
    zaehlt: den kennt der Server nicht. Bleibt ein Balken bei angeblich
    offener Boerse aelter als eine halbe Stunde, sagt die Zeile das und
    behauptet nichts. */
function kursLage(d){
  const c = d.clock || {};
  const alt = d.bar_age;
  if(d.live?.live){
    // Welcher Weg traegt gerade. Der eigene Broker und ein fremder CFD
    // sind beide live, aber nicht dasselbe: der eine ist der Kurs, zu
    // dem gehandelt wird, der andere eine sehr nahe Naeherung. Wer das
    // nicht unterscheiden kann, haelt eine Naeherung fuer seinen Kurs.
    // Drei Wege, und der Unterschied gehoert benannt: Bruecke und
    // cTrader liefern den Kurs des EIGENEN Brokers, OANDA den eines
    // fremden. Wer das nicht unterscheiden kann, haelt eine Naeherung
    // fuer seinen Kurs.
    const woher = {oanda:"LIVE · OANDA", ctrader:"LIVE · cTrader"};
    return {k:"live", t: woher[d.live.src] || "LIVE"};
  }
  if(c.open === false){
    const bis = c.next_ts ? new Date(c.next_ts*1000) : null;
    const std = bis ? (c.next_ts*1000 - Date.now())/3600000 : null;
    const wann = !bis ? "" : std != null && std < 14
      ? " · öffnet "+bis.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
      : " · öffnet "+bis.toLocaleDateString("de-DE",{weekday:"short"})
        +" "+bis.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    return {k:"zu", t:"BÖRSE ZU"+wann};
  }
  // Fehlende frische Balken sind kurz nach der Eroeffnung KEIN Befund.
  //
  // Cboe liefert mit einer Viertelstunde Abstand, also gibt es um Punkt
  // 15:30 zwangslaeufig noch keinen Balken von heute - der juengste ist
  // der von gestern Abend. Gemeldet wurde daraufhin "keine frischen
  // Kurse seit 1065 min", und das las sich wie ein Ausfall, waehrend
  // alles seinen Gang ging.
  //
  // Gemessen wird deshalb gegen die Zeit SEIT der Eroeffnung, nicht
  // gegen das Alter des Balkens. Erst wenn die Sitzung laenger laeuft
  // als Verzoegerung plus zehn Minuten Luft und trotzdem nichts kommt,
  // ist es einer - dann meist ein Feiertag, den der Kalender nicht kennt.
  const vz = (d.delayed_minutes || c.delay_min || 15);
  const seit = c.since_open;
  if(c.open === true){
    if(seit != null && seit < (vz + 10) * 60 && alt != null && alt > 1800)
      return {k:"delay", t:"Börse offen · erste Kurse "+vz+" min verzögert"};
    if(alt != null && alt > (vz + 25) * 60)
      return {k:"zu", t:"keine frischen Kurse seit "+Math.round(alt/60)+" min"};
  }
  return {k:"delay", t:vz+" min verzögert"};
}

function renderTf(){
  $("tfbar").innerHTML =
    `<div class="tfscroll">`
    + TFS.map(t=>`<button class="tfc ${t===S.tf?"on":""}" data-t="${t}">${t}</button>`).join("")
    + `</div><div class="tficons">`
    + `<button class="tfc icon" id="btnFull" aria-label="Vollbild">${S.immersive?"◱":"◰"}</button>`
    + `<button class="tfc icon" id="btnLayers" aria-label="Struktur">☰</button>`
    + `<button class="tfc icon ${S.fitAll?"on":""}" id="btnFit"`
    + ` aria-label="${S.fitAll?"weite Ansicht aus":"weite Ansicht"}"`
    + ` aria-pressed="${S.fitAll?"true":"false"}">${S.fitAll?"⤡":"⤢"}</button>`
    + `</div>`;
  $("tfbar").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(b.dataset.t === S.tf) return;
    S.tf=b.dataset.t; S.view0=false; S.vs=null; buzz(8);
    renderTf();                      // der Knopf faerbt sich sofort
    // Kerzen zuerst - sie sind das, worauf man wartet. Der volle Stand
    // kommt hinterher und ersetzt sie klaglos, wenn er da ist.
    ladeKerzen().then(()=>load());
  });
  // Der Zoomschalter rechnet die Skala neu aus - eine von Hand gesetzte
  // wuerde ihn stumm verschlucken.
  // Die gewaehlte Zeitebene ins Sichtfeld holen. Die Leiste scrollt
  // waagerecht, und "1d" steht ganz rechts - nach dem Antippen war der
  // aktive Knopf aus dem Bild geschoben und die Leiste sah aus, als sei
  // gar nichts gewaehlt.
  const anKnopf = $("tfbar").querySelector(".tfc.on");
  if(anKnopf && anKnopf.scrollIntoView)
    anKnopf.scrollIntoView({block:"nearest", inline:"nearest"});
  $("btnFit").onclick=()=>{ S.fitAll=!S.fitAll; S.vs=null; buzz(8); renderTf(); paint(); };
  $("btnFull").onclick=()=>{
    S.immersive=!S.immersive;
    document.body.classList.toggle("immersive", S.immersive);
    buzz(10); renderTf(); setTimeout(()=>{ resize(); }, 260);
  };
  $("btnLayers").onclick=layerSheet;
}

function renderStrip(){
  const el=$("striprow");
  let src = S.overview.length ? S.overview
    : Object.keys(SYM).map(k=>({key:k,name:k,spot:null,change_pct:null}));
  // Eingeklappt passen drei Werte in die Zeile, der Rest wird gescrollt.
  // Der aktive Markt gehoert deshalb nach vorn - sonst kann ausgerechnet
  // der, auf den der Chart laeuft, ausserhalb des Sichtbaren liegen.
  if(!$("strip").classList.contains("full"))
    src = [...src].sort((a,b)=> (b.key===S.market) - (a.key===S.market));
  el.innerHTML = src.map(m=>`
    <button class="mchip ${m.key===S.market?"on":""} ${
      m.change_pct==null?"":(m.change_pct>=0?"up":"dn")}" data-m="${m.key}">
      <div class="k">${m.key===S.market && S.data?.space?.name
        ? esc(S.data.space.name) : (SYM[m.key]||m.key)}</div>
      <div class="p tnum">${(m.key===S.market?px:fmt)(m.spot, m.spot&&m.spot<1000?1:0)}</div>
      <div class="c tnum ${m.change_pct==null?"":(m.change_pct>=0?"up":"dn")}">${
        m.change_pct==null?"—":(m.change_pct>=0?"+":"")+m.change_pct.toFixed(2)+"%"}</div>
    </button>`).join("");
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>switchMarket(b.dataset.m));
  // Erst jetzt steht die Leiste - vorher gemessen waere sie leer und der
  // Chart begaenne unter der Kopfzeile statt darunter.
  measureChrome(); draw();
}

/** Auf- und zuklappen. Der Zustand ueberlebt das Neuladen, weil er eine
    Gewohnheit ist und keine Entscheidung, die man taeglich neu trifft. */
function setStrip(open){
  const el = $("strip");
  el.classList.toggle("full", open);
  el.classList.toggle("slim", !open);
  try{ localStorage.setItem("stripOpen", open ? "1" : "0"); }catch(e){}
  renderStrip();     // die Reihenfolge haengt am Zustand
  // Die Leiste aendert ihre Hoehe, also muss der Chart neu vermessen
  // werden - sonst zeichnet er unter oder ueber seinen Rahmen hinaus.
  requestAnimationFrame(()=>{ measureChrome(); draw(); });
}
$("striphandle").onclick = () => { tuck(false); buzz(6); };

$("stripx").onclick = () => {
  setStrip(!$("strip").classList.contains("full"));
  buzz(6);
};
try{ setStrip(localStorage.getItem("stripOpen") === "1"); }catch(e){}

function switchMarket(k){
  if(k===S.market) return;
  S.market=k; S.plan=null; S.data=null; S.view0=false; S.lastMsgCount=0; S.trails=null;
  S.vs=null; S.cross=null; S.laedt=true; S.ladeFehler=null;
  buzz(10); closeSheet();
  ["p-level","p-gamma","p-agent","p-plan"].forEach(id=>$(id).innerHTML='<div class="skel"><i></i><i></i><i></i></div>');
  ladeKerzen().then(()=>load());   // Kerzen zuerst, siehe unten beim Start
  loadMessages(); loadPlan(); loadTrails();
}

function renderLevel(){
  const d=S.data, el=$("p-level");
  const fx=d.fixed||{}, lv=mergedFixed();
  const anchor=fx.anchor||{};
/** Wie nah kam der Kurs heute? Erst das macht "ungetestet" zur Aussage.

    Ohne diese Zeile sehen zwei Level gleich aus, die nichts miteinander
    zu tun haben: eines, das der Kurs um ein Drittel einer Kerze verfehlt
    hat, und eines, das zwanzig Kerzen entfernt steht. Gemessen an einem
    echten Handelstag: die Call-Wand wurde um 25 Punkte verfehlt, die
    Put-Wand daneben stand 1.500 Punkte weg - beide meldeten
    "ungetestet".

    Der Abstand in ATR ist der eigentliche Wert. 25 Punkte sind beim
    Nasdaq ein Drittel einer Kerze, beim Dow das Fuenfundzwanzigfache. */
function nearTag(l){
  if(l.near == null) return "";
  if(l.near <= 0.5) return `<div class="near hit">heute berührt</div>`;
  const a = l.near_atr;
  const stufe = a == null ? "" : a < 0.5 ? "hot" : a < 2 ? "warm" : "cold";
  return `<div class="near ${stufe}">nächste Annäherung heute:
    <b>${fmt(l.near)} Punkte</b>${a!=null?` · ${a.toFixed(2)} ATR`:""}${
    a!=null && a<0.5 ? " — knapp verfehlt" : a!=null && a>=4 ? " — weit weg" : ""}</div>`;
}

  const stateTag = s => s==="held"?'<span class="tag held">gehalten</span>'
    : s==="broken"?'<span class="tag broken">gebrochen</span>'
    : s==="tested"?'<span class="tag tested">im Test</span>'
    : '<span class="tag">ungetestet</span>';
  const col = p => p>d.spot*1.0015?"var(--resist)":p<d.spot*0.9985?"var(--support)":"var(--pivot)";
  const kcol = k => `var(${levelColor(k)})`;

  let h = `<div class="sec">Fixe Level · eingefroren ${hhmm(anchor.ts)} am ${fx.anchor_hour}:00-Anker</div>`;
  h += lv.length ? lv.map(l=>`
    <div class="card role" style="--c:${kcol(l.kind)}">
      <div class="ch">
        <b>${px(l.price)}</b>${stateTag(l.state)}
        <span class="far">${sgn(l.price-d.spot)}</span>
      </div>
      <div class="cs">${esc(l.labels.join(" · "))}${
        Math.abs(l.drift||0) >= 1 ? ` · läuft aktuell auf ${px(l.live)} <span style="color:var(--warn)">(${sgn(l.drift)})</span>` : " · unverändert"}</div>
      <div class="cm">
        <span>${l.exams_total===0?"nie getestet":l.exams_total+". Prüfung"}</span>
        ${l.exams_held?`<span style="color:var(--support)">${l.exams_held}× gehalten</span>`:""}
        ${l.exams_broken?`<span style="color:var(--warn)">${l.exams_broken}× gebrochen</span>`:""}
        <span>seit ${esc(l.born)}</span>
      </div>
      ${nearTag(l)}
    </div>`).join("")
    : '<div class="empty">Das Buch ist noch leer. Es wird am nächsten Tagesanker gefüllt.</div>';

  // Leading Walls aus allen Ketten des Marktes
  const lw = d.leading_walls || [];
  const conf = d.wall_confluence || [];
  if(conf.length){
    h += `<div class="sec">Konfluenz über Ketten — dieselbe Wand, zwei Quellen</div>`;
    h += conf.slice(0,4).map(z=>`
      <div class="card role" style="--c:${col(z.mid)}">
        <div class="ch"><b>${z.top-z.bot < 2 ? px(z.mid) : px(z.bot)+" – "+px(z.top)}</b>
          <span class="tag">${esc(z.chains.join(" + "))}</span>
          <span class="far">${sgn(z.mid-d.spot)}</span></div>
        <div class="cs">${z.members} Wände auf einem Fleck · ${esc(z.sides.map(x=>x==="call"?"Call":"Put").join(" und "))}</div>
        <div class="cm"><span>${fmtM(z.oi)} Open Interest</span></div>
      </div>`).join("");
  }
  if(lw.length){
    const mx = Math.max(...lw.map(w=>w.oi))||1;
    const byChain = {};
    lw.forEach(w=>{ (byChain[w.chain] = byChain[w.chain]||[]).push(w); });
    h += `<div class="sec">Leading Walls je Kette</div>`;
    Object.entries(byChain).forEach(([chain, ws])=>{
      const grid = ws[0].grid;
      h += `<div class="card"><div class="ch">
        <b style="font-size:13px">${esc(chain)}</b>
        <span class="tag">${esc(ws[0].chain_kind)}</span>
        <span class="far">Raster ${fmt(grid)} Pkt</span></div>`;
      h += ws.map(w=>`<div class="brow">
        <span class="k" style="color:var(--${w.side==="call"?"resist":"support"})">${px(w.price)}</span>
        <span class="bar" style="--c:var(--${w.side==="call"?"resist":"support"})"><i style="width:${(w.oi/mx*100).toFixed(0)}%"></i></span>
        <span class="v">${fmtM(w.oi)}</span></div>`).join("");
      h += `</div>`;
    });
    const r = d.chain_ratios||{};
    const etf = Object.entries(r).find(([k,v])=>v!==1);
    if(etf) h += `<div class="foot">ETF-Strikes sind über das Verhältnis
      ${etf[0]} × ${etf[1].toFixed(3)} in den Index-Preisraum übersetzt — beide Kurse
      zum selben Zeitpunkt aus derselben Quelle, keine Futures-Basis nötig.
      Ein ${esc(etf[0])}-Strike-Schritt entspricht rund ${fmt((lw.find(w=>w.chain===etf[0])||{}).grid||0)}
      Indexpunkten; das ist der Genauigkeitsboden jeder daraus abgeleiteten Marke.</div>`;
  }

  h += `<div class="sec">Konfluenz-Zonen</div>`;
  const zs=d.zones||[];
  h += zs.length ? zs.map(z=>`
    <div class="card role" style="--c:${col(z.mid)}">
      <div class="ch"><b>${z.width<2?px(z.mid):px(z.bot)+" – "+px(z.top)}</b>
        <span class="tag">#${z.rank}</span>
        <span class="far">${sgn(z.mid-d.spot)}</span></div>
      <div class="cs">${esc(z.labels.join(" · "))}</div>
      <div class="cm"><span>${fmt(z.width)} Punkte</span><span>${z.width_atr.toFixed(2)} ATR</span>
        <span>Score ${z.score.toFixed(1)}</span></div>
    </div>`).join("")
    : '<div class="empty">Keine Zone trägt genug Konfluenz — es braucht mindestens zwei verschiedene Quellenarten im selben Band.</div>';

  h += `<div class="foot">Die fixen Level werden einmal am ${fx.anchor_hour}:00-Anker eingefroren und danach nur
    fortgeschrieben. Ohne das wandert jede Wand mit jedem Snapshot — und ein Level, das sich ständig
    verschiebt, lässt sich weder handeln noch messen. Der Prüfungszähler läuft über Tage weiter,
    solange derselbe Strike wiederkehrt.</div>`;
  el.innerHTML=h;
}

function renderGamma(){
  const d=S.data, el=$("p-gamma");
  if(d.net_gex==null){ el.innerHTML='<div class="empty">Keine Optionskette verfügbar.</div>'; return; }
  const g=d.greeks||{};
  let h=`<div class="tiles">
    <div class="tile"><div class="l">Netto-GEX je Punkt</div>
      <div class="v" style="color:${d.net_gex<0?"var(--warn)":"var(--support)"}">${fmtM(d.net_gex)}</div>
      <div class="n">${d.regime==="short"?"Dealer verstärken Bewegungen":"Dealer dämpfen Bewegungen"}</div></div>
    <div class="tile"><div class="l">davon 0DTE</div><div class="v">${fmtM(d.net_gex_zdte)}</div>
      <div class="n">Verfall heute</div></div>
    <div class="tile"><div class="l">Zero-Gamma</div><div class="v">${px(d.flip)}</div>
      <div class="n">${d.flip?`${fmt(Math.abs(d.spot-d.flip))} Pkt ${d.spot>d.flip?"darunter":"darüber"}`:"—"}</div></div>
    <div class="tile"><div class="l">Max Pain</div><div class="v">${px(d.max_pain)}</div>
      <div class="n">Verfalls-Gravitation</div></div>
    <div class="tile"><div class="l">Gamma-Pin</div><div class="v">${px(d.gamma_pin)}</div>
      <div class="n">stärkster Einzelmagnet</div></div>
    <div class="tile"><div class="l">Put / Call</div><div class="v">${d.pcr?d.pcr.toFixed(2):"—"}</div>
      <div class="n">${fmtM(d.put_oi)} Put · ${fmtM(d.call_oi)} Call</div></div>
    <div class="tile"><div class="l">Netto-Vanna</div><div class="v">${fmtM(g.vanna)}</div>
      <div class="n">je Vola-Punkt</div></div>
    <div class="tile"><div class="l">Netto-Charm</div><div class="v">${fmtM(g.charm)}</div>
      <div class="n">Delta-Zerfall je Tag</div></div>
  </div>`;

  const walls=[...(d.call_walls||[]).map(w=>({...w,r:"resist"})),
               ...(d.put_walls||[]).map(w=>({...w,r:"support"}))].sort((a,b)=>b.price-a.price);
  if(walls.length){
    const mx=Math.max(...walls.map(w=>w.oi))||1;
    h+=`<div class="sec">OI-Wände · ±6 % um den Kurs</div>`+walls.map(w=>`
      <div class="brow"><span class="k" style="color:var(--${w.r})">${px(w.price)}</span>
      <span class="bar" style="--c:var(--${w.r})"><i style="width:${(w.oi/mx*100).toFixed(0)}%"></i></span>
      <span class="v">${fmtM(w.oi)}</span></div>`).join("");
  }
  if((d.fresh_flow||[]).length){
    const mx=Math.max(...d.fresh_flow.map(x=>x.voi))||1;
    h+=`<div class="sec">Fresh Flow · Volumen gegen stehendes OI</div>`+d.fresh_flow.map(x=>`
      <div class="brow"><span class="k">${px(x.strike)}</span>
      <span class="bar" style="--c:var(--agent)"><i style="width:${(x.voi/mx*100).toFixed(0)}%"></i></span>
      <span class="v">${x.voi.toFixed(1)}×</span></div>`).join("");
  }
  if((d.expiries||[]).length){
    const mx=Math.max(...d.expiries.map(e=>Math.abs(e.single)))||1;
    h+=`<div class="sec">Verfallsleiter · Netto-Gamma je Verfall</div>`+d.expiries.map(e=>`
      <div class="brow"><span class="k" style="font-size:11.5px">${e.expiry.slice(5)}</span>
      <span class="bar" style="--c:${e.single<0?"var(--warn)":"var(--support)"}"><i style="width:${(Math.abs(e.single)/mx*100).toFixed(0)}%"></i></span>
      <span class="v">${fmtM(e.single)}</span></div>`).join("");
  }
  h+=`<div class="foot">Vorzeichen: Calls positiv, Puts negativ — die übliche Annahme, nicht gemessen.
    Für gemessene Vorzeichen bräuchte es die Fluss-Klassifikation aus zwei Snapshots.
    Zero-Gamma wird über ein Preisgitter neu gerechnet, nicht als stärkster Gamma-Strike genommen:
    der klebt per Konstruktion am Geld.</div>`;
  el.innerHTML=h;
}

async function ask(){
  const inp=$("askInput"); const t=(inp.value||"").trim();
  if(!t||S.busy) return;
  S.busy=true; $("askBtn").disabled=true; inp.value=""; inp.blur(); buzz(8);
  try{
    await fetch("/api/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({market:S.market,text:t})});
    await loadMessages();
    $("v-agent").scrollTop=$("v-agent").scrollHeight;
  }catch(e){}
  S.busy=false; const b=$("askBtn"); if(b) b.disabled=false;
}

const track=$("track");

// Nach unten wischen schliesst - auf einem Telefon die erwartete Geste,
// und der einzige verlaessliche Weg, wenn das Sheet fast den ganzen
// Bildschirm fuellt und "daneben tippen" kaum Flaeche laesst.
(function(){
  const sh=$("sheet"); let y0=null;
  const zone=$("grabzone");
  const start=e=>{ y0=e.touches[0].clientY; sh.style.transition="none"; };
  const move=e=>{
    if(y0==null) return;
    const dy=Math.max(0, e.touches[0].clientY-y0);
    sh.style.transform=`translateY(${dy}px)`;
  };
  const end=e=>{
    if(y0==null) return;
    const dy=Math.max(0,(e.changedTouches[0]?.clientY??y0)-y0);
    sh.style.transition=""; sh.style.transform="";
    if(dy>70){ buzz(8); closeSheet(); }
    y0=null;
  };
  [zone, sh].forEach(el=>{
    el.addEventListener("touchstart",start,{passive:true});
    el.addEventListener("touchmove",move,{passive:true});
    el.addEventListener("touchend",end,{passive:true});
  });
})();

/** Preisraum messen: eine Ablesung aus der Plattform des Nutzers.

    Bewusst keine Formel. Die Basis eines Future haengt an Restlaufzeit,
    Zins und Dividenden, und darauf legt jeder Broker seinen eigenen
    Aufschlag - was die Plattform anzeigt, weiss nur die Plattform. Eine
    einzige Ablesung ist genauer als jede Schaetzung. */
function spaceSheet(){
  const sp = S.data?.space || {};
  const ref = S.data?.spot;
  const alter = sp.at ? Math.round((Date.now()/1000 - sp.at)/3600) : null;
  openSheet(`<div class="sh-t">Preisraum der Anzeige</div>`
    +`<div class="sh-n">Der Terminal rechnet im Index-Preisraum — dort stehen die
      Optionsketten, die Wände und das Zero-Gamma. Gehandelt wird ein CFD, und der
      steht nicht auf demselben Wert: ein CFD auf den Nasdaq 100 folgt dem Future
      und trägt dessen Basis, je nach Restlaufzeit einige zehn Punkte.
      <br><br>Trag den Kurs ein, den deine Plattform <b>gerade jetzt</b> zeigt.
      Der Versatz wird daraus gemessen und auf jede angezeigte Zahl gelegt —
      Kerzen, Wände und Achse bleiben unverändert aufeinander liegen, denn
      gerechnet wird weiter im Index-Preisraum.</div>`
    +`<div class="sp-row"><label>Instrument</label>
        <input id="spName" type="text" value="${esc(sp.name||"USTEC")}"
               maxlength="12" autocomplete="off"></div>`
    +`<div class="sp-row"><label>Kurs jetzt</label>
        <input id="spQuote" type="text" inputmode="decimal"
               placeholder="${ref?Math.round(ref+ (sp.offset||0)):"z. B. 29465"}"
               autocomplete="off"></div>`
    +`<div class="sh-n">Referenz im selben Moment: <b>${fmt(ref)}</b> (Index)
      ${sp.name?`<br>Aktuell: ${esc(sp.name)} ${sgn(Math.round(sp.offset))} Punkte,
        gemessen vor ${alter!=null?(alter<1?"unter einer Stunde":alter+" h"):"—"}
        ${sp.stale?`<br><b style="color:var(--warn)">Älter als ein Tag — die Basis
          läuft zum Verfall hin auf null zu, bitte nachmessen.</b>`:""}`:""}</div>`
    +`<div class="sp-btns">
        <button class="sp-b prim" id="spSave">Messen</button>
        ${sp.name?`<button class="sp-b" id="spClear">Zurück auf Index</button>`:""}
      </div>`
    +`<div id="spMsg" class="sh-n"></div>`);
  const msg = t => $("spMsg").innerHTML = t;
  $("spSave").onclick = async () => {
    const raw = ($("spQuote").value||"").replace(/\./g,"").replace(",",".").trim();
    const q = parseFloat(raw);
    if(!isFinite(q)){ msg('<b style="color:var(--warn)">Bitte einen Kurs eingeben.</b>'); return; }
    try{
      const r = await fetch(`/api/space?market=${S.market}`, {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name: $("spName").value, quote: q})});
      const d = await r.json();
      if(!d.ok){ msg(`<b style="color:var(--warn)">${esc(d.error||"nicht übernommen")}</b>`); return; }
      buzz(12); closeSheet(); await load();
    }catch(e){ msg('<b style="color:var(--warn)">Server nicht erreichbar.</b>'); }
  };
  if($("spClear")) $("spClear").onclick = async () => {
    await fetch(`/api/space?market=${S.market}`, {method:"DELETE"});
    buzz(8); closeSheet(); await load();
  };
}

$("idbtn").onclick=()=>{
  const src=S.overview.length?S.overview:Object.keys(SYM).map(k=>({key:k,name:k}));
  openSheet(`<div class="sh-t">Markt</div>`+src.map(m=>`
    <div class="si ${m.key===S.market?"sel":""}" data-m="${m.key}">${esc(m.name)}
      <span class="sub">${m.key===S.market && S.data?.space?.name
        ? esc(S.data.space.name) : (SYM[m.key]||m.key)}${
        m.spot?" · "+(m.key===S.market?px:fmt)(m.spot):""}</span></div>`).join("")
    +`<div class="sh-t" style="padding-top:14px">Preisraum der Anzeige</div>`
    +`<div class="si" id="spOpen">${S.data?.space?.name
        ? esc(S.data.space.name)+" "+sgn(Math.round(S.data.space.offset))+" Punkte"
        : "Index-Preisraum"}
        <span class="sub">${S.data?.space?.name
          ? (S.data.space.stale?"nachmessen ⚠":"nachmessen")
          : "auf deinen CFD einstellen"}</span></div>`
    +`<div class="sh-n">Kurse und Strikes kommen bei jedem Markt aus derselben Cboe-Kette — sie liegen
      im selben Preisraum und brauchen keine Umrechnung. Dein CFD steht daneben: er folgt dem
      Future und trägt dessen Basis. Der Versatz wird gemessen, nicht geschätzt.</div>`
    // Warum der Kurs verzoegert ist, und was dagegen hilft.
    //
    // In der Kopfzeile steht "15 min verzoegert", aber nicht, dass sich
    // das aendern LAESST. Ohne diesen Hinweis liest sich die Zeile wie
    // eine Eigenschaft der App statt wie ein fehlender Schritt.
    +`<div class="sh-t" style="padding-top:14px">Live-Kurse</div>`
    +`<div class="sh-n">${S.data?.live?.live
      ? `Läuft: der Chart kommt gerade aus <b>${esc(S.data.live.symbol||"der Brücke")}</b>
         ${S.data.live.src==="oanda"
            ? `— das ist <b>OANDAs</b> CFD über den Server, nicht der deines Brokers.
               Der Unterschied ist Spread und Finanzierung, ein paar Punkte, und der
               gemessene Versatz gleicht ihn aus. Für deinen Kurs auf den Punkt:
               <b>START-BRUECKE.bat</b> starten oder cTrader verbinden, beide haben
               Vorrang.`
            : S.data.live.src==="ctrader"
            ? `— dein eigener Broker über cTrader, ohne dass dein PC laufen muss.`
            : `— dein eigener Broker über die Brücke.`}
         Letzter Tick vor ${Math.round(S.data.live.tick_age||0)} Sekunden.`
      : `Der Chart hängt gerade an der öffentlichen Cboe-Quelle, und die ist
         <b>15 Minuten verzögert</b> — gemessen, nicht geschätzt: auch der
         Cboe-Kurs selbst läuft den Kerzen nicht voraus. Eine kostenlose
         Echtzeitquelle für den Nasdaq gibt es nicht.
         <br><br>Deinen echten Kurs hat nur dein Broker. Die Brücke holt ihn
         aus MetaTrader 5 auf deinem PC:
         <b>bridge/START-BRUECKE.bat</b> doppelklicken, MT5 offen lassen —
         dann steht hier LIVE und der Punkt oben wird grün.
         <br><br>Ohne PC geht es auf zwei Wegen:
         <br>• <b>cTrader</b> (FTMO und andere) — dein <i>eigener</i> Kurs über den
         Server. Kennung und Geheimnis bei Render eintragen, dann einmal
         <b>/api/ctrader/login</b> öffnen und zustimmen.
         <br>• <b>OANDA</b> — ein kostenloses Übungskonto, Schlüssel als
         <b>OANDA_TOKEN</b> bei Render. Das ist dann OANDAs CFD, nicht deiner.
         <br><br>Rangfolge: Brücke → cTrader → OANDA → verzögert. Du kannst alles
         nebeneinander einrichten; der Chart nimmt automatisch die beste Quelle.`}</div>`);
  $("spOpen").onclick = () => spaceSheet();
  $("sheetBody").querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>switchMarket(el.dataset.m));
};

function layerSheet(){
  const items=[["tpo","TPO-Profil","wo der Markt WIE LANGE war"],
               ["va","Value Area","wo 70 % des Volumens liefen"],
               ["gpbox","GP-Beschriftung","Kasten am Level statt nur an der Skala"],
               ["gcurve","Gamma-Kurve","nur beim Herauszoomen aussagekräftig"],
               ["orbs","Wand-Verlauf","Orb-Ketten aus allen Optionsketten"],
               ["fix","Fixe Level","aus dem Zonenbuch"],
               ["live","Geisterlinien","wohin die Wand seither wanderte"],
               ["zonen","Konfluenz-Zonen","getönte Bänder"],
               ["profil","Volumenprofil","wo WIEVIEL gehandelt wurde"],
               ["session","Struktur-Marken","POC, Vortageshoch und -tief"]];
  openSheet(`<div class="sh-t">Struktur im Chart</div>`+items.map(([k,l,s])=>`
    <div class="si ${S.layers[k]?"on":""}" data-l="${k}"><span class="box"></span>${l}
      <span class="sub">${s}</span></div>`).join("")
    +`<div class="sh-t" style="padding-top:14px">Volumenprofil</div>`
    +[["heat","Innen / Außen","Weiß in der Value Area, Grau außerhalb"],
      ["side","Optionsseite","Violett = Put-lastig, Gold = Call-lastig"]]
      .map(([k,l,sub])=>`<div class="si ${S.profileMode===k?"sel":""}" data-pm="${k}">${l}
        <span class="sub">${sub}</span></div>`).join("")
    +`<div class="sh-n">Volumenprofil und TPO sind zwei verschiedene Fragen, nicht zwei
      Darstellungen derselben. Das Volumenprofil misst gehandeltes Volumen je Preis
      (CME-Kontrakte aus dem Future, sonst das Stückvolumen des ETF). Das TPO zählt,
      in wie vielen 30-Minuten-Perioden ein Preis überhaupt berührt wurde — ohne
      Volumen. Beide laufen gleichzeitig und dürfen sich widersprechen: genau dieser
      Widerspruch ist die Aussage.</div>`
    +`<div class="sh-n">Die Farbe liegt jetzt beim TPO: seine Blöcke laufen von Blau für
      Preise, durch die der Markt nur streifte, bis Rot für die, an denen er den halben
      Tag stand. Beim Volumenprofil steckt die Stärke schon in der Balkenlänge, deshalb
      trägt die Farbe dort die andere Frage — Weiß heißt innerhalb der Value Area,
      Schiefergrau außerhalb.</div>`
    +`<div class="sh-n">Rollenfarben statt Quellfarben: Gold ist Widerstand, Violett ist Support,
      Beige ist Pivot. Woher ein Level stammt, steht im Text — nie in der Farbe.</div>`);
  $("sheetBody").querySelectorAll("[data-pm]").forEach(el=>el.onclick=()=>{
    S.profileMode=el.dataset.pm; buzz(6);
    $("sheetBody").querySelectorAll("[data-pm]").forEach(x=>
      x.classList.toggle("sel", x.dataset.pm===S.profileMode));
    draw();
  });
  $("sheetBody").querySelectorAll("[data-l]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.l; S.layers[k]=!S.layers[k];
    el.classList.toggle("on",S.layers[k]); buzz(6); draw();
  });
}

// ======================= Start =======================
addEventListener("resize",()=>{ resize(); track.scrollLeft=S.view*track.clientWidth; });
new ResizeObserver(resize).observe($("cvwrap"));
resize();
// Kerzen zuerst, dann der Rest.
//
// Der volle Snapshot braucht beim kalten Dienst gemessen gut drei
// Sekunden - er baut Kette, Gammagitter, Waende, Profil und TPO. Die
// Kerzen allein sind in einem Bruchteil da, und sie sind das, was man
// beim Aufmachen sehen will. Der Rest legt sich darueber, sobald er da
// ist; bis dahin steht ein Chart statt eines Ladezeichens.
ladeKerzen().then(()=>load());
loadOverview(); loadMessages(); loadPlan(); loadTrails();
setInterval(()=>{ load(); loadMessages(); }, 20000);
setInterval(loadOverview, 60000);
setInterval(loadTrails, 60000);
</script>
