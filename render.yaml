services:
  # Bestehender Bilddienst - unveraendert.
  - type: web
    name: pixelmind-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false   # you enter this in Render dashboard
    plan: free

  # ChartTerminal Cloud - die Handy-Fassung.
  # Genau EIN Worker: der Beobachtungs-Thread des Agenten darf nicht
  # mehrfach laufen, sonst meldet er jedes Ereignis doppelt.
  - type: web
    name: chartterminal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 terminal_app:app
    healthCheckPath: /health
    envVars:
      # Verbindungszeichenfolge aus Neon. Ohne sie laeuft der Dienst
      # weiter, verliert aber bei jedem Neustart Zonenbuch und Verlauf.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false   # optional - ohne Key antwortet der Agent aus der Engine
      - key: SCAN_INTERVAL
        value: "20"
      - key: AGENT_DAY_BUDGET
        value: "1400"
      - key: ANCHOR_HOUR
        value: "6"      # Tagesanker in UTC, wie TAGES_ANKER_STUNDE im Original
      # Wachhalten nur waehrend der Handelszeit. Rund um die Uhr wuerde
      # ein einzelner Dienst die 750 Freistunden des Accounts aufbrauchen.
      - key: KEEPALIVE_HOURS
        value: "12-21"  # UTC, deckt Vorboerse bis Abrechnung ab
      - key: KEEPALIVE_WEEKDAYS
        value: "1"
    plan: free
